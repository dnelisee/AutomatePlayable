<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
    <title>Castle Clasher - Playable Ad Concept</title>
    <style>
        :root {
            --ui-font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --color-player: #3498db;
            --color-enemy: #e74c3c;
            --color-projectile: #f1c40f;
            --color-rip: #7f8c8d;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #2c3e50;
            background-image: url('assets/background.png'); /* Placeholder, replace or download image */
            background-size: cover;
            background-position: center;
            font-family: var(--ui-font);
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- Game World --- */
        #game-view {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transition: transform 0.5s ease-out; /* Camera zoom effect */
            transform-origin: center center;
        }

        .object {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Castles */
        #castle-player {
            width: 150px; height: 180px;
            background-color: #34495e;
            border: 4px solid var(--color-player);
            left: 50px; bottom: 120px;
            transition: transform 0.1s linear; /* For screen shake */
        }

        #castle-enemy {
            width: 150px; height: 180px;
            background-color: #7f8c8d;
            border: 4px solid var(--color-enemy);
            right: 50px; bottom: 120px;
            transition: transform 0.1s linear;
        }

        /* Characters / RIP */
        .character {
            width: 30px; height: 40px;
            background-color: var(--color-player);
            border-radius: 5px;
            top: -50px; /* On top of castle */
        }
        #castle-enemy .character { background-color: var(--color-enemy); }

        .rip-grave {
            position: absolute;
            width: 25px; height: 35px;
            background-color: var(--color-rip);
            border-radius: 3px;
            display: none;
            justify-content: center; align-items: center;
            font-size: 10px; font-weight: bold;
        }

        /* Projectiles */
        .projectile {
            width: 10px; height: 10px;
            background-color: var(--color-projectile);
            border-radius: 50%;
            position: absolute;
        }

        /* Terrain */
        #ground {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 120px;
            background-color: #27ae60;
        }

        /* --- UI Elements --- */
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; /* Let clicks pass to interaction */
        }

        .screen-flash {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: red;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
        }

        /* Health Bars */
        .hp-bar-container {
            width: 120px; height: 10px;
            background-color: rgba(255,255,255,0.3);
            border-radius: 5px;
            position: absolute;
        }
        .hp-bar-fill {
            height: 100%;
            background-color: #2ecc71;
            border-radius: 5px;
            width: 100%;
            transition: width 0.3s ease-in-out;
        }
        #hp-player { left: 65px; bottom: 310px; }
        #hp-enemy { right: 65px; bottom: 310px; }

        /* Character Selection UI */
        #character-selection {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 15px;
            pointer-events: auto;
        }
        .char-icon {
            width: 60px; height: 60px;
            background-color: var(--color-player);
            border: 3px solid transparent;
            border-radius: 10px;
            cursor: pointer;
        }
        .char-icon.selected {
            border-color: #f1c40f;
            transform: scale(1.1);
        }

        /* Aiming Feedback */
        #aim-trajectory {
            position: absolute;
            pointer-events: none;
        }
        .traj-dot {
            position: absolute;
            width: 6px; height: 6px;
            background-color: white;
            border-radius: 50%;
            opacity: 0.7;
        }

        #aim-cursor {
            width: 32px; height: 32px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 9l-6 6 6 6"></path><path d="M4 15h11a4 4 0 1 0 0-8h-3"></path></svg>'); /* Back arrow as finger */
            background-size: contain;
            position: absolute;
            display: none;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="game-view">
        <div id="ground"></div>
        
        <!-- Player Castle & Characters -->
        <div id="castle-player" class="object">
            <div id="player-char-1" class="character" style="left: 15px;"></div>
            <div id="player-char-2" class="character" style="left: 60px; background-color: #9b59b6;"></div>
            <div id="player-char-3" class="character" style="left: 105px; background-color: #e67e22;"></div>
            <div id="player-rip-1" class="rip-grave" style="left: 17px; top: -47px;">RIP</div>
            <div id="player-rip-2" class="rip-grave" style="left: 62px; top: -47px;">RIP</div>
            <div id="player-rip-3" class="rip-grave" style="left: 107px; top: -47px;">RIP</div>
        </div>

        <!-- Enemy Castle & Characters -->
        <div id="castle-enemy" class="object">
            <div id="enemy-char-1" class="character" style="right: 15px;"></div>
            <div id="enemy-char-2" class="character" style="right: 60px;"></div>
            <div id="enemy-char-3" class="character" style="right: 105px;"></div>
            <div id="enemy-rip-1" class="rip-grave" style="right: 17px; top: -47px;">RIP</div>
            <div id="enemy-rip-2" class="rip-grave" style="right: 62px; top: -47px;">RIP</div>
            <div id="enemy-rip-3" class="rip-grave" style="right: 107px; top: -47px;">RIP</div>
        </div>

        <div id="projectile-container"></div>
    </div>

    <div id="ui-layer">
        <div id="damage-flash" class="screen-flash"></div>

        <div id="hp-player" class="hp-bar-container">
            <div id="hp-player-fill" class="hp-bar-fill"></div>
        </div>
        <div id="hp-enemy" class="hp-bar-container">
            <div id="hp-enemy-fill" class="hp-bar-fill"></div>
        </div>

        <div id="aim-trajectory"></div>
        <div id="aim-cursor"></div>

        <div id="character-selection">
            <div class="char-icon selected" data-char="1" onclick="selectCharacter(1)"></div>
            <div class="char-icon" data-char="2" style="background-color: #9b59b6;" onclick="selectCharacter(2)"></div>
            <div class="char-icon" data-char="3" style="background-color: #e67e22;" onclick="selectCharacter(3)"></div>
        </div>
    </div>

    <script>
        // --- Game Config & State ---
        const config = {
            gravity: 0.8,
            projectileSpeed: 15,
            playerStartHP: 100,
            enemyStartHP: 100,
            fissureThresholds: [5, 10, 30, 50, 70, 80, 90, 100], // Reverse percentages for visual
            enemyTurnDelay: 1500, // ms
            cameraMoveDuration: 800, // ms
        };

        let state = {
            turn: 'player', // 'player', 'enemy', 'moving', 'animating'
            playerHP: config.playerStartHP,
            enemyHP: config.enemyStartHP,
            selectedCharacter: 1,
            playerDeadCount: 0,
            enemyDeadCount: 0,
            isAiming: false,
            aimStart: { x: 0, y: 0 },
            aimCurrent: { x: 0, y: 0 },
        };

        // --- DOM Elements ---
        const view = document.getElementById('game-view');
        const projContainer = document.getElementById('projectile-container');
        const trajContainer = document.getElementById('aim-trajectory');
        const aimCursor = document.getElementById('aim-cursor');
        const charSelection = document.getElementById('character-selection');
        const damageFlash = document.getElementById('damage-flash');
        
        // --- Initialization ---
        function init() {
            // Start camera on enemy castle
            moveCamera('enemy', 0);
            updateHP('player', 0);
            updateHP('enemy', 0);
            
            // Wait, then transition to player turn
            setTimeout(() => {
                transitionToPlayerTurn();
            }, 2000);

            setupInteraction();
        }

        // --- Camera Control ---
        function moveCamera(target, duration = config.cameraMoveDuration) {
            state.turn = 'moving';
            view.style.transitionDuration = `${duration}ms`;
            
            const playerCastle = document.getElementById('castle-player');
            const enemyCastle = document.getElementById('castle-enemy');

            if (target === 'player') {
                // Zoom in on inside of player castle
                const targetX = playerCastle.offsetLeft + 75; 
                const targetY = playerCastle.offsetTop - 50; 
                view.style.transform = `scale(2.5) translate(${window.innerWidth/2 - targetX}px, ${window.innerHeight/2 - targetY}px)`;
            } else if (target === 'enemy') {
                // Zoom in on enemy castle
                const targetX = enemyCastle.offsetLeft + 75;
                const targetY = enemyCastle.offsetTop - 50;
                view.style.transform = `scale(2.5) translate(${window.innerWidth/2 - targetX}px, ${window.innerHeight/2 - targetY}px)`;
            } else if (target === 'both') {
                // Show entire battlefield
                view.style.transform = 'scale(1) translate(0px, 0px)';
            }
        }

        // --- Turns & Gameplay Loop ---
        function transitionToPlayerTurn() {
            state.turn = 'moving';
            moveCamera('player');
            charSelection.style.display = 'flex';
            
            setTimeout(() => {
                state.turn = 'player';
                // Inside view logic: Hide castle shell (using border as shell)
                document.getElementById('castle-player').style.borderColor = 'transparent';
                document.getElementById('castle-player').style.backgroundColor = '#d35400'; // Inside wood color
            }, config.cameraMoveDuration);
        }

        function endPlayerTurn(vx, vy) {
            state.turn = 'moving';
            charSelection.style.display = 'none';
            // Show shell again
            document.getElementById('castle-player').style.borderColor = 'var(--color-player)';
            document.getElementById('castle-player').style.backgroundColor = '#34495e';

            // Beam of missiles
            fireProjectile('player', vx, vy, -0.5);
            fireProjectile('player', vx, vy);
            fireProjectile('player', vx, vy, 0.5);

            // Camera accompanies the projectiles to target
            moveCamera('both', config.cameraMoveDuration / 2);
            setTimeout(() => moveCamera('enemy', config.cameraMoveDuration / 2), config.cameraMoveDuration / 2);
        }

        function startEnemyTurn() {
            state.turn = 'moving';
            moveCamera('enemy');
            
            setTimeout(() => {
                state.turn = 'enemy';
                
                // Enemy AI: Simple fixed arc towards player
                setTimeout(() => {
                    fireEnemyMissiles();
                }, config.enemyTurnDelay);
            }, config.cameraMoveDuration);
        }

        function fireEnemyMissiles() {
            const vx = -config.projectileSpeed; // Angle towards player
            const vy = -12; // Arcing shot
            
            // Enemy fires 2 sine-wave birds (abstracted here as 2 arcing shots)
            fireProjectile('enemy', vx, vy, 0.2); 
            fireProjectile('enemy', vx, vy, -0.2);

            moveCamera('both');
            setTimeout(() => moveCamera('player'), config.cameraMoveDuration / 2);
        }

        function nextTurn() {
            moveCamera('both');
            setTimeout(() => {
                if (state.playerHP <= 0 || state.enemyHP <= 0) {
                    endGame();
                    return;
                }
                
                if (state.turn === 'enemy') {
                    transitionToPlayerTurn();
                } else {
                    startEnemyTurn();
                }
            }, config.cameraMoveDuration);
        }

        // --- Projectile Physics ---
        function fireProjectile(origin, vx_base, vy_base, spread = 0) {
            const proj = document.createElement('div');
            proj.className = 'projectile';
            projContainer.appendChild(proj);

            const startPos = getProjectileSpawnPos(origin);
            let px = startPos.x;
            let py = startPos.y;
            
            // Apply spread
            let vx = vx_base + spread;
            let vy = vy_base;

            const startTime = Date.now();
            
            function animate() {
                const time = (Date.now() - startTime) / 100;
                
                px += vx;
                vy += config.gravity;
                py += vy;

                proj.style.left = `${px}px`;
                proj.style.bottom = `${py}px`;

                // Collision Check
                if (checkCollision(origin, px, py)) {
                    handleCollision(origin, px, py);
                    proj.remove();
                    return; // Stop animation
                }

                // Ground/Offscreen check
                if (py < 120 || px < -20 || px > window.innerWidth + 20) {
                    proj.remove();
                    // If no more projectiles, go to next turn
                    if (projContainer.children.length === 0) {
                         setTimeout(nextTurn, 500);
                    }
                    return;
                }

                requestAnimationFrame(animate);
            }
            animate();
        }

        function getProjectileSpawnPos(origin) {
            if (origin === 'player') {
                const c = document.getElementById('castle-player');
                return { x: c.offsetLeft + c.offsetWidth, y: c.offsetTop + c.offsetHeight + 50 }; // Rough inside view pos
            } else {
                const c = document.getElementById('castle-enemy');
                return { x: c.offsetLeft, y: c.offsetTop + c.offsetHeight + 50 };
            }
        }

        function checkCollision(origin, px, py) {
            const target = (origin === 'player') ? 'enemy' : 'player';
            const castle = document.getElementById(`castle-${target}`);
            const rect = castle.getBoundingClientRect();
            // Convert page coords to view coords for simplified check
            const viewRect = view.getBoundingClientRect();
            const localX = px + viewRect.left;
            const localY = (window.innerHeight - py) + viewRect.top;

            return (
                localX > rect.left && localX < rect.right &&
                localY > rect.top && localY < rect.bottom
            );
        }

        function handleCollision(origin, px, py) {
            const target = (origin === 'player') ? 'enemy' : 'player';
            const damage = 10;
            updateHP(target, damage);
            
            createExplosion(px, py);
            flashScreen();
            shakeCastle(target);
            checkCharacterDeath(target);

            // Finalizing turn transition if this was the last projectile
            if (projContainer.children.length <= 1) { // Current one is about to be removed
                 setTimeout(nextTurn, 1000);
            }
        }

        // --- Visual Effects & Logic ---
        function updateHP(target, damage) {
            const hpVar = `${target}HP`;
            state[hpVar] -= damage;
            if (state[hpVar] < 0) state[hpVar] = 0;
            if (state[hpVar] > 100) state[hpVar] = 100;

            const pct = state[hpVar];
            document.getElementById(`hp-${target}-fill`).style.width = `${pct}%`;
            
            // Update Fissures (General shake, color change placeholder)
            const castle = document.getElementById(`castle-${target}`);
            let fissureLevel = 0;
            // Reverse threshold for health 100 -> 0. Fissure 100% -> 0% visual.
            const thresholdPct = 100 - pct;
            for (let i = 0; i < config.fissureThresholds.length; i++) {
                if (thresholdPct >= config.fissureThresholds[i]) {
                    fissureLevel = i;
                }
            }
            // Abstracted fissure visual: background color darkens
            const colorStep = 255 - (fissureLevel * 20);
            if(target === 'enemy') castle.style.backgroundColor = `rgb(${colorStep}, ${colorStep-50}, ${colorStep-50})`;
            else castle.style.backgroundColor = `rgb(${colorStep-50}, ${colorStep}, ${colorStep-50})`;
        }

        function shakeCastle(target) {
            const castle = document.getElementById(`castle-${target}`);
            const originalTransform = castle.style.transform;
            let count = 0;
            const interval = setInterval(() => {
                const offsetX = (Math.random() - 0.5) * 10;
                const offsetY = (Math.random() - 0.5) * 10;
                castle.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
                count++;
                if (count > 5) {
                    clearInterval(interval);
                    castle.style.transform = originalTransform;
                }
            }, 50);
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'projectile'; // Reuse styling
                particle.style.backgroundColor = '#e74c3c'; // Red debris
                particle.style.left = `${x}px`;
                particle.style.bottom = `${y}px`;
                particle.style.width = `${Math.random()*8+2}px`;
                particle.style.height = particle.style.width;
                projContainer.appendChild(particle);

                // Simple burst physics
                let vx = (Math.random() - 0.5) * 10;
                let vy = (Math.random() - 0.5) * 10 - 5;
                
                let pTime = 0;
                function animateP() {
                    if (pTime > 20) { particle.remove(); return; }
                    particle.style.left = `${parseFloat(particle.style.left) + vx}px`;
                    particle.style.bottom = `${parseFloat(particle.style.bottom) + vy}px`;
                    vy += 1; // Gravity
                    pTime++;
                    requestAnimationFrame(animateP);
                }
                animateP();
            }
        }

        function flashScreen() {
            damageFlash.style.opacity = 0.5;
            setTimeout(() => { damageFlash.style.opacity = 0; }, 150);
        }

        function checkCharacterDeath(target) {
            const totalHP = target === 'player' ? config.playerStartHP : config.enemyStartHP;
            const currentHP = state[`${target}HP`];
            // One RIP per 1/3 HP lost
            const numDeadNeeded = Math.floor((totalHP - currentHP) / (totalHP / 3));
            
            if (numDeadNeeded > state[`${target}DeadCount`]) {
                state[`${target}DeadCount`]++;
                const charId = state[`${target}DeadCount`];
                document.getElementById(`${target}-char-${charId}`).style.display = 'none';
                document.getElementById(`${target}-rip-${charId}`).style.display = 'flex';
            }
        }

        // --- Interaction / Aiming ---
        function setupInteraction() {
            window.addEventListener('mousedown', startAim);
            window.addEventListener('mousemove', continueAim);
            window.addEventListener('mouseup', releaseAim);
            window.addEventListener('touchstart', startAim);
            window.addEventListener('touchmove', continueAim);
            window.addEventListener('touchend', releaseAim);
        }

        function selectCharacter(id) {
            state.selectedCharacter = id;
            document.querySelectorAll('.char-icon').forEach(el => el.classList.remove('selected'));
            document.querySelector(`.char-icon[data-char="${id}"]`).classList.add('selected');
        }

        function getMousePos(e) {
            let cx, cy;
            if (e.touches) {
                cx = e.touches[0].clientX;
                cy = e.touches[0].clientY;
            } else {
                cx = e.clientX;
                cy = e.clientY;
            }
            return { x: cx, y: cy };
        }

        function startAim(e) {
            if (state.turn !== 'player' || state.isAiming) return;
            state.isAiming = true;
            state.aimStart = getMousePos(e);
            state.aimCurrent = state.aimStart;
            trajContainer.innerHTML = ''; // Clear old trajectory
            aimCursor.style.display = 'block';
            updateAimCursorPos();
        }

        function continueAim(e) {
            if (!state.isAiming) return;
            state.aimCurrent = getMousePos(e);
            updateAimCursorPos();
            drawTrajectory();
        }

        function releaseAim(e) {
            if (!state.isAiming) return;
            state.isAiming = false;
            aimCursor.style.display = 'none';
            trajContainer.innerHTML = '';

            // Calculate launch velocity based on drag vector
            const dx = state.aimStart.x - state.aimCurrent.x;
            const dy = state.aimCurrent.y - state.aimStart.y; // Y inverted in screens
            
            // Normalize and scale velocity
            const vMax = config.projectileSpeed * 1.5;
            const dMax = 200; // max drag distance
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), dMax);
            const scale = Math.max(dist / dMax, 0.2); // Min speed

            const vx = (dx / dist) * vMax * scale;
            const vy = (dy / dist) * vMax * scale;

            endPlayerTurn(vx, vy);
        }

        function updateAimCursorPos() {
            aimCursor.style.left = `${state.aimCurrent.x - 16}px`;
            aimCursor.style.top = `${state.aimCurrent.y - 16}px`;
        }

        function drawTrajectory() {
            trajContainer.innerHTML = '';
            
            // Abstract launch pos (inside castle view)
            const playerCastle = document.getElementById('castle-player');
            const spawnX = playerCastle.offsetLeft + playerCastle.offsetWidth;
            const spawnY = window.innerHeight - (playerCastle.offsetTop + playerCastle.offsetHeight + 50);

             // Calculate launch velocity (reused logic)
            const dx = state.aimStart.x - state.aimCurrent.x;
            const dy = state.aimCurrent.y - state.aimStart.y;
            const vMax = config.projectileSpeed * 1.5;
            const dMax = 200;
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), dMax);
            const scale = Math.max(dist / dMax, 0.2);
            let vx = (dx / dist) * vMax * scale;
            let vy = (dy / dist) * vMax * scale;

            let px = spawnX;
            let py = spawnY;

            // Simple trajectory simulation dots
            for (let i = 0; i < 15; i++) {
                px += vx;
                vy += config.gravity;
                py += vy;

                if (py < 120 || px > window.innerWidth) break; // Ground/offscreen

                const dot = document.createElement('div');
                dot.className = 'traj-dot';
                dot.style.left = `${px}px`;
                dot.style.bottom = `${py}px`;
                dot.style.opacity = 1 - (i / 15); // Fade out
                dot.style.transform = `scale(${1 - (i/25)})`; // Size decrease
                trajContainer.appendChild(dot);
            }
        }

        function endGame() {
            moveCamera('both');
            const winner = state.playerHP > 0 ? 'USER' : 'MACHINE';
            setTimeout(() => {
                alert(`PARTIE TERMINÉE ! ${winner} GAGNE.`);
                // Reset (simplified)
                state.playerHP = config.playerStartHP;
                state.enemyHP = config.enemyStartHP;
                location.reload(); 
            }, 1000);
        }

        // --- Start everything ---
        window.onload = init;

    </script>
</body>
</html>

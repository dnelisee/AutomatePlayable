const imageCache = {};
async function preloadAssets(){
  const toLoad = {
    Background : BackgroundB64,
    Blue_Castle: Blue_CastleB64,
    Red_Castle : Red_CastleB64,
    Projectile_1: Projectile_1B64,
    Projectile_2: Projectile_2B64,
    Weapon_1   : Weapon_1B64,
    Weapon_2   : Weapon_2B64,
  };
  await Promise.all(Object.entries(toLoad).map(([k,src]) =>
    new Promise(resolve => {
      const img = new Image();
      img.onload  = () => { imageCache[k] = img; resolve(); };
      img.onerror = () => { console.warn('failed to load', k); resolve(); };
      img.src = src;
    })
  ));
}

// ── BLOC AUDIO ──────────────────────────────────────
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ audioCtx = null; }
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playShoot(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const f = audioCtx.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = 400;
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(800, t);
  o.frequency.exponentialRampToValueAtTime(400, t+0.15);
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.15);
  o.connect(f); f.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t+0.16);
}
function playEnemyHit(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  // noise burst for impact
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*0.4, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++){
    data[i] = (Math.random()*2-1) * Math.pow(1 - i/data.length, 2);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.35, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.4);
  const f = audioCtx.createBiquadFilter();
  f.type='lowpass'; f.frequency.value = 250;
  src.connect(f); f.connect(g); g.connect(audioCtx.destination);
  src.start(t);
  // low oscillator thump
  const o = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  o.type='square'; o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(50, t+0.3);
  g2.gain.setValueAtTime(0.25, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t+0.4);
  o.connect(g2); g2.connect(audioCtx.destination);
  o.start(t); o.stop(t+0.4);
}
function playBaseHit(){ playEnemyHit(); }
function playButton(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(1200, t);
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.1);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t+0.11);
}
function playVictory(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  [523, 659, 784, 1046].forEach((freq,i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, t+i*0.12);
    g.gain.linearRampToValueAtTime(0.18, t+i*0.12+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t+i*0.12+0.4);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t+i*0.12); o.stop(t+i*0.12+0.42);
  });
}
function playDefeat(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(400, t);
  o.frequency.exponentialRampToValueAtTime(80, t+1.4);
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+1.5);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t+1.5);
}

// Castle platforms (where player units stand)
let playerCastle = null;
let enemyCastle  = null;

function setupCastles(){
  const cw = W * CONFIG.playerWidthRatio;
  const ch = H * CONFIG.playerHeightRatio;
  playerCastle = {
    x: W*0.04 + cw/2,
    y: H*0.30 + ch/2,
    w: cw, h: ch,
    hp: CONFIG.playerHitPoints,
    maxHP: CONFIG.playerHitPoints,
    img: 'Blue_Castle',
    flip: false,
    bobT: 0,
    flashT: 0,
    platforms: []
  };
  enemyCastle = {
    x: W*0.96 - cw/2,
    y: H*0.30 + ch/2,
    w: cw, h: ch,
    hp: CONFIG.enemyHitPoints,
    maxHP: CONFIG.enemyHitPoints,
    img: 'Red_Castle',
    flip: true,
    bobT: 0,
    flashT: 0,
    platforms: []
  };

  // 4 platforms inside player castle (between two towers, vertical stack)
  const platCount = 4;
  for(let i=0;i<platCount;i++){
    playerCastle.platforms.push({
      x: playerCastle.x,
      // platforms inside the castle, stacked
      y: playerCastle.y - ch*0.20 + (i * ch*0.16),
      w: cw*0.42,
      h: ch*0.10,
      occupied: null
    });
  }
  for(let i=0;i<platCount;i++){
    enemyCastle.platforms.push({
      x: enemyCastle.x,
      y: enemyCastle.y - ch*0.20 + (i * ch*0.16),
      w: cw*0.42,
      h: ch*0.10,
      occupied: 'enemy'  // enemy castle auto-fires
    });
  }
}

class Unit {
  constructor(type, x, y, owner){
    this.type = type;          // 'skeleton' | 'cyclop' | 'goblin'
    this.x = x; this.y = y;
    this.owner = owner;        // 'player' | 'enemy'
    this.lastFire = performance.now() - Math.random()*500;
    this.weaponPick = (type==='cyclop') ? 'Weapon_1' : 'Weapon_2';
    this.projectilePick = (type==='goblin') ? 'Projectile_2' : 'Projectile_1';
    this.color = type==='skeleton' ? CONFIG.colorSkeleton :
                 type==='cyclop'   ? CONFIG.colorCyclop   : CONFIG.colorGoblin;
    this.spawnT = 0; // 0..1 spawn animation
  }
  update(dt){
    this.spawnT = Math.min(1, this.spawnT + dt/300);
    const now = performance.now();
    if(now - this.lastFire > CONFIG.projectileCooldown){
      this.lastFire = now;
      this.fire();
    }
  }
  fire(){
    const dir = this.owner === 'player' ? 1 : -1;
    const targetX = this.owner === 'player' ? enemyCastle.x : playerCastle.x;
    const targetY = (this.owner === 'player' ? enemyCastle.y : playerCastle.y) + (Math.random()-0.5)*playerCastle.h*0.3;
    projectiles.push(new Projectile(
      this.x + dir*W*0.02,
      this.y - H*0.005,
      targetX, targetY,
      this.owner, this.projectilePick
    ));
    if(this.owner==='player') playShoot();
  }
}

class Projectile {
  constructor(x, y, tx, ty, owner, sprite){
    this.x = x; this.y = y;
    this.startX = x; this.startY = y;
    this.tx = tx; this.ty = ty;
    this.owner = owner;
    this.sprite = sprite;
    this.t = 0;                // 0..1 progress
    this.duration = CONFIG.projectileSpeed;
    this.dead = false;
    this.angle = Math.atan2(ty-y, tx-x);
    this.trail = [];
  }
  update(dt){
    this.t += dt / this.duration;
    if(this.t >= 1){
      this.t = 1;
      this.impact();
      this.dead = true;
      return;
    }
    // parabolic arc
    const arc = -Math.sin(this.t * Math.PI) * H * 0.10;
    this.x = this.startX + (this.tx-this.startX)*this.t;
    this.y = this.startY + (this.ty-this.startY)*this.t + arc;
    // angle update for visual
    const tNext = Math.min(1, this.t+0.05);
    const arcN = -Math.sin(tNext * Math.PI) * H * 0.10;
    const nx = this.startX + (this.tx-this.startX)*tNext;
    const ny = this.startY + (this.ty-this.startY)*tNext + arcN;
    this.angle = Math.atan2(ny-this.y, nx-this.x);

    if(this.trail.length<8) this.trail.push({x:this.x,y:this.y,life:1});
    else { this.trail.push({x:this.x,y:this.y,life:1}); this.trail.shift(); }
    this.trail.forEach(p => p.life -= dt/300);
  }
  impact(){
    // damage target
    if(this.owner==='player'){
      enemyHP = Math.max(0, enemyHP - CONFIG.damagePerHitToEnemy);
      enemyCastle.flashT = 250;
      damageTexts.push(new DamageText(this.tx, this.ty, '-'+CONFIG.damagePerHitToEnemy, '#fff'));
      scorePops.push({x:this.tx, y:this.ty, text:'+10', t:0});
    } else {
      playerHP = Math.max(0, playerHP - CONFIG.damagePerHitToPlayer);
      playerCastle.flashT = 250;
      damageTexts.push(new DamageText(this.tx, this.ty, '-'+CONFIG.damagePerHitToPlayer, '#fff'));
      shake(4, 200);
    }
    playEnemyHit();
    // particles
    for(let i=0;i<8;i++){
      particles.push(new Particle(this.tx, this.ty, this.owner==='player' ? '#fbbf24' : '#9ca3af'));
    }
    flashImpact = {x:this.tx, y:this.ty, t:0, max:150};
    // debris bit
    if(Math.random()<0.6){
      debris.push(new Debris(this.tx + (Math.random()-0.5)*40, this.ty));
    }
  }
}

class Particle {
  constructor(x,y,color){
    this.x = x; this.y = y;
    this.vx = (Math.random()-0.5)*W*0.5;
    this.vy = (Math.random()-0.5)*H*0.3 - H*0.1;
    this.life = 1;
    this.size = 3 + Math.random()*4;
    this.color = color;
  }
  update(dt){
    const s = dt/1000;
    this.x += this.vx*s;
    this.y += this.vy*s;
    this.vy += H*0.6*s;     // gravity
    this.life -= dt/400;
  }
}

class DamageText {
  constructor(x,y,text,color){
    this.x = x; this.y = y;
    this.text = text; this.color = color;
    this.t = 0;
  }
  update(dt){ this.t += dt; }
  alive(){ return this.t < 800; }
}

class Debris {
  constructor(x,y){
    this.x = x; this.y = y;
    this.vx = (Math.random()-0.5)*W*0.3;
    this.vy = -H*0.15;
    this.rot = 0;
    this.rotSpeed = (Math.random()-0.5)*8;
    this.size = 6 + Math.random()*8;
    this.life = 1;
  }
  update(dt){
    const s = dt/1000;
    this.x += this.vx*s;
    this.y += this.vy*s;
    this.vy += H*0.9*s;
    this.rot += this.rotSpeed*s;
    this.life -= dt/1000;
  }
}

// ── BLOC DRAW ──────────────────────────────────────

function shake(intensity, duration){
  screenShake.intensity = intensity;
  screenShake.duration = duration;
  screenShake.t = 0;
}

function applyShake(dt){
  if(screenShake.duration <= 0){ screenShake.x=0; screenShake.y=0; return; }
  screenShake.t += dt;
  if(screenShake.t >= screenShake.duration){
    screenShake.duration = 0; screenShake.x=0; screenShake.y=0; return;
  }
  const phase = (screenShake.t / screenShake.duration);
  const decay = 1 - phase;
  screenShake.x = (Math.random()-0.5)*2*screenShake.intensity*decay;
  screenShake.y = (Math.random()-0.5)*2*screenShake.intensity*decay;
}

function drawBackground(){
  if(imageCache.Background){
    const img = imageCache.Background;
    // We use the bg's bottom band as a horizon strip; stretch full width, anchored top
    const targetH = H * 0.85;  // sky+landscape area
    const aspect = img.width / img.height;
    let drawW = W;
    let drawH = drawW / aspect;
    if(drawH < targetH){ drawH = targetH; drawW = drawH*aspect; }
    // center horizontally with mild parallax
    const t = performance.now()/2000;
    const offX = (W - drawW)/2 + Math.sin(t)*W*0.01;
    ctx.drawImage(img, offX, -H*0.05, drawW, drawH);
  } else {
    // fallback gradient
    const g = ctx.createLinearGradient(0,0,0,H*0.8);
    g.addColorStop(0, '#A4B5D6');
    g.addColorStop(1, '#cfd9e6');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H*0.85);
  }
  // tint overlay to harmonize
  ctx.fillStyle = 'rgba(40,60,90,0.05)';
  ctx.fillRect(0,0,W,H);
}

function drawClouds(dt){
  clouds.forEach(c => {
    c.x += c.vx * dt/1000;
    if(c.x > W + 100) c.x = -100;
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r*0.6, 0, Math.PI*2);
    ctx.arc(c.x+c.r*0.7, c.y-c.r*0.2, c.r*0.5, 0, Math.PI*2);
    ctx.arc(c.x-c.r*0.6, c.y+c.r*0.05, c.r*0.45, 0, Math.PI*2);
    ctx.arc(c.x+c.r*1.2, c.y+c.r*0.1, c.r*0.4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

function drawSolLava(dt){
  const groundY = H*0.80;
  const lavaY   = H*0.83;
  // ground band (grass top + earth)
  const grassH = H*0.012;
  ctx.fillStyle = CONFIG.colorGrass;
  ctx.fillRect(0, groundY, W, grassH);
  // earth gradient
  const eg = ctx.createLinearGradient(0,groundY+grassH,0,lavaY);
  eg.addColorStop(0, '#5b4032');
  eg.addColorStop(1, '#3a2820');
  ctx.fillStyle = eg;
  ctx.fillRect(0, groundY+grassH, W, lavaY-(groundY+grassH));
  // small pebbles
  for(let i=0;i<8;i++){
    const px = ((i*W/8) + Math.sin(i*1.7)*15) % W;
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath();
    ctx.arc(px+10, groundY+grassH+H*0.012, 3, 0, Math.PI*2);
    ctx.fill();
  }
  // lava strip
  const lavaH = H*0.05;
  const lg = ctx.createLinearGradient(0, lavaY, 0, lavaY+lavaH);
  lg.addColorStop(0, '#fb923c');
  lg.addColorStop(0.6, '#dc2626');
  lg.addColorStop(1, '#7f1d1d');
  ctx.fillStyle = lg;
  ctx.fillRect(0, lavaY, W, lavaH);
  // lava glow
  ctx.fillStyle = 'rgba(251,146,60,0.25)';
  ctx.fillRect(0, lavaY-H*0.005, W, H*0.005);

  // lava drops animation
  if(Math.random()<0.15 && lavaDrops.length<25){
    lavaDrops.push({
      x: Math.random()*W,
      y: lavaY + lavaH*0.2,
      vy: H*0.15 + Math.random()*H*0.1,
      life: 1,
      r: 2+Math.random()*3
    });
  }
  lavaDrops.forEach(d => {
    d.y += d.vy*dt/1000;
    d.life -= dt/1000;
    ctx.fillStyle = `rgba(251,146,60,${d.life})`;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
    ctx.fill();
  });
  lavaDrops = lavaDrops.filter(d => d.life>0 && d.y<H);
}

function drawCastle(c){
  ctx.save();
  // bobbing
  c.bobT += 0.001;
  const tilt = Math.sin(c.bobT*0.8) * 0.02;
  ctx.translate(c.x, c.y);
  ctx.rotate((c.flip ? -tilt : tilt));
  if(c.flip) ctx.scale(-1, 1);
  // flash overlay if hit
  if(imageCache[c.img]){
    ctx.drawImage(imageCache[c.img], -c.w/2, -c.h/2, c.w, c.h);
  } else {
    ctx.fillStyle = c.img.includes('Blue') ? '#3B82F6' : '#DC2626';
    ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
  }
  if(c.flashT > 0){
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = `rgba(255,255,255,${c.flashT/250 * 0.6})`;
    ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
}

// Geometric character drawings (fallbacks for skeleton/cyclop/goblin)
function drawSkeleton(ctx2, x, y, w, h, flip){
  ctx2.save();
  ctx2.translate(x,y);
  if(flip) ctx2.scale(-1,1);
  // body
  ctx2.fillStyle = '#f3f4f6';
  // legs
  ctx2.fillRect(-w*0.15, h*0.05, w*0.10, h*0.30);
  ctx2.fillRect(w*0.05, h*0.05, w*0.10, h*0.30);
  // torso
  ctx2.fillRect(-w*0.20, -h*0.15, w*0.40, h*0.25);
  // head
  ctx2.beginPath();
  ctx2.arc(0, -h*0.30, w*0.18, 0, Math.PI*2);
  ctx2.fill();
  // eye sockets
  ctx2.fillStyle = '#000';
  ctx2.beginPath();
  ctx2.arc(-w*0.06, -h*0.32, w*0.04, 0, Math.PI*2);
  ctx2.arc(w*0.06,  -h*0.32, w*0.04, 0, Math.PI*2);
  ctx2.fill();
  // ribs
  ctx2.strokeStyle = '#9ca3af';
  ctx2.lineWidth = 1.5;
  for(let i=0;i<3;i++){
    ctx2.beginPath();
    ctx2.moveTo(-w*0.15, -h*0.05 + i*h*0.04);
    ctx2.lineTo(w*0.15, -h*0.05 + i*h*0.04);
    ctx2.stroke();
  }
  // gun
  ctx2.fillStyle = '#374151';
  ctx2.fillRect(w*0.08, -h*0.10, w*0.30, h*0.06);
  ctx2.fillStyle = '#1f2937';
  ctx2.fillRect(w*0.30, -h*0.11, w*0.10, h*0.04);
  ctx2.restore();
}

function drawCyclop(ctx2, x, y, w, h, flip){
  ctx2.save();
  ctx2.translate(x,y);
  if(flip) ctx2.scale(-1,1);
  // body (red blob)
  ctx2.fillStyle = '#ef4444';
  ctx2.beginPath();
  ctx2.ellipse(0, h*0.05, w*0.30, h*0.32, 0, 0, Math.PI*2);
  ctx2.fill();
  // legs
  ctx2.fillRect(-w*0.18, h*0.25, w*0.12, h*0.18);
  ctx2.fillRect(w*0.06,  h*0.25, w*0.12, h*0.18);
  // head
  ctx2.beginPath();
  ctx2.arc(0, -h*0.25, w*0.22, 0, Math.PI*2);
  ctx2.fill();
  // single eye
  ctx2.fillStyle = '#fff';
  ctx2.beginPath();
  ctx2.arc(0, -h*0.25, w*0.12, 0, Math.PI*2);
  ctx2.fill();
  ctx2.fillStyle = '#000';
  ctx2.beginPath();
  ctx2.arc(0, -h*0.25, w*0.06, 0, Math.PI*2);
  ctx2.fill();
  // horn
  ctx2.fillStyle = '#7c2d12';
  ctx2.beginPath();
  ctx2.moveTo(-w*0.10, -h*0.42);
  ctx2.lineTo(-w*0.05, -h*0.55);
  ctx2.lineTo(0, -h*0.42);
  ctx2.fill();
  // club
  ctx2.fillStyle = '#92400e';
  ctx2.fillRect(w*0.20, -h*0.10, w*0.10, h*0.30);

  ctx2.arc(w*0.25, -h*0.15, w*0.10, 0, Math.PI*2);

}

function drawGoblin(ctx2, x, y, w, h, flip){
  ctx2.save();
  ctx2.translate(x,y);
  if(flip) ctx2.scale(-1,1);
  // body
  ctx2.fillStyle = '#22c55e';
  ctx2.fillRect(-w*0.18, -h*0.10, w*0.36, h*0.32);
  // legs
  ctx2.fillRect(-w*0.16, h*0.18, w*0.10, h*0.20);
  ctx2.fillRect(w*0.06,  h*0.18, w*0.10, h*0.20);
  // head
  ctx2.beginPath();
  ctx2.arc(0, -h*0.25, w*0.18, 0, Math.PI*2);
  ctx2.fill();
  // ears
  ctx2.beginPath();
  ctx2.moveTo(-w*0.18, -h*0.27);
  ctx2.lineTo(-w*0.32, -h*0.30);
  ctx2.lineTo(-w*0.16, -h*0.20);
  ctx2.fill();
  ctx2.beginPath();
  ctx2.moveTo(w*0.18, -h*0.27);
  ctx2.lineTo(w*0.32, -h*0.30);
  ctx2.lineTo(w*0.16, -h*0.20);
  ctx2.fill();
  // eyes
  ctx2.fillStyle = '#fde047';
  ctx2.beginPath();
  ctx2.arc(-w*0.06, -h*0.27, w*0.04, 0, Math.PI*2);
  ctx2.arc(w*0.06,  -h*0.27, w*0.04, 0, Math.PI*2);
  ctx2.fill();
  ctx2.fillStyle = '#000';
  ctx2.beginPath();
  ctx2.arc(-w*0.06, -h*0.27, w*0.02, 0, Math.PI*2);
  ctx2.arc(w*0.06,  -h*0.27, w*0.02, 0, Math.PI*2);
  ctx2.fill();
  // fangs
  ctx2.fillStyle = '#fff';
  ctx2.beginPath();
  ctx2.moveTo(-w*0.04, -h*0.20);
  ctx2.lineTo(-w*0.02, -h*0.16);
  ctx2.lineTo(0, -h*0.20);
  ctx2.fill();
  // slingshot
  ctx2.strokeStyle = '#7c2d12';
  ctx2.lineWidth = 3;
  ctx2.beginPath();
  ctx2.moveTo(w*0.18, 0);
  ctx2.lineTo(w*0.30, -h*0.10);
  ctx2.moveTo(w*0.18, 0);
  ctx2.lineTo(w*0.30, h*0.05);
  ctx2.stroke();
  ctx2.restore();

function drawUnit(u){
  const w = W * CONFIG.unitWidthRatio;
  const h = H * CONFIG.unitHeightRatio;
  const flip = u.owner === 'enemy';
  // spawn pop animation
  const scale = 0.6 + 0.4 * Math.min(1, u.spawnT*1.2);
  ctx.save();
  ctx.translate(u.x, u.y);
  ctx.scale(scale, scale);
  if(u.type==='skeleton') drawSkeleton(ctx, 0, 0, w, h, flip);
  else if(u.type==='cyclop')   drawCyclop(ctx,   0, 0, w, h, flip);
  else                          drawGoblin(ctx,   0, 0, w, h, flip);
  // weapon overlay sprite (subtle, only if loaded)
  ctx.restore();
}

function drawProjectile(p){
  const w = W * CONFIG.projectileWidthRatio;
  const h = w; // square sprite
  // trail
  p.trail.forEach((pt,i) => {
    if(pt.life<=0) return;
    ctx.fillStyle = `rgba(120,120,120,${pt.life*0.4})`;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, w*0.18*(i/p.trail.length+0.3), 0, Math.PI*2);
    ctx.fill();
  });
  if(imageCache[p.sprite]){
    ctx.save();
    ctx.translate(p.x, p.y);
    // base sprite faces right; flip if going left
    const flip = (p.tx < p.startX);
    if(flip) ctx.rotate(p.angle + Math.PI);
    else     ctx.rotate(p.angle);
    ctx.drawImage(imageCache[p.sprite], -w/2, -h/2, w, h);
    ctx.restore();
  } else {
    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.arc(p.x,p.y,w*0.4,0,Math.PI*2);
    ctx.fill();
  }
}

function drawParticles(){
  particles.forEach(p => {
    if(p.life<=0) return;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawDebris(){
  debris.forEach(d => {
    if(d.life<=0) return;
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    ctx.globalAlpha = d.life;
    ctx.fillStyle = '#9ca3af';
    ctx.fillRect(-d.size/2, -d.size/2, d.size, d.size);
    ctx.strokeStyle = '#6b7280';
    ctx.lineWidth = 1;
    ctx.strokeRect(-d.size/2, -d.size/2, d.size, d.size);
    ctx.restore();
    ctx.globalAlpha = 1;
  });
}

function drawDamageTexts(){
  damageTexts.forEach(d => {
    const t = d.t / 800;
    if(t>=1) return;
    ctx.save();
    ctx.globalAlpha = 1 - t;
    ctx.font = `bold ${Math.floor(W*0.045)}px sans-serif`;
    ctx.fillStyle = d.color;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.textAlign = 'center';
    const yOff = -t * H*0.10;
    ctx.strokeText(d.text, d.x, d.y + yOff);
    ctx.fillText(d.text, d.x, d.y + yOff);
    ctx.restore();
  });
}

function drawScorePops(dt){
  scorePops.forEach(s => { s.t += dt; });
  scorePops.forEach(s => {
    if(s.t>800) return;
    const t = s.t/800;
    ctx.save();
    ctx.globalAlpha = 1 - t;
    ctx.font = `bold ${Math.floor(W*0.035)}px sans-serif`;
    ctx.fillStyle = '#fbbf24';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.textAlign = 'center';
    ctx.strokeText(s.text, s.x, s.y - t*H*0.08);
    ctx.fillText(s.text, s.x, s.y - t*H*0.08);
    ctx.restore();
  });
  scorePops = scorePops.filter(s => s.t < 800);
}

function drawFlashImpact(){
  if(!flashImpact) return;
  flashImpact.t += 16;
  if(flashImpact.t > flashImpact.max){ flashImpact = null; return; }
  const k = 1 - flashImpact.t/flashImpact.max;
  ctx.save();
  ctx.globalAlpha = k * 0.8;
  const r = (1-k) * W*0.1 + 10;
  const grad = ctx.createRadialGradient(flashImpact.x, flashImpact.y, 0, flashImpact.x, flashImpact.y, r);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.6, 'rgba(255,200,80,0.7)');
  grad.addColorStop(1, 'rgba(255,150,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(flashImpact.x, flashImpact.y, r, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawTopUI(){
  // VS bars at top
  const barH = H * 0.06;
  const padX = W*0.02;
  const segW = (W - W*0.18 - padX*2) / 2;
  const y0 = H*0.018;

  // Player (left)
  drawHpBar(padX, y0, segW, barH, playerHP, CONFIG.playerHitPoints, '#3B82F6', false);
  // Enemy (right)
  drawHpBar(W - padX - segW, y0, segW, barH, enemyHP, CONFIG.enemyHitPoints, '#DC2626', true);

  // central VS badge
  const cx = W/2, cy = y0 + barH/2;
  ctx.save();
  ctx.fillStyle = '#0b1220';
  ctx.strokeStyle = '#1f2937';
  ctx.lineWidth = 2;
  ctx.beginPath();
  roundRect(ctx, cx-W*0.07, cy-barH*0.65, W*0.14, barH*1.30, 8);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fde047';
  ctx.font = `900 ${Math.floor(W*0.05)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('VS', cx, cy);
  ctx.restore();
}

function drawHpBar(x, y, w, h, value, max, color, rightAligned){
  ctx.save();
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  roundRect(ctx, x+2, y+3, w, h, 8);
  ctx.fill();
  // bg
  ctx.fillStyle = '#0b1220';
  roundRect(ctx, x, y, w, h, 8);
  ctx.fill();
  // inner
  const pct = Math.max(0, value/max);
  const innerW = (w-6) * pct;
  const innerX = rightAligned ? (x + 3 + (w-6)*(1-pct)) : (x + 3);
  ctx.fillStyle = color;
  roundRect(ctx, innerX, y+3, innerW, h-6, 5);
  ctx.fill();
  // shine highlight
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  roundRect(ctx, innerX, y+4, innerW, (h-6)*0.35, 4);
  ctx.fill();
  // border
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2;
  roundRect(ctx, x, y, w, h, 8);
  ctx.stroke();
  // text
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.floor(h*0.55)}px sans-serif`;
  ctx.textAlign = rightAligned ? 'right' : 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 3;
  const label = rightAligned ? `${Math.round(value)}%  ENEMY` : `PLAYER  ${Math.round(value)}%`;
  ctx.fillText(label, rightAligned ? x+w-8 : x+8, y+h/2);
  ctx.restore();
}

function drawBottomUI(){
  // 3 cards
  const cards = getCards();
  const tNow = performance.now();
  cards.forEach(c => {
    const isSelected = selectedCard && selectedCard.id===c.id;
    ctx.save();
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(ctx, c.x - c.w/2 + 3, c.y - c.h/2 + 5, c.w, c.h, 12);
    ctx.fill();
    // bg
    const bgGrad = ctx.createLinearGradient(0, c.y - c.h/2, 0, c.y + c.h/2);
    bgGrad.addColorStop(0, '#1f2937');
    bgGrad.addColorStop(1, '#0b1220');
    ctx.fillStyle = bgGrad;
    roundRect(ctx, c.x - c.w/2, c.y - c.h/2, c.w, c.h, 12);
    ctx.fill();
    // inner border
    ctx.strokeStyle = isSelected ? '#fde047' : '#475569';
    ctx.lineWidth = isSelected ? 4 : 2;
    roundRect(ctx, c.x - c.w/2, c.y - c.h/2, c.w, c.h, 12);
    ctx.stroke();
    // pulsing glow if selected
    if(isSelected){
      const pulse = 0.5 + 0.5 * Math.sin(tNow*0.008);
      ctx.shadowColor = '#fde047';
      ctx.shadowBlur = 14 + pulse*8;
      ctx.strokeStyle = `rgba(253,224,71,${0.6+pulse*0.3})`;
      ctx.lineWidth = 3;
      roundRect(ctx, c.x - c.w/2, c.y - c.h/2, c.w, c.h, 12);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    // mini character icon
    const iconW = c.w*0.45;
    const iconH = c.h*0.65;
    if(c.id==='skeleton') drawSkeleton(ctx, c.x - c.w*0.20, c.y, iconW, iconH, false);
    else if(c.id==='cyclop')   drawCyclop(ctx,   c.x - c.w*0.20, c.y, iconW, iconH, false);
    else                       drawGoblin(ctx,   c.x - c.w*0.20, c.y, iconW, iconH, false);
    // label
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.floor(c.h*0.16)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.label, c.x + c.w*0.12, c.y - c.h*0.15);
    // cost / hint
    ctx.fillStyle = '#94a3b8';
    ctx.font = `${Math.floor(c.h*0.13)}px sans-serif`;
    ctx.fillText('Drag to deploy', c.x + c.w*0.12, c.y + c.h*0.18);
    ctx.restore();
  });
}

function drawTutorialHand(dt){
  if(!tutorialHand.visible) return;
  tutorialHand.t += dt;
  // animate from a card to a platform
  const period = 1600;
  const k = (tutorialHand.t % period) / period;
  // ease in out
  const ease = 0.5 - 0.5*Math.cos(k*Math.PI);
  const cards = getCards();
  const start = { x: cards[1].x, y: cards[1].y };
  const end   = { x: playerCastle.platforms[1].x, y: playerCastle.platforms[1].y };
  const px = start.x + (end.x - start.x) * ease;
  const py = start.y + (end.y - start.y) * ease;
  // pulse circle on start position when at start
  const atStart = ease < 0.1;
  if(atStart){
    ctx.save();
    ctx.strokeStyle = `rgba(253,224,71,${(1-ease*10)*0.7})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(start.x, start.y, cards[1].w*0.55 * (1+ease*10*0.4), 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  // hand drawing (cartoon white hand pointing)
  ctx.save();
  ctx.translate(px, py);
  ctx.scale(1, 1);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(W*0.015, H*0.015, W*0.05, H*0.012, 0, 0, Math.PI*2);
  ctx.fill();
  // palm
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-W*0.012, W*0.04);
  ctx.lineTo(W*0.025, W*0.075);
  ctx.lineTo(W*0.045, W*0.060);
  ctx.lineTo(W*0.040, W*0.030);
  ctx.lineTo(W*0.018, -W*0.005);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // index finger pointing up-left
  ctx.beginPath();
  ctx.moveTo(W*0.005, -W*0.005);
  ctx.lineTo(-W*0.020, -W*0.045);
  ctx.lineTo(-W*0.005, -W*0.055);
  ctx.lineTo(W*0.020, -W*0.012);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawIntroScreen(){
  // dim
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0,0,W,H);
  // game title
  const tt = performance.now();
  const titleY = H*0.30;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = `900 ${Math.floor(W*0.10)}px Impact, sans-serif`;
  ctx.lineWidth = 8;
  ctx.strokeStyle = '#0b1220';
  ctx.fillStyle = '#fde047';
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 4;
  ctx.strokeText('CASTLE', W/2, titleY);
  ctx.fillText('CASTLE', W/2, titleY);
  ctx.strokeStyle = '#0b1220';
  ctx.fillStyle = '#f97316';
  ctx.strokeText('CLASHERS', W/2, titleY + W*0.11);
  ctx.fillText('CLASHERS', W/2, titleY + W*0.11);
  ctx.restore();
  // tap hint
  const blink = 0.55 + 0.45 * Math.sin(tt*0.005);
  ctx.save();
  ctx.globalAlpha = blink;
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.floor(W*0.05)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 6;
  ctx.fillText('TAP TO PLAY', W/2, H*0.55);
  ctx.restore();
  // small subline
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = `${Math.floor(W*0.030)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('Drag units to defend your castle!', W/2, H*0.62);
  ctx.restore();
}

function drawGameOverScreen(){
  // dim
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0,0,W,H);
  // popup
  const t = (performance.now() - stateEnteredAt) / 400;
  const k = Math.min(1, t);
  // ease bounce
  const eased = k < 1 ? bounceEase(k) : 1;
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(eased, eased);
  // box
  const bw = W*0.74, bh = H*0.30;
  ctx.fillStyle = '#0b1220';
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur = 30;
  roundRect(ctx, -bw/2, -bh/2, bw, bh, 18);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#dc2626';
  ctx.lineWidth = 4;
  roundRect(ctx, -bw/2, -bh/2, bw, bh, 18);
  ctx.stroke();
  // text
  ctx.fillStyle = '#dc2626';
  ctx.font = `900 ${Math.floor(W*0.07)}px Impact, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('BATTLE FAILED', 0, -bh*0.10);
  ctx.fillStyle = '#cbd5e1';
  ctx.font = `${Math.floor(W*0.035)}px sans-serif`;
  ctx.fillText('Your castle has fallen', 0, bh*0.05);
  ctx.fillStyle = '#94a3b8';
  ctx.font = `${Math.floor(W*0.028)}px sans-serif`;
  ctx.fillText('Tap anywhere to continue', 0, bh*0.20);
  ctx.restore();
}

function drawWinScreen(){
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0,0,W,H);
  const t = (performance.now() - stateEnteredAt) / 400;
  const k = Math.min(1, t);
  const eased = k < 1 ? bounceEase(k) : 1;
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(eased, eased);
  const bw = W*0.74, bh = H*0.30;
  ctx.fillStyle = '#0b1220';
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur = 30;
  roundRect(ctx, -bw/2, -bh/2, bw, bh, 18);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#fde047';
  ctx.lineWidth = 4;
  roundRect(ctx, -bw/2, -bh/2, bw, bh, 18);
  ctx.stroke();
  ctx.fillStyle = '#fde047';
  ctx.font = `900 ${Math.floor(W*0.08)}px Impact, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('VICTORY!', 0, -bh*0.10);
  ctx.fillStyle = '#cbd5e1';
  ctx.font = `${Math.floor(W*0.035)}px sans-serif`;
  ctx.fillText('Enemy castle destroyed', 0, bh*0.05);
  ctx.fillStyle = '#94a3b8';
  ctx.font = `${Math.floor(W*0.028)}px sans-serif`;
  ctx.fillText('Tap anywhere to continue', 0, bh*0.20);
  ctx.restore();
}

function drawCTAScreen(){
  // freeze background, dim
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0,0,W,H);
  const tt = performance.now();
  // title
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = `900 ${Math.floor(W*0.08)}px Impact, sans-serif`;
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 8;
  ctx.fillText('READY FOR MORE?', W/2, H*0.32);
  ctx.fillStyle = '#cbd5e1';
  ctx.font = `${Math.floor(W*0.04)}px sans-serif`;
  ctx.shadowBlur = 0;
  ctx.fillText('Build your army & conquer kingdoms', W/2, H*0.40);
  ctx.restore();
  // CTA button
  const btn = ctaButtonRect();
  // pulsing
  const pulse = 1 + 0.04*Math.sin(tt*0.006);
  ctx.save();
  ctx.translate(btn.x + btn.w/2, btn.y + btn.h/2);
  ctx.scale(pulse, pulse);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(ctx, -btn.w/2+4, -btn.h/2+6, btn.w, btn.h, 16);
  ctx.fill();
  // bg
  const grad = ctx.createLinearGradient(0,-btn.h/2,0,btn.h/2);
  grad.addColorStop(0, '#fb923c');
  grad.addColorStop(1, '#ea580c');
  ctx.fillStyle = grad;
  roundRect(ctx, -btn.w/2, -btn.h/2, btn.w, btn.h, 16);
  ctx.fill();
  // shine
  ctx.fillStyle = 'rgba(255,255,255,0.30)';
  roundRect(ctx, -btn.w/2+8, -btn.h/2+6, btn.w-16, btn.h*0.35, 12);
  ctx.fill();
  // border
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  roundRect(ctx, -btn.w/2, -btn.h/2, btn.w, btn.h, 16);
  ctx.stroke();
  // text
  ctx.fillStyle = '#fff';
  ctx.font = `900 ${Math.floor(W*0.06)}px Impact, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.4)';
  ctx.shadowBlur = 4;
  ctx.fillText(CONFIG.ctaText, 0, 2);
  ctx.restore();
}

function ctaButtonRect(){
  const bw = W*0.65, bh = H*0.09;
  return { x: (W-bw)/2, y: H*0.55, w: bw, h: bh };
}

// ── BLOC GAME LOOP ──────────────────────────────────
function gameLoop(timestamp){
  if(!lastTimestamp) lastTimestamp = timestamp;
  let dt = timestamp - lastTimestamp;
  if(dt > 50) dt = 50;
  lastTimestamp = timestamp;
  applyShake(dt);

  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(screenShake.x, screenShake.y);

  drawBackground();
  drawClouds(dt);
  drawSolLava(dt);
  drawCastle(playerCastle);
  drawCastle(enemyCastle);

  switch(gameState){
    case STATES.INTRO:
      // also auto-fire enemy + player units idle (frozen — paused world)
      drawTutorialHand(dt);
      drawBottomUI();
      drawTopUI();
      drawIntroScreen();
      break;
    case STATES.PLAYING:
      updateGame(dt);
      drawAllInGame(dt);
      break;
    case STATES.GAMEOVER:
      drawAllInGame(dt, true);
      drawGameOverScreen();
      if(performance.now() - stateEnteredAt > 2000) goToCTA();
      break;
    case STATES.WIN:
      drawAllInGame(dt, true);
      drawWinScreen();
      if(performance.now() - stateEnteredAt > 2000) goToCTA();
      break;
    case STATES.CTA:
      drawAllInGame(dt, true);
      drawCTAScreen();
      break;
  }

  // update castle flash regardless
  if(playerCastle.flashT>0) playerCastle.flashT -= dt;
  if(enemyCastle.flashT>0)  enemyCastle.flashT -= dt;

  ctx.restore();
  requestAnimationFrame(gameLoop);
}

function drawAllInGame(dt, frozen){
  // Units
  units.forEach(u => drawUnit(u));
  // Projectiles
  projectiles.forEach(p => drawProjectile(p));
  // Particles, debris, damage texts
  drawParticles();
  drawDebris();
  drawDamageTexts();
  drawScorePops(dt);
  drawFlashImpact();
  // UI
  drawTopUI();
  drawBottomUI();
  if(gameState===STATES.PLAYING && units.filter(u=>u.owner==='player').length===0) drawTutorialHand(dt);
  // drag preview
  if(selectedCard && dragPos){
    ctx.save();
    ctx.globalAlpha = 0.7;
    const w = W*CONFIG.unitWidthRatio;
    const h = H*CONFIG.unitHeightRatio;
    if(selectedCard.id==='skeleton') drawSkeleton(ctx, dragPos.x, dragPos.y, w, h, false);
    else if(selectedCard.id==='cyclop')   drawCyclop(ctx,   dragPos.x, dragPos.y, w, h, false);
    else                                    drawGoblin(ctx,   dragPos.x, dragPos.y, w, h, false);
    // highlight valid platforms
    playerCastle.platforms.forEach(p => {
      if(p.occupied) return;
      ctx.strokeStyle = '#fde047';
      ctx.lineWidth = 3;
      ctx.setLineDash([6,6]);
      roundRect(ctx, p.x - p.w/2, p.y - p.h/2, p.w, p.h, 8);
      ctx.stroke();
      ctx.setLineDash([]);
    });
    ctx.restore();
  }
}

function updateGame(dt){
  gameTimeElapsed += dt;
  // units
  units.forEach(u => u.update(dt));
  // enemy castle auto-fires from random platform
  lastEnemyFire += dt;
  if(lastEnemyFire >= CONFIG.enemyFireInterval){
    lastEnemyFire = 0;
    const platform = enemyCastle.platforms[Math.floor(Math.random()*enemyCastle.platforms.length)];
    const targetY = playerCastle.y + (Math.random()-0.5)*playerCastle.h*0.4;
    projectiles.push(new Projectile(
      platform.x - W*0.02, platform.y, playerCastle.x, targetY, 'enemy',
      Math.random()<0.5 ? 'Projectile_1' : 'Projectile_2'
    ));
  }
  // projectiles
  projectiles.forEach(p => p.update(dt));
  projectiles = projectiles.filter(p => !p.dead);
  // particles
  particles.forEach(p => p.update(dt));
  particles = particles.filter(p => p.life>0);
  // damage texts
  damageTexts.forEach(d => d.update(dt));
  damageTexts = damageTexts.filter(d => d.alive());
  // debris
  debris.forEach(d => d.update(dt));
  debris = debris.filter(d => d.life>0 && d.y < H);
  // win/lose
  if(enemyHP <= 0){ goToWin(); }
  else if(playerHP <= 0){ goToGameOver(); }
  // safety : timer
  if(gameTimeElapsed > CONFIG.gameDuration){
    if(enemyHP < playerHP) goToWin(); else goToGameOver();
  }
  // hide tutorial hand once player has placed at least one unit
  if(units.some(u=>u.owner==='player')) tutorialHand.visible = false;
}

// ── BLOC INPUT ──────────────────────────────────────
function getEventXY(e){
  const rect = canvas.getBoundingClientRect();
  if(e.touches && e.touches.length){
    return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
  }
  if(e.changedTouches && e.changedTouches.length){
    return { x: e.changedTouches[0].clientX - rect.left, y: e.changedTouches[0].clientY - rect.top };
  }
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function pointInCard(x,y,c){
  return x>c.x-c.w/2 && x<c.x+c.w/2 && y>c.y-c.h/2 && y<c.y+c.h/2;
}
function pointInPlatform(x,y,p){
  return x>p.x-p.w/2 && x<p.x+p.w/2 && y>p.y-p.h/2 && y<p.y+p.h/2;
}
function pointInRect(x,y,r){
  return x>r.x && x<r.x+r.w && y>r.y && y<r.y+r.h;
}

function onPointerDown(e){
  e.preventDefault();
  ensureAudio();
  const {x,y} = getEventXY(e);

  if(gameState === STATES.INTRO){
    gameState = STATES.PLAYING;
    stateEnteredAt = performance.now();
    lastTimestamp = 0;
    playButton();
    return;
  }
  if(gameState === STATES.GAMEOVER || gameState === STATES.WIN){
    goToCTA();
    return;
  }
  if(gameState === STATES.CTA){
    if(pointInRect(x,y, ctaButtonRect())){
      playButton();
      try { window.open(CONFIG.ctaUrl, '_blank'); } catch(e){}
    }
    return;
  }

  if(gameState === STATES.PLAYING){
    const cards = getCards();
    for(const c of cards){
      if(pointInCard(x,y,c)){
        selectedCard = c;
        dragPos = {x,y};
        playButton();
        return;
      }
    }
  }
}
function onPointerMove(e){
  if(!selectedCard) return;
  e.preventDefault();
  const {x,y} = getEventXY(e);
  dragPos = {x,y};
}
function onPointerUp(e){
  if(!selectedCard){ return; }
  e.preventDefault();
  const {x,y} = getEventXY(e);
  // try to drop on a platform
  let placed = false;
  for(const p of playerCastle.platforms){
    if(!p.occupied && pointInPlatform(x,y,p)){
      const u = new Unit(selectedCard.id, p.x, p.y - p.h*0.3, 'player');
      units.push(u);
      p.occupied = u;
      placed = true;
      // burst of small particles
      for(let i=0;i<6;i++) particles.push(new Particle(p.x, p.y, '#fde047'));
      playButton();
      break;
    }
  }
  // If not placed: also accept tap-then-tap fallback handled by selection state.
  // For simplicity, always reset selection after pointer up.
  selectedCard = null;
  dragPos = null;
}

// ── BLOC STATES ─────────────────────────────────────
function goToWin(){
  if(gameState===STATES.WIN || gameState===STATES.CTA) return;
  gameState = STATES.WIN;
  stateEnteredAt = performance.now();
  playVictory();
}
function goToGameOver(){
  if(gameState===STATES.GAMEOVER || gameState===STATES.CTA) return;
  gameState = STATES.GAMEOVER;
  stateEnteredAt = performance.now();
  playDefeat();
}
function goToCTA(){
  if(gameState===STATES.CTA) return;
  gameState = STATES.CTA;
  stateEnteredAt = performance.now();
}

// ── HELPERS ─────────────────────────────────────────
function roundRect(c,x,y,w,h,r){
  if(w<2*r) r=w/2; if(h<2*r) r=h/2;
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function bounceEase(t){
  // ease out back like
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t-1, 3) + c1 * Math.pow(t-1, 2);
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  setupCastles();
  setupClouds();
}

function setupClouds(){
  clouds = [];
  for(let i=0;i<5;i++){
    clouds.push({
      x: Math.random()*W,
      y: H*0.10 + Math.random()*H*0.20,
      r: 18 + Math.random()*22,
      vx: 4 + Math.random()*6
    });
  }
}

// ── INIT ─────────────────────────────────────────────
async function init(){
  resize();
  await preloadAssets();
  loaderEl.classList.add('hide');

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  canvas.addEventListener('touchstart', onPointerDown, {passive:false});
  canvas.addEventListener('touchmove',  onPointerMove,  {passive:false});
  canvas.addEventListener('touchend',   onPointerUp,    {passive:false});
  canvas.addEventListener('touchcancel',onPointerUp,    {passive:false});
  canvas.addEventListener('mousedown',  onPointerDown);
  canvas.addEventListener('mousemove',  onPointerMove);
  canvas.addEventListener('mouseup',    onPointerUp);

  requestAnimationFrame(gameLoop);
}
window.addEventListener('load', init);
</script>

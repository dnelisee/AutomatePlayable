<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Castle Clashers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1628;font-family:system-ui,-apple-system,Arial,sans-serif;}
canvas{position:absolute;top:0;left:0;touch-action:none;display:block;}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;}
.hidden{display:none!important;}
#sIntro{background:radial-gradient(ellipse at 70% 50%,rgba(220,40,40,.25),transparent 60%),linear-gradient(180deg,#0a1628 0%,#1a2a4a 60%,#0a1628 100%);}
.bigTitle{font-size:clamp(34px,9vw,62px);font-weight:900;color:#f59e0b;text-shadow:0 0 24px rgba(245,158,11,.5),3px 3px 0 #78350f;letter-spacing:3px;text-align:center;line-height:1.05;}
.sub{font-size:clamp(12px,3.2vw,16px);color:#fca5a5;text-align:center;margin:10px 0 20px;letter-spacing:1px;font-weight:700;}
.tagline{font-size:clamp(11px,2.8vw,14px);color:#cbd5e1;text-align:center;line-height:1.6;margin-bottom:28px;max-width:300px;}
.btnGo{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1c0a00;font-size:clamp(15px,4vw,21px);font-weight:900;padding:14px 44px;border:none;border-radius:50px;cursor:pointer;letter-spacing:2px;box-shadow:0 4px 20px rgba(245,158,11,.55),0 0 0 3px #78350f;text-transform:uppercase;animation:pulse 1.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent;}
.btnGo:active{transform:scale(.94);}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 4px 20px rgba(245,158,11,.55),0 0 0 3px #78350f;}50%{transform:scale(1.06);box-shadow:0 6px 28px rgba(245,158,11,.8),0 0 0 3px #78350f;}}
#sResult{background:rgba(0,0,0,.88);}
.rTitle{font-size:clamp(42px,10vw,72px);font-weight:900;text-align:center;margin-bottom:8px;text-shadow:0 0 28px currentColor;}
.rTitle.win{color:#fbbf24;}.rTitle.lose{color:#ef4444;}
.rSub{color:#cbd5e1;font-size:clamp(13px,3.5vw,17px);margin-bottom:30px;text-align:center;}
.btnDl{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;font-size:clamp(14px,3.8vw,20px);font-weight:900;padding:14px 36px;border:none;border-radius:50px;cursor:pointer;letter-spacing:1.5px;text-transform:uppercase;box-shadow:0 4px 18px rgba(34,197,94,.45);margin-bottom:10px;-webkit-tap-highlight-color:transparent;animation:pulse 1.4s ease-in-out infinite;}
.btnDl:active{transform:scale(.95);}
.btnRe{background:transparent;color:#94a3b8;font-size:clamp(12px,2.8vw,14px);border:1.5px solid #475569;padding:8px 24px;border-radius:50px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;-webkit-tap-highlight-color:transparent;}
.btnRe:active{transform:scale(.95);}
.hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fbbf24;font-size:clamp(13px,3.5vw,18px);font-weight:900;text-align:center;text-shadow:0 0 12px rgba(0,0,0,.85);pointer-events:none;letter-spacing:1.5px;animation:fadeBlink 1.6s ease-in-out infinite;}
@keyframes fadeBlink{0%,100%{opacity:.55;}50%{opacity:1;}}
</style>
</head>

/* ─────────── ASSETS LOADER ─────────── */
const IMG={};
function loadAssets(cb){
  const map={blue:B64_BLUE,red:B64_RED,proj1:B64_PROJ1,proj2:B64_PROJ2,weap1:B64_WEAP1,weap2:B64_WEAP2,sk:B64_SK,or:B64_OR,cy:B64_CY};
  let pending=Object.keys(map).length, done=0;
  for(const k in map){
    const im=new Image();
    im.onload=im.onerror=()=>{done++;if(done===pending)cb();};
    im.src=map[k];IMG[k]=im;
  }
}

/* ─────────── AUDIO (procedural) ─────────── */
class AudioMgr{
  constructor(){this.ac=null;this.muted=false;}
  init(){if(this.ac)return;try{this.ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  resume(){if(this.ac&&this.ac.state==='suspended')this.ac.resume();}
  _t(f,d,type='square',vol=.2,delay=0){
    if(!this.ac||this.muted)return;
    const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.connect(g);g.connect(this.ac.destination);
    o.type=type;o.frequency.setValueAtTime(f,this.ac.currentTime+delay);
    g.gain.setValueAtTime(vol,this.ac.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(.001,this.ac.currentTime+delay+d);
    o.start(this.ac.currentTime+delay);o.stop(this.ac.currentTime+delay+d+.02);
  }
  _noise(d,vol=.3,delay=0){
    if(!this.ac||this.muted)return;
    const buf=this.ac.createBuffer(1,this.ac.sampleRate*d,this.ac.sampleRate);
    const ch=buf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);
    const s=this.ac.createBufferSource();s.buffer=buf;
    const g=this.ac.createGain();g.gain.value=vol;
    s.connect(g);g.connect(this.ac.destination);s.start(this.ac.currentTime+delay);
  }
  shoot(){this._t(420,.07,'square',.13);this._t(220,.09,'sawtooth',.09,.04);}
  boom(){this._t(70,.32,'sawtooth',.42);this._noise(.3,.28);}
  bigBoom(){this._t(55,.45,'sawtooth',.5);this._t(45,.32,'sine',.38,.08);this._noise(.45,.35);}
  caw(){this._t(900,.07,'sawtooth',.18);this._t(600,.06,'sawtooth',.13,.07);}
  click(){this._t(660,.06,'sine',.22);}
  hit(){this._t(180,.12,'square',.25);this._noise(.18,.2);}
  win(){[523,659,784,1047].forEach((f,i)=>this._t(f,.32,'sine',.36,i*.13));}
  lose(){[440,349,294,196].forEach((f,i)=>this._t(f,.34,'sine',.3,i*.17));}
}

/* ─────────── PARTICLES ─────────── */
class Spark{
  constructor(x,y,vx,vy,col,r,life,grav=620){Object.assign(this,{x,y,vx,vy,col,r,life,maxLife:life,grav,alive:true});}
  update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=this.grav*dt;this.life-=dt;if(this.life<=0)this.alive=false;}
  draw(c){const a=Math.max(0,this.life/this.maxLife);c.globalAlpha=a*a;c.fillStyle=this.col;c.beginPath();c.arc(this.x,this.y,this.r*Math.max(.15,a),0,6.28);c.fill();c.globalAlpha=1;}
}
class Smoke{
  constructor(x,y,vx,vy,col,r,life){Object.assign(this,{x,y,vx,vy,col,r,life,maxLife:life,alive:true});}
  update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy*=.94;this.r+=dt*14;this.life-=dt;if(this.life<=0)this.alive=false;}
  draw(c){const a=Math.max(0,this.life/this.maxLife)*.5;c.globalAlpha=a;c.fillStyle=this.col;c.beginPath();c.arc(this.x,this.y,this.r,0,6.28);c.fill();c.globalAlpha=1;}
}
class FlyingTree{
  constructor(x,y,scale){Object.assign(this,{x,y,vx:(Math.random()*2-1)*120-50,vy:-260-Math.random()*120,rot:0,vrot:(Math.random()*2-1)*6,scale,life:1.6,alive:true});}
  update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=720*dt;this.rot+=this.vrot*dt;this.life-=dt;if(this.life<=0)this.alive=false;}
  draw(c){c.save();c.globalAlpha=Math.max(0,this.life/1.6);c.translate(this.x,this.y);c.rotate(this.rot);c.scale(this.scale,this.scale);drawTreeShape(c);c.restore();}
}
function drawTreeShape(c){
  c.fillStyle='#3a2410';c.fillRect(-3,0,6,18);
  c.fillStyle='#1c4022';c.beginPath();c.arc(0,-6,18,0,6.28);c.fill();
  c.fillStyle='#2a5a32';c.beginPath();c.arc(-6,-12,12,0,6.28);c.fill();
  c.fillStyle='#143018';c.beginPath();c.arc(7,-10,10,0,6.28);c.fill();
}

/* ─────────── HELPERS ─────────── */
function lerp(a,b,t){return a+(b-a)*t;}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function fissureLevelFromHP(hp){
  const b=CFG.fissureBands; /* [0,5,10,30,50,70,80,90,100] */
  /* state 0 = pristine (hp>=90), state 7 = hp 0-5 */
  for(let i=b.length-1;i>0;i--){if(hp>=b[i-1])return b.length-1-i;}
  return b.length-2;
}

/* ground curve y = baseY + amplitude*sin(...) */
function groundY(x,W,H){
  const base=H*CFG.groundFrac;
  return base + Math.sin(x*0.011)*16 + Math.sin(x*0.004+1.3)*22;
}
function groundSlope(x,W,H){
  const dx=2;
  return (groundY(x+dx,W,H)-groundY(x-dx,W,H))/(2*dx);
}

/* ─────────── CASTLE ─────────── */
class Castle{
  constructor(team,xFrac,W,H){
    this.team=team; this.xFrac=xFrac;
    this.W=W;this.H=H;
    this.cx=W*xFrac;
    this.w=W*CFG.castleWFrac;
    this.h=H*CFG.castleHFrac;
    this.cy=groundY(this.cx,W,H)-this.h*0.5;
    this.tilt=Math.atan(groundSlope(this.cx,W,H));
    this.hp=team==='player'?CFG.hp.player:CFG.hp.enemy;
    this.shakeT=0;this.shakeMag=0;
    this.flashT=0;
    this.dead=false;
    this.fissures=[]; /* random crack lines, generated once, masked by current level */
    this._genFissures();
    this.estradeY=[]; /* 3 floors interior */
    for(let i=0;i<3;i++)this.estradeY.push(0.30 + i*0.22);
    this.chars=[];
    for(let f=0;f<3;f++){
      const cfg=CFG.characters[f%CFG.characters.length];
      this.chars.push({floor:f,cfg,alive:true,flash:0,bob:Math.random()*6.28});
    }
  }
  _genFissures(){
    /* generate ~50 crack segments across whole castle */
    this.fissures=[];
    const N=60;
    for(let i=0;i<N;i++){
      const sx=(Math.random()-.5)*0.95;
      const sy=(Math.random()-.5)*0.95;
      const len=0.06+Math.random()*0.18;
      const ang=Math.random()*6.28;
      const seg=[];
      let x=sx,y=sy;
      const steps=4+Math.floor(Math.random()*4);
      for(let s=0;s<steps;s++){
        seg.push({x,y});
        x+=Math.cos(ang+(Math.random()-.5)*0.7)*(len/steps);
        y+=Math.sin(ang+(Math.random()-.5)*0.7)*(len/steps);
      }
      this.fissures.push({pts:seg,thresholdState:Math.floor(Math.random()*7)+1, w:1+Math.random()*1.6});
    }
  }
  damage(dmg,impactX,impactY,parts,audio){
    const oldHP=this.hp;
    this.hp=Math.max(0,this.hp-dmg);
    const oldLevel=fissureLevelFromHP(oldHP);
    const newLevel=fissureLevelFromHP(this.hp);
    this.shakeT=CFG.shake.duration; this.shakeMag=newLevel>oldLevel?CFG.shake.big:CFG.shake.small;
    this.flashT=.45;
    if(audio)audio.hit();
    /* impact particles */
    for(let i=0;i<22;i++){
      parts.push(new Spark(impactX,impactY,(Math.random()-.5)*360,-Math.random()*420-60,'#9aa0a6',2+Math.random()*2,0.6+Math.random()*0.5));
    }
    for(let i=0;i<10;i++){
      parts.push(new Smoke(impactX,impactY,(Math.random()-.5)*120,-60-Math.random()*60,'#94a3b8',8+Math.random()*8,0.7));
    }
    /* potentially kill character if floor matches roughly */
    if(newLevel>oldLevel){
      const aliveChars=this.chars.filter(ch=>ch.alive);
      if(aliveChars.length){
        const victim=aliveChars[Math.floor(Math.random()*aliveChars.length)];
        if(this.hp<60 || newLevel-oldLevel>=2){victim.alive=false;victim.flash=.4;}
      }
    }
    if(this.hp<=0){this.dead=true;}
  }
  update(dt){
    if(this.shakeT>0)this.shakeT-=dt;
    if(this.flashT>0)this.flashT-=dt;
    this.chars.forEach(ch=>{ch.bob+=dt*2;if(ch.flash>0)ch.flash-=dt;});
  }
  /* shake offset */
  _shakeOff(){
    if(this.shakeT<=0)return{x:0,y:0};
    const k=this.shakeT/CFG.shake.duration;
    return{x:(Math.random()-.5)*this.shakeMag*k,y:(Math.random()-.5)*this.shakeMag*k};
  }
  drawExterior(c,interior=false){
    const off=this._shakeOff();
    c.save();
    c.translate(this.cx+off.x,this.cy+off.y);
    c.rotate(this.tilt);
    const img=this.team==='player'?IMG.blue:IMG.red;
    if(img.complete && img.naturalWidth>0){
      c.drawImage(img,-this.w/2,-this.h/2,this.w,this.h);
    }else{
      /* fallback proc */
      c.fillStyle=this.team==='player'?CFG.colors.bluePri:CFG.colors.redPri;
      c.fillRect(-this.w/2,-this.h/2,this.w,this.h);
    }
    if(!interior){
      this._drawFissures(c);
    }
    c.restore();
  }
  _drawFissures(c){
    const lvl=fissureLevelFromHP(this.hp);
    if(lvl===0)return;
    c.save();
    c.scale(this.w*0.5,this.h*0.5);
    c.lineWidth=0;
    c.strokeStyle=CFG.colors.crack;
    for(const f of this.fissures){
      if(f.thresholdState>lvl)continue;
      c.beginPath();
      c.moveTo(f.pts[0].x,f.pts[0].y);
      for(let i=1;i<f.pts.length;i++)c.lineTo(f.pts[i].x,f.pts[i].y);
      c.lineWidth=f.w*0.005;
      c.stroke();
    }
    /* progressive darkening */
    c.globalAlpha=lvl*0.05;
    c.fillStyle='#000';
    c.fillRect(-1,-1,2,2);
    c.globalAlpha=1;
    c.restore();
  }
  drawInterior(c){
    /* draw silhouette of castle as backdrop, then estrades and characters */
    const off=this._shakeOff();
    c.save();
    c.translate(this.cx+off.x,this.cy+off.y);
    c.rotate(this.tilt);
    /* dim interior bg (stone) */
    c.fillStyle='#1c1410';
    c.fillRect(-this.w*0.46,-this.h*0.42,this.w*0.92,this.h*0.84);
    /* arched windows */
    c.fillStyle='#0a0608';
    for(let i=0;i<3;i++){
      const yy=-this.h*0.32+i*this.h*0.27;
      c.beginPath();
      c.arc(-this.w*0.30,yy,this.w*0.04,Math.PI,0);
      c.fillRect(-this.w*0.34,yy,this.w*0.08,4);
      c.fill();
      c.beginPath();
      c.arc(this.w*0.30,yy,this.w*0.04,Math.PI,0);
      c.fillRect(this.w*0.26,yy,this.w*0.08,4);
      c.fill();
    }
    /* estrades — narrow, just a bit wider than the character */
    const lvl=fissureLevelFromHP(this.hp);
    const charSz=this.h*0.18;
    const estW=charSz*1.5;
    const estH=this.h*0.035;
    for(let f=0;f<3;f++){
      const ey=-this.h*0.42 + this.h*this.estradeY[f];
      const charX=0;
      this._drawEstrade(c,charX-estW/2,ey,estW,estH,lvl);
      /* character on this floor */
      const ch=this.chars[f];
      const charY=ey-charSz*0.05;
      if(ch.alive){
        drawCharacter(c,this.team,ch.cfg,charX,charY+Math.sin(ch.bob)*1.2,charSz,ch.flash);
      }else{
        drawTombstone(c,charX,charY,charSz);
      }
    }
    /* general fissures on interior wall too */
    this._drawFissures(c);
    c.restore();
  }
  _drawEstrade(c,x,y,w,h,lvl){
    c.fillStyle=CFG.colors.wood;
    c.fillRect(x,y,w,h);
    c.fillStyle=CFG.colors.woodDk;
    c.fillRect(x,y+h-2,w,2);
    /* plank lines */
    c.strokeStyle=CFG.colors.woodDk;c.lineWidth=1;
    for(let i=1;i<5;i++){c.beginPath();c.moveTo(x+w*i/5,y);c.lineTo(x+w*i/5,y+h);c.stroke();}
    /* fissures on estrade matching castle level */
    if(lvl>0){
      c.strokeStyle='#1a0c04';c.lineWidth=1;
      const cracks=Math.min(lvl*2,12);
      for(let i=0;i<cracks;i++){
        const cx=x+Math.random()*w, cy=y+Math.random()*h;
        c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+(Math.random()-.5)*10,cy+(Math.random()-.5)*4);c.stroke();
      }
    }
  }
  /* world-space muzzle/aim point on top floor */
  muzzlePoint(){
    const ay = this.cy - this.h*0.42 + this.h*this.estradeY[0] - this.h*0.06;
    return {x:this.cx + (this.team==='player'?this.w*0.10:-this.w*0.10), y:ay};
  }
  /* grid 3x1 for interior selection bottom */
  characterCardRect(i,W,H){
    const margin=W*0.04;
    const cardW=(W-margin*4)/3;
    const cardH=cardW*1.05;
    return {x:margin+i*(cardW+margin),y:H-cardH-margin*0.6,w:cardW,h:cardH};
  }
}

/* ─────────── CHARACTER DRAWING (PSB sprites) ─────────── */
function drawCharacter(c,team,cfg,x,y,sz,flash=0){
  const img=IMG[cfg.id];
  c.save();c.translate(x,y);
  /* shadow */
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(0,sz*0.46,sz*0.42,sz*0.10,0,0,6.28);c.fill();
  if(img&&img.complete&&img.naturalWidth>0){
    /* enemies face left (player castle is on left), so flip horizontally for enemy */
    const flip=team==='enemy'?-1:1;
    c.scale(flip,1);
    c.drawImage(img,-sz*0.5,-sz*0.55,sz,sz);
  }else{
    /* fallback rect */
    c.fillStyle=cfg.col;c.fillRect(-sz*0.3,-sz*0.4,sz*0.6,sz*0.8);
  }
  if(flash>0){c.globalAlpha=Math.min(1,flash*2.4);c.fillStyle='#fff';c.fillRect(-sz*0.55,-sz*0.6,sz*1.1,sz*1.15);c.globalAlpha=1;}
  c.restore();
}
function drawTombstone(c,x,y,sz){
  c.save();c.translate(x,y);const sc=sz/40;c.scale(sc,sc);
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(0,18,14,4,0,0,6.28);c.fill();
  c.fillStyle='#71717a';
  c.beginPath();c.moveTo(-12,16);c.lineTo(-12,-6);c.arc(0,-6,12,Math.PI,0);c.lineTo(12,16);c.closePath();c.fill();
  c.fillStyle='#3f3f46';c.font='bold 10px Arial';c.textAlign='center';c.fillText('R.I.P',0,4);
  c.restore();
}

/* ─────────── MISSILE (player) ─────────── */
class Missile{
  constructor(x,y,vx,vy){Object.assign(this,{x,y,vx,vy,trail:[],alive:true,t:0});}
  update(dt){
    this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=CFG.player.gravity*dt;
    this.trail.push({x:this.x,y:this.y});if(this.trail.length>14)this.trail.shift();
    this.t+=dt;
  }
  draw(c){
    /* trail */
    for(let i=0;i<this.trail.length;i++){
      const a=i/this.trail.length;
      c.globalAlpha=a*0.6;c.fillStyle='#fef9c3';
      c.beginPath();c.arc(this.trail[i].x,this.trail[i].y,4*a,0,6.28);c.fill();
    }
    c.globalAlpha=1;
    /* core */
    c.fillStyle='#f59e0b';c.shadowColor='#f59e0b';c.shadowBlur=14;
    c.beginPath();c.arc(this.x,this.y,5,0,6.28);c.fill();
    c.shadowBlur=0;
    c.fillStyle='#fff';c.beginPath();c.arc(this.x-1,this.y-1,2,0,6.28);c.fill();
  }
}

/* ─────────── BIRD (enemy) ─────────── */
class Bird{
  constructor(x0,y0,x1,y1,phaseShift,W){
    this.x0=x0;this.y0=y0;this.x1=x1;this.y1=y1;this.phase=phaseShift;
    const dx=x1-x0;
    this.dur=Math.abs(dx)/(CFG.enemy.birdSpeed*W);
    this.t=0;this.alive=true;this.x=x0;this.y=y0;
    this.smokeT=0;
  }
  update(dt,smokes){
    this.t+=dt/this.dur;
    if(this.t>=1){this.t=1;this.alive=false;}
    const tt=this.t;
    this.x=lerp(this.x0,this.x1,tt);
    /* sinusoidal vertical with linear baseline going from y0 to y1 */
    const baseY=lerp(this.y0,this.y1,tt) - 80*Math.sin(Math.PI*tt); /* arc upward */
    this.y=baseY + Math.sin(tt*Math.PI*CFG.enemy.birdFreq*2 + this.phase)*CFG.enemy.birdAmp*Math.sin(Math.PI*tt);
    this.smokeT+=dt;
    if(this.smokeT>0.025){
      this.smokeT=0;
      smokes.push(new Smoke(this.x,this.y,(Math.random()-.5)*30,-10,'#cbd5e1',5+Math.random()*3,1.0));
    }
  }
  draw(c){
    /* simple bird: body + wings flapping */
    const wing=Math.sin(this.t*40)*.5;
    c.save();c.translate(this.x,this.y);
    /* heading */
    const dir=this.x1>this.x0?1:-1;c.scale(dir,1);
    c.fillStyle='#1f2937';
    c.beginPath();c.ellipse(0,0,11,5,0,0,6.28);c.fill();
    /* wings */
    c.beginPath();c.moveTo(-2,-1);c.lineTo(-10,-8-wing*4);c.lineTo(2,-2);c.closePath();c.fill();
    c.beginPath();c.moveTo(-2,1);c.lineTo(-10,8+wing*4);c.lineTo(2,2);c.closePath();c.fill();
    /* head */
    c.fillStyle='#374151';c.beginPath();c.arc(8,-1,4,0,6.28);c.fill();
    /* beak */
    c.fillStyle='#f59e0b';c.beginPath();c.moveTo(11,-1);c.lineTo(15,-1);c.lineTo(11,2);c.closePath();c.fill();
    /* eye */
    c.fillStyle='#fff';c.fillRect(8,-3,2,2);
    c.restore();
  }
}

/* ─────────── CAMERA ─────────── */
class Camera{
  constructor(W,H){this.W=W;this.H=H;
    this.x=W/2;this.y=H/2;this.zoom=1;
    this.tx=W/2;this.ty=H/2;this.tz=1;
    this.follow=null;
    this.shake=0;this.shakeMag=0;
  }
  setTarget(x,y,z){this.tx=x;this.ty=y;this.tz=z;this.follow=null;}
  followObj(obj){this.follow=obj;}
  hit(mag,dur=.3){this.shake=dur;this.shakeMag=mag;}
  update(dt){
    if(this.follow){this.tx=this.follow.x;this.ty=this.follow.y-30;}
    const k=Math.min(1,dt*4.0);
    this.x=lerp(this.x,this.tx,k);
    this.y=lerp(this.y,this.ty,k);
    this.zoom=lerp(this.zoom,this.tz,k);
    if(this.shake>0)this.shake-=dt;
  }
  apply(c){
    c.save();
    c.translate(this.W/2,this.H/2);
    c.scale(this.zoom,this.zoom);
    let sx=0,sy=0;
    if(this.shake>0){const k=this.shake/.35;sx=(Math.random()-.5)*this.shakeMag*k;sy=(Math.random()-.5)*this.shakeMag*k;}
    c.translate(-this.x+sx,-this.y+sy);
  }
  restore(c){c.restore();}
}

/* ─────────── GAME ─────────── */
const STATE={INTRO:'intro',ENEMY_SHOWCASE:'enemyShow',TO_WIDE:'toWide',PLAYER_TURN:'playerTurn',PLAYER_FIRE:'playerFire',ENEMY_TURN:'enemyTurn',ENEMY_FIRE:'enemyFire',END:'end'};

class Game{
  constructor(){
    this.canvas=document.getElementById('gc');this.ctx=this.canvas.getContext('2d');
    this.audio=new AudioMgr();
    this.state=STATE.INTRO;
    this.t=0;this.stateT=0;
    this.particles=[];
    this.smokes=[];
    this.flyTrees=[];
    this.missiles=[];
    this.birds=[];
    this.selected=0;
    this.aiming=false;this.aimX=0;this.aimY=0;this.aimStartX=0;this.aimStartY=0;
    this.bottomRedT=0;
    this.endingShown=false;
    this.resize();window.addEventListener('resize',()=>this.resize());
    this.cam=new Camera(this.W,this.H);
    this._setupEvents();
    this._buildWorld();
    this.cam.tx=this.enemy.cx;this.cam.ty=this.enemy.cy;this.cam.tz=1.55;
    this.cam.x=this.enemy.cx;this.cam.y=this.enemy.cy;this.cam.zoom=1.55;
  }
  resize(){
    this.W=this.canvas.width=window.innerWidth*devicePixelRatio;
    this.H=this.canvas.height=window.innerHeight*devicePixelRatio;
    this.canvas.style.width=window.innerWidth+'px';
    this.canvas.style.height=window.innerHeight+'px';
    this.ctx.setTransform(1,0,0,1,0,0);
    if(this.player)this._buildWorld();
    if(this.cam){this.cam.W=this.W;this.cam.H=this.H;}
  }
  _buildWorld(){
    this.player=new Castle('player',CFG.playerXFrac,this.W,this.H);
    this.enemy=new Castle('enemy',CFG.enemyXFrac,this.W,this.H);
    /* trees */
    this.trees=[];
    for(let i=0;i<CFG.trees;i++){
      const x=this.W*(0.05+Math.random()*0.9);
      if(Math.abs(x-this.player.cx)<this.player.w*0.7)continue;
      if(Math.abs(x-this.enemy.cx)<this.enemy.w*0.7)continue;
      this.trees.push({x,y:groundY(x,this.W,this.H),scale:0.7+Math.random()*0.6,alive:true});
    }
  }
  _setupEvents(){
    const c=this.canvas;
    const getXY=(e)=>{
      const r=c.getBoundingClientRect();
      const t=e.touches?e.touches[0]:e;
      return{x:(t.clientX-r.left)*devicePixelRatio,y:(t.clientY-r.top)*devicePixelRatio};
    };
    const start=(e)=>{
      e.preventDefault();const p=getXY(e);
      this.audio.resume();
      if(this.state===STATE.PLAYER_TURN){
        /* check character card click */
        for(let i=0;i<3;i++){
          const r=this.player.characterCardRect(i,this.W,this.H);
          if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h){this.selected=i;this.audio.click();return;}
        }
        this.aiming=true;this.aimStartX=p.x;this.aimStartY=p.y;this.aimX=p.x;this.aimY=p.y;
      }
    };
    const move=(e)=>{e.preventDefault();if(this.aiming){const p=getXY(e);this.aimX=p.x;this.aimY=p.y;}};
    const end=(e)=>{e.preventDefault();if(this.aiming){this.aiming=false;this._fireMissiles();}};
    c.addEventListener('touchstart',start,{passive:false});
    c.addEventListener('touchmove',move,{passive:false});
    c.addEventListener('touchend',end,{passive:false});
    c.addEventListener('mousedown',start);
    c.addEventListener('mousemove',move);
    c.addEventListener('mouseup',end);
  }
  start(){
    this.audio.init();this.audio.resume();
    this.state=STATE.ENEMY_SHOWCASE;this.stateT=0;
    document.getElementById('sIntro').classList.add('hidden');
    /* show hint over enemy */
    this._showHint("ENEMY KINGDOM");
    setTimeout(()=>{this._hideHint();this._toWide();},1500);
    this._loop();
  }
  _showHint(t){const el=document.getElementById('sHint');el.textContent=t;el.classList.remove('hidden');}
  _hideHint(){document.getElementById('sHint').classList.add('hidden');}
  _toWide(){
    this.state=STATE.TO_WIDE;
    /* move camera to wide view of both castles */
    const midX=(this.player.cx+this.enemy.cx)/2;
    const midY=(this.player.cy+this.enemy.cy)/2;
    this.cam.tx=midX;this.cam.ty=midY-30;this.cam.tz=this._wideZoom();
    setTimeout(()=>this._beginPlayerTurn(),1100);
  }
  _wideZoom(){
    const span=Math.abs(this.enemy.cx-this.player.cx)+this.player.w*1.5;
    return Math.min(1,(this.W*0.95)/span);
  }
  _beginPlayerTurn(){
    if(this.player.dead||this.enemy.dead)return this._end();
    this.state=STATE.PLAYER_TURN;this.stateT=0;
    this.fired=false;
    /* zoom on player castle interior */
    this.cam.tx=this.player.cx;this.cam.ty=this.player.cy;this.cam.tz=1.55;
    this._showHint("DRAG TO AIM • RELEASE TO FIRE");
    if(this._hintTimer)clearTimeout(this._hintTimer);
    this._hintTimer=setTimeout(()=>this._hideHint(),2400);
    /* auto-fire safety net so the playable never stalls */
    if(this._autoFireTimer)clearTimeout(this._autoFireTimer);
    this._autoFireTimer=setTimeout(()=>{
      if(this.state===STATE.PLAYER_TURN&&!this.fired){this._autoFire();}
    },7000);
  }
  _autoFire(){
    /* default trajectory toward enemy castle */
    const m=this.player.muzzlePoint();
    const t=this.player.muzzlePoint(); /* placeholder */
    const target={x:this.enemy.cx,y:this.enemy.cy-this.enemy.h*0.10};
    const dx=target.x-m.x, dy=target.y-m.y;
    /* solve approx parabolic: choose v so apex clears */
    const baseAng=Math.atan2(dy-Math.abs(dx)*0.55,dx); /* angle slightly upward */
    const power=0.95;
    this._spawnMissiles(m,baseAng,power);
  }
  _spawnMissiles(muzzle,baseAng,power){
    const N=CFG.player.missiles;
    const spread=CFG.player.spreadDeg*Math.PI/180;
    for(let i=0;i<N;i++){
      const a=baseAng + (i-(N-1)/2)*(spread/(N-1));
      const v=power*900;
      const vx=Math.cos(a)*v;const vy=Math.sin(a)*v;
      this.missiles.push(new Missile(muzzle.x,muzzle.y,vx,vy));
    }
    this.audio.shoot();this.fired=true;
    this.state=STATE.PLAYER_FIRE;this.stateT=0;
    this.cam.followObj(this.missiles[Math.floor(N/2)]);
    this.cam.tz=1.05;
    if(this._autoFireTimer)clearTimeout(this._autoFireTimer);
  }
  _fireMissiles(){
    /* compute power & angle from drag */
    const muzzle=this.player.muzzlePoint();
    const aimWorld=this._screenToWorld(this.aimX,this.aimY);
    const startWorld=this._screenToWorld(this.aimStartX,this.aimStartY);
    let dx=startWorld.x-aimWorld.x; /* slingshot: drag back to fire forward */
    let dy=startWorld.y-aimWorld.y;
    const len=Math.hypot(dx,dy);
    if(len<this.W*0.025){
      /* tap-to-fire fallback: shoot toward enemy with default trajectory */
      return this._autoFire();
    }
    const power=clamp(len/(this.W*0.18),CFG.player.minPower,CFG.player.maxPower);
    const baseAng=Math.atan2(dy,dx);
    this._spawnMissiles(muzzle,baseAng,power);
  }
  _screenToWorld(sx,sy){
    return{
      x:(sx-this.W/2)/this.cam.zoom + this.cam.x,
      y:(sy-this.H/2)/this.cam.zoom + this.cam.y
    };
  }
  _hitTest(m,c){
    return m.x>c.cx-c.w*0.45 && m.x<c.cx+c.w*0.45 && m.y>c.cy-c.h*0.45 && m.y<c.cy+c.h*0.45;
  }
  _checkImpacts(){
    /* player missiles vs enemy */
    for(const m of this.missiles){
      if(!m.alive)continue;
      if(m.y>groundY(m.x,this.W,this.H)){
        m.alive=false;this._groundImpact(m.x,m.y);continue;
      }
      if(this._hitTest(m,this.enemy)){
        m.alive=false;
        this.enemy.damage(CFG.player.baseDmg,m.x,m.y,this.particles,this.audio);
        this.cam.hit(8);
        this.bottomRedT=.5;
        for(let i=0;i<14;i++)this.particles.push(new Spark(m.x,m.y,(Math.random()-.5)*420,-Math.random()*440-100,'#fbbf24',2,0.7));
      }
    }
    this.missiles=this.missiles.filter(m=>m.alive);
    /* birds vs player */
    for(const b of this.birds){
      if(!b.alive)continue;
      if(this._hitTest(b,this.player)){
        b.alive=false;
        this.player.damage(CFG.enemy.dmgPerBird,b.x,b.y,this.particles,this.audio);
        this.cam.hit(8);
        this.bottomRedT=.5;
        for(let i=0;i<14;i++)this.particles.push(new Spark(b.x,b.y,(Math.random()-.5)*420,-Math.random()*440-100,'#fca5a5',2,0.7));
      }
    }
    this.birds=this.birds.filter(b=>b.alive);
  }
  _groundImpact(x,y){
    this.audio.boom();this.cam.hit(6);this.bottomRedT=.4;
    for(let i=0;i<18;i++)this.particles.push(new Spark(x,y,(Math.random()-.5)*340,-Math.random()*380-60,'#a16207',2,0.7));
    /* uproot nearby trees */
    for(const t of this.trees){
      if(t.alive && Math.abs(t.x-x)<60){
        t.alive=false;
        this.flyTrees.push(new FlyingTree(t.x,t.y-12,t.scale));
      }
    }
  }
  _enemyFire(){
    const muzzle=this.enemy.muzzlePoint();
    const target=this.player.muzzlePoint();
    /* two birds, opposite phase */
    this.birds.push(new Bird(muzzle.x,muzzle.y,target.x,target.y,0,this.W));
    this.birds.push(new Bird(muzzle.x,muzzle.y,target.x,target.y,Math.PI,this.W));
    this.audio.caw();
    this.cam.followObj(this.birds[0]);
    this.cam.tz=1.05;
    this.state=STATE.ENEMY_FIRE;this.stateT=0;
  }
  _beginEnemyTurn(){
    if(this.player.dead||this.enemy.dead)return this._end();
    this.state=STATE.ENEMY_TURN;this.stateT=0;
    this.cam.tx=this.enemy.cx;this.cam.ty=this.enemy.cy;this.cam.tz=1.55;
    this._showHint("ENEMY ATTACKS!");
    setTimeout(()=>{this._hideHint();this._enemyFire();},1100);
  }
  _end(){
    if(this.endingShown)return;
    this.endingShown=true;
    this.state=STATE.END;
    const win=this.enemy.dead;
    setTimeout(()=>{
      const r=document.getElementById('sResult');
      const t=document.getElementById('rTitle');
      const s=document.getElementById('rSub');
      r.classList.remove('hidden');
      t.textContent=win?'VICTORY!':'DEFEATED!';
      t.className='rTitle '+(win?'win':'lose');
      s.textContent=win?'Download to conquer all kingdoms!':'Try again — your kingdom needs you!';
      win?this.audio.win():this.audio.lose();
    },1100);
  }
  _loop(){
    let last=performance.now();
    const tick=(now)=>{
      const dt=Math.min(.05,(now-last)/1000);last=now;
      this.update(dt);this.draw();
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  update(dt){
    this.t+=dt;this.stateT+=dt;
    this.cam.update(dt);
    this.player.update(dt);this.enemy.update(dt);
    if(this.bottomRedT>0)this.bottomRedT-=dt;
    this.particles.forEach(p=>p.update(dt));this.particles=this.particles.filter(p=>p.alive);
    this.smokes.forEach(s=>s.update(dt));this.smokes=this.smokes.filter(s=>s.alive);
    this.flyTrees.forEach(t=>t.update(dt));this.flyTrees=this.flyTrees.filter(t=>t.alive);
    this.missiles.forEach(m=>m.update(dt));
    this.birds.forEach(b=>b.update(dt,this.smokes));
    this._checkImpacts();
    /* state machine transitions */
    if(this.state===STATE.PLAYER_FIRE){
      if(this.missiles.length===0 && this.particles.length<6 && this.stateT>1.4){
        this.cam.follow=null;
        if(this.enemy.dead){this._end();return;}
        /* pull back to wide, then enemy turn */
        const midX=(this.player.cx+this.enemy.cx)/2;
        const midY=(this.player.cy+this.enemy.cy)/2;
        this.cam.tx=midX;this.cam.ty=midY-30;this.cam.tz=this._wideZoom();
        this.state=STATE.TO_WIDE;this.stateT=0;
        setTimeout(()=>this._beginEnemyTurn(),900);
      }
    }else if(this.state===STATE.ENEMY_FIRE){
      if(this.birds.length===0 && this.particles.length<6 && this.stateT>1.4){
        this.cam.follow=null;
        if(this.player.dead){this._end();return;}
        const midX=(this.player.cx+this.enemy.cx)/2;
        const midY=(this.player.cy+this.enemy.cy)/2;
        this.cam.tx=midX;this.cam.ty=midY-30;this.cam.tz=this._wideZoom();
        this.state=STATE.TO_WIDE;this.stateT=0;
        setTimeout(()=>this._beginPlayerTurn(),900);
      }
    }
  }
  draw(){
    const c=this.ctx,W=this.W,H=this.H;
    /* sky */
    const g=c.createLinearGradient(0,0,0,H*0.85);
    g.addColorStop(0,CFG.colors.sky0);g.addColorStop(.55,CFG.colors.sky1);g.addColorStop(1,CFG.colors.sky2);
    c.fillStyle=g;c.fillRect(0,0,W,H);
    /* clouds */
    c.fillStyle='rgba(255,255,255,0.06)';
    for(let i=0;i<5;i++){c.beginPath();c.arc((this.t*8+i*W*0.3)%W,80+i*30,40+i*8,0,6.28);c.fill();}
    this.cam.apply(c);
    /* hills */
    this._drawHills(c,W,H);
    /* trees */
    for(const t of this.trees){if(t.alive){c.save();c.translate(t.x,t.y-12);c.scale(t.scale,t.scale);drawTreeShape(c);c.restore();}}
    this.flyTrees.forEach(t=>t.draw(c));
    /* ground */
    this._drawGround(c,W,H);
    /* castles */
    /* Determine if interior view should be rendered: when state is PLAYER_TURN/PLAYER_FIRE with high zoom on player, show interior */
    const showPlayerInside=(this.state===STATE.PLAYER_TURN);
    const showEnemyInside=(this.state===STATE.ENEMY_TURN);
    if(showPlayerInside){
      this.player.drawInterior(c);
      this.enemy.drawExterior(c);
    }else if(showEnemyInside){
      this.player.drawExterior(c);
      this.enemy.drawInterior(c);
    }else{
      this.player.drawExterior(c);
      this.enemy.drawExterior(c);
    }
    /* projectiles */
    this.missiles.forEach(m=>m.draw(c));
    this.birds.forEach(b=>b.draw(c));
    /* particles */
    this.smokes.forEach(s=>s.draw(c));
    this.particles.forEach(p=>p.draw(c));
    /* aim trajectory preview */
    if(this.aiming&&this.state===STATE.PLAYER_TURN){
      this._drawTrajectory(c);
    }
    this.cam.restore(c);
    /* HUD: hp bars */
    this._drawHUD(c,W,H);
    /* bottom red flash on damage */
    if(this.bottomRedT>0){
      const a=this.bottomRedT/.5;
      const gg=c.createLinearGradient(0,H*0.6,0,H);
      gg.addColorStop(0,'rgba(220,30,30,0)');
      gg.addColorStop(1,'rgba(220,30,30,'+(a*0.6).toFixed(2)+')');
      c.fillStyle=gg;c.fillRect(0,H*0.6,W,H*0.4);
    }
    /* highlight selection cards + small finger + draggable aim hint */
    if(this.state===STATE.PLAYER_TURN){
      this._drawAimHint(c,W,H);
      this._drawCharacterCards(c,W,H);
      this._drawFingerCursor(c,W,H);
    }
  }
  _drawHills(c,W,H){
    /* draw 3 hill layers */
    const layers=[{col:CFG.colors.hill2,off:60,amp:30,freq:0.005},{col:CFG.colors.hill1,off:30,amp:24,freq:0.008},{col:CFG.colors.hill0,off:0,amp:18,freq:0.012}];
    for(const l of layers){
      c.fillStyle=l.col;
      c.beginPath();c.moveTo(-200,H);
      for(let x=-200;x<=W+200;x+=20){
        c.lineTo(x,groundY(x,W,H)-l.off-Math.sin(x*l.freq)*l.amp);
      }
      c.lineTo(W+200,H);c.closePath();c.fill();
    }
  }
  _drawGround(c,W,H){
    c.fillStyle=CFG.colors.ground;
    c.beginPath();c.moveTo(-200,H);
    for(let x=-200;x<=W+200;x+=8){c.lineTo(x,groundY(x,W,H));}
    c.lineTo(W+200,H);c.closePath();c.fill();
    c.strokeStyle=CFG.colors.groundLine;c.lineWidth=2;
    c.beginPath();
    for(let x=-200;x<=W+200;x+=8){const y=groundY(x,W,H);if(x===-200)c.moveTo(x,y);else c.lineTo(x,y);}
    c.stroke();
  }
  _drawTrajectory(c){
    /* simulate parabolic trajectory of MIDDLE missile and draw white circles decreasing */
    const aimWorld=this._screenToWorld(this.aimX,this.aimY);
    const startWorld=this._screenToWorld(this.aimStartX,this.aimStartY);
    let dx=startWorld.x-aimWorld.x, dy=startWorld.y-aimWorld.y;
    const len=Math.hypot(dx,dy);if(len<6)return;
    const power=clamp(len/(this.W*0.18),CFG.player.minPower,CFG.player.maxPower);
    const baseAng=Math.atan2(dy,dx);
    const v=power*900;
    let px=this.player.muzzlePoint().x,py=this.player.muzzlePoint().y;
    let vx=Math.cos(baseAng)*v,vy=Math.sin(baseAng)*v;
    const dt=0.04;
    for(let i=0;i<26;i++){
      px+=vx*dt;py+=vy*dt;vy+=CFG.player.gravity*dt;
      const r=Math.max(1,5-i*0.16);
      c.globalAlpha=Math.max(.15,1-i*0.04);
      c.fillStyle='#fff';
      c.beginPath();c.arc(px,py,r,0,6.28);c.fill();
      if(py>groundY(px,this.W,this.H))break;
    }
    c.globalAlpha=1;
  }
  _drawHUD(c,W,H){
    /* HP bars top */
    const padX=W*0.04, padY=H*0.025, barW=W*0.32, barH=H*0.022;
    /* player (left) */
    c.fillStyle='rgba(0,0,0,.55)';c.fillRect(padX-4,padY-4,barW+8,barH+8);
    c.fillStyle='#1e3a8a';c.fillRect(padX,padY,barW,barH);
    c.fillStyle=CFG.colors.bluePri;c.fillRect(padX,padY,barW*Math.max(0,this.player.hp/CFG.hp.player),barH);
    c.fillStyle='#fff';c.font=`bold ${Math.floor(barH*0.8)}px Arial`;c.textAlign='left';c.textBaseline='middle';
    c.fillText('YOU '+Math.round(this.player.hp)+'%',padX+6,padY+barH/2);
    /* enemy (right) */
    const ex=W-padX-barW;
    c.fillStyle='rgba(0,0,0,.55)';c.fillRect(ex-4,padY-4,barW+8,barH+8);
    c.fillStyle='#7f1d1d';c.fillRect(ex,padY,barW,barH);
    c.fillStyle=CFG.colors.redPri;c.fillRect(ex+barW*(1-Math.max(0,this.enemy.hp/CFG.hp.enemy)),padY,barW*Math.max(0,this.enemy.hp/CFG.hp.enemy),barH);
    c.fillStyle='#fff';c.textAlign='right';
    c.fillText(Math.round(this.enemy.hp)+'% ENEMY',W-padX-6,padY+barH/2);
  }
  _drawCharacterCards(c,W,H){
    for(let i=0;i<3;i++){
      const r=this.player.characterCardRect(i,W,H);
      const ch=this.player.chars[i];
      const sel=(i===this.selected);
      c.fillStyle=sel?'rgba(245,158,11,.35)':'rgba(0,0,0,.55)';
      c.fillRect(r.x,r.y,r.w,r.h);
      c.strokeStyle=sel?'#f59e0b':'rgba(255,255,255,.25)';c.lineWidth=sel?3:1.5;
      c.strokeRect(r.x,r.y,r.w,r.h);
      /* portrait */
      c.save();c.translate(r.x+r.w/2,r.y+r.h*0.55);
      drawCharacter(c,'player',ch.cfg,0,0,r.h*0.55,0);
      c.restore();
      /* name */
      c.fillStyle='#fde68a';c.font=`bold ${Math.floor(r.h*0.13)}px Arial`;c.textAlign='center';c.textBaseline='middle';
      c.fillText(ch.cfg.name.toUpperCase(),r.x+r.w/2,r.y+r.h*0.1);
      if(!ch.alive){
        c.fillStyle='rgba(0,0,0,.65)';c.fillRect(r.x,r.y,r.w,r.h);
        c.fillStyle='#ef4444';c.font=`bold ${Math.floor(r.h*0.18)}px Arial`;c.fillText('DOWN',r.x+r.w/2,r.y+r.h/2);
      }
    }
  }
  _drawFingerCursor(c,W,H){
    /* small finger pointing at the selected character card */
    const r=this.player.characterCardRect(this.selected,W,H);
    const fx=r.x+r.w*0.78;
    const fy=r.y - 4 + Math.sin(this.t*5)*3;
    const k=Math.min(W,H)*0.018; /* compact size */
    c.save();c.translate(fx,fy);c.scale(k/12,k/12);
    c.fillStyle='#fde68a';
    c.beginPath();c.arc(0,10,7,0,6.28);c.fill();
    c.fillRect(-6,10,12,8);
    c.fillStyle='#fcd34d';
    c.fillRect(-2,-8,4,12);
    c.beginPath();c.arc(0,-8,2,0,6.28);c.fill();
    c.strokeStyle='#92400e';c.lineWidth=1.2;
    c.beginPath();c.arc(0,10,7,0,6.28);c.stroke();
    c.strokeRect(-2,-8,4,12);
    c.restore();
  }
  _drawAimHint(c,W,H){
    /* big animated finger over the player castle muzzle area, demonstrating drag */
    if(this.aiming||this.stateT>3.2)return;
    const m=this.player.muzzlePoint();
    const sw=this._worldToScreen(m.x,m.y);
    const phase=(this.t*1.5)%1;
    const dragLen=Math.min(W,H)*0.18;
    const angle=Math.PI*0.85; /* up-back direction */
    const dx=-Math.cos(angle)*dragLen*phase;
    const dy=-Math.sin(angle)*dragLen*phase;
    const fx=sw.x+dx, fy=sw.y+dy;
    /* arrow */
    c.save();
    c.globalAlpha=0.6+Math.sin(this.t*5)*0.25;
    c.strokeStyle='#fde68a';c.lineWidth=3;c.setLineDash([8,6]);
    c.beginPath();c.moveTo(sw.x,sw.y);c.lineTo(fx,fy);c.stroke();
    c.setLineDash([]);
    /* finger glyph */
    const k=Math.min(W,H)*0.045;
    c.translate(fx,fy);c.scale(k/14,k/14);
    c.fillStyle='#fde68a';
    c.beginPath();c.arc(0,12,9,0,6.28);c.fill();
    c.fillRect(-8,12,16,12);
    c.fillStyle='#fcd34d';
    c.fillRect(-3,-10,6,14);
    c.beginPath();c.arc(0,-10,3,0,6.28);c.fill();
    c.strokeStyle='#92400e';c.lineWidth=1.5;
    c.beginPath();c.arc(0,12,9,0,6.28);c.stroke();
    c.strokeRect(-3,-10,6,14);
    c.restore();
  }
  _worldToScreen(wx,wy){
    return{x:(wx-this.cam.x)*this.cam.zoom + this.W/2, y:(wy-this.cam.y)*this.cam.zoom + this.H/2};
  }
}

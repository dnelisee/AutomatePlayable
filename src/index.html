*{margin:0;padding:0;box-sizing:border-box;}

canvas{position:absolute;top:0;left:0;touch-action:none;}

.t2{font-size:clamp(12px,3.2vw,16px);color:#93c5fd;text-align:center;margin:10px 0 28px;letter-spacing:1px;}

.btn-go{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1c0a00;font-size:clamp(15px,4vw,21px);font-weight:900;padding:15px 46px;border:none;border-radius:50px;cursor:pointer;letter-spacing:2px;box-shadow:0 4px 20px rgba(245,158,11,.5),0 0 0 3px #78350f;text-transform:uppercase;-webkit-tap-highlight-color:transparent;}

.r-title{font-size:clamp(42px,10vw,72px);font-weight:900;text-align:center;margin-bottom:10px;text-shadow:0 0 28px currentColor;}

.btn-dl{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;font-size:clamp(14px,3.8vw,20px);font-weight:900;padding:15px 38px;border:none;border-radius:50px;cursor:pointer;letter-spacing:1.5px;text-transform:uppercase;box-shadow:0 4px 18px rgba(34,197,94,.4);margin-bottom:10px;-webkit-tap-highlight-color:transparent;}

<script>
/* ═══════════════════════════════════════════════════
   CONFIG — single object for all A/B test variants
═══════════════════════════════════════════════════ */
const CONFIG = {
  colors:{
    sky0:'#080f1c', sky1:'#0f2444', sky2:'#1a3a6e', sky3:'#2a5fa5', horizon:'#4a8fc4',
    hill0:'#0d2310', hill1:'#143019', hill2:'#1c4022',
    ground:'#254d18', groundLine:'#1a3a10',
    panelBg:'rgba(5,10,20,0.92)', panelBorder:'rgba(100,130,200,0.25)',
    playerMain:'#2563eb', playerDark:'#1e3a8a', playerLight:'#93c5fd', playerStone:'#3b6db5',
    enemyMain:'#dc2626',  enemyDark:'#7f1d1d',  enemyLight:'#fca5a5', enemyStone:'#b53b3b',
  },
  game:{
    playerHP:400, enemyHP:400,
    numFloors:4,
    groundFrac:0.66,
    castleWFrac:0.21,
    castleHFrac:0.33,
    treadHFrac:0.065,
    playerXFrac:0.20,
    enemyXFrac:0.80,
    panelFrac:0.75,    // card panel top edge
    rainOn:true,
  },
  units:[
    {id:'gunner', name:'GUNNER', dmg:14, fireRate:0.42, pSpeed:0.62, pArc:0.07, pCol:'#4ade80'},
    {id:'bomber', name:'BOMBER', dmg:38, fireRate:0.22, pSpeed:0.40, pArc:0.17, pCol:'#fb923c'},
    {id:'archer', name:'ARCHER', dmg:9,  fireRate:0.68, pSpeed:0.78, pArc:0.04, pCol:'#facc15'},
  ],
  enemy:{
    firstDelay:3.2,
    spawnInterval:4.8,
    probs:[0.40,0.30,0.30],
  },
};

/* ═══════════════════ AUDIO ═══════════════════ */
class AudioMgr{
  constructor(){this.ac=null;}
  init(){try{this.ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  resume(){this.ac&&this.ac.state==='suspended'&&this.ac.resume();}
  _t(f,d,type='square',vol=.2,delay=0){
    if(!this.ac)return;
    const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.connect(g);g.connect(this.ac.destination);
    o.type=type;o.frequency.setValueAtTime(f,this.ac.currentTime+delay);
    g.gain.setValueAtTime(vol,this.ac.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(.001,this.ac.currentTime+delay+d);
    o.start(this.ac.currentTime+delay);o.stop(this.ac.currentTime+delay+d+.01);
  }
  place(){this._t(660,.08,'sine',.32);this._t(880,.07,'sine',.28,.07);}
  shoot(){this._t(320,.06,'square',.13);}
  boom(){this._t(80,.28,'sawtooth',.42);this._t(55,.2,'sine',.3,.06);}
  bigBoom(){this._t(70,.4,'sawtooth',.5);this._t(50,.32,'sine',.38,.08);}
  noSlot(){this._t(180,.07,'square',.2);this._t(140,.06,'square',.15,.05);}
  victory(){[523,659,784,1047].forEach((f,i)=>this._t(f,.32,'sine',.36,i*.13));}
  defeat(){[440,349,294,196].forEach((f,i)=>this._t(f,.32,'sine',.3,i*.17));}
}

/* ═══════════════════ PARTICLES ═══════════════ */
class Particle{
  constructor(x,y,vx,vy,col,r,life){
    Object.assign(this,{x,y,vx,vy,col,r,life,maxLife:life,alive:true});
  }
  update(dt){
    this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=440*dt;
    this.life-=dt;if(this.life<=0)this.alive=false;
  }
  draw(ctx){
    const a=Math.max(0,this.life/this.maxLife);
    ctx.globalAlpha=a*a;ctx.fillStyle=this.col;
    ctx.beginPath();ctx.arc(this.x,this.y,this.r*Math.max(.1,a),0,6.28);ctx.fill();
    ctx.globalAlpha=1;
  }
}
class Smoke extends Particle{
  update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy*=.97;this.r+=dt*8;this.life-=dt;if(this.life<=0)this.alive=false;}
}
class FloatText{
  constructor(x,y,txt,col,sz=14){Object.assign(this,{x,y,txt,col,sz,vy:-55,life:1.1,maxLife:1.1,alive:true});}
  update(dt){this.y+=this.vy*dt;this.vy*=.94;this.life-=dt;if(this.life<=0)this.alive=false;}
  draw(ctx){
    const a=Math.max(0,this.life/this.maxLife);
    ctx.globalAlpha=a;ctx.fillStyle=this.col;ctx.font=`bold ${this.sz}px Arial`;ctx.textAlign='center';
    ctx.fillText(this.txt,this.x,this.y);ctx.globalAlpha=1;
  }
}

/* ═══════════════════ PROJECTILE ═══════════════ */
class Projectile{
  constructor(x0,y0,x1,y1,cfg,team,W){
    this.x0=x0;this.y0=y0;this.x1=x1;this.y1=y1;
    this.cfg=cfg;this.team=team;this.W=W;
    const dx=x1-x0,dy=y1-y0;
    const dist=Math.sqrt(dx*dx+dy*dy);
    this.dur=dist/(cfg.pSpeed*W);
    this.arcH=cfg.pArc*dist;
    this.t=0;this.alive=true;
    this.x=x0;this.y=y0;
    this.trail=[];
  }
  update(dt){
    this.t+=dt/this.dur;
    if(this.t>=1){this.t=1;this.alive=false;}
    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>8)this.trail.shift();
    this.x=this.x0+this.t*(this.x1-this.x0);
    this.y=this.y0+this.t*(this.y1-this.y0)-this.arcH*4*this.t*(1-this.t);
  }
  draw(ctx,W){
    const r=Math.max(3,W*.009);
    // trail
    for(let i=0;i<this.trail.length;i++){
      const a=i/this.trail.length*.4;
      ctx.globalAlpha=a;ctx.fillStyle=this.cfg.pCol;
      ctx.beginPath();ctx.arc(this.trail[i].x,this.trail[i].y,r*(i/this.trail.length),0,6.28);ctx.fill();
    }
    ctx.globalAlpha=1;
    // main
    ctx.fillStyle=this.cfg.pCol;
    ctx.shadowColor=this.cfg.pCol;ctx.shadowBlur=r*3;
    ctx.beginPath();ctx.arc(this.x,this.y,r,0,6.28);ctx.fill();
    ctx.shadowBlur=0;
    // special shapes
    if(this.cfg.id==='bomber'){
      ctx.strokeStyle='#1c1917';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(this.x,this.y,r,0,6.28);ctx.stroke();
      ctx.fillStyle='#fef08a';ctx.beginPath();ctx.arc(this.x-r*.3,this.y-r*.3,r*.35,0,6.28);ctx.fill();
    }else if(this.cfg.id==='archer'){
      const ang=Math.atan2(this.y1-this.y0,this.x1-this.x0);
      ctx.save();ctx.translate(this.x,this.y);ctx.rotate(ang);
      ctx.strokeStyle=this.cfg.pCol;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(-r*2,0);ctx.lineTo(r*2,0);ctx.stroke();
      ctx.fillStyle='#e7e5e4';ctx.beginPath();ctx.moveTo(r*2,0);ctx.lineTo(r*1,-r*.7);ctx.lineTo(r*1,r*.7);ctx.fill();
      ctx.restore();
    }
  }
}

/* ═══════════════════ UNIT ═══════════════════ */
class Unit{
  constructor(cfg,floorRef,dir){
    this.cfg=cfg;this.floor=floorRef;this.dir=dir;
    this.shotTimer=.5+Math.random()*1.5;
    this.animT=0;this.fireT=0;
  }
  update(dt,projs,targetCastle,parts,audio,W,H){
    this.animT+=dt;this.fireT=Math.max(0,this.fireT-dt);
    this.shotTimer-=dt;
    if(this.shotTimer<=0){
      this.shotTimer=1/this.cfg.fireRate;this.fireT=.18;
      audio.shoot();
      const x0=this.floor.x+(this.dir>0?W*.06:-W*.06);
      const y0=this.floor.y-H*.025;
      // aim at random floor of enemy
      const tf=targetCastle.floors[Math.floor(Math.random()*targetCastle.floors.length)];
      const x1=tf.x+(Math.random()-.5)*W*.04;
      const y1=tf.y-H*.015;
      projs.push(new Projectile(x0,y0,x1,y1,this.cfg,this.floor.team,W));
    }
  }
  draw(ctx,W,H){
    const x=this.floor.x,y=this.floor.y;
    const s=H*.044;
    const f=this.fireT>0;
    ctx.save();ctx.translate(x,y);
    if(f){ctx.filter='brightness(2.5)';}
    if(this.cfg.id==='gunner')this._gun(ctx,s,W,H);
    else if(this.cfg.id==='bomber')this._bomb(ctx,s,W,H);
    else this._arch(ctx,s,W,H);
    ctx.filter='none';ctx.restore();
  }
  _gun(ctx,s,W,H){
    const d=this.dir,t=this.animT,bone='#e7e5e4',dark='#1c1917';
    // legs
    ctx.strokeStyle=bone;ctx.lineWidth=s*.18;ctx.lineCap='round';
    const ls=Math.sin(t*5)*s*.12;
    ctx.beginPath();ctx.moveTo(-s*.08,-s*.75);ctx.lineTo(s*.05+ls,0);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-s*.08,-s*.75);ctx.lineTo(s*.05-ls,0);ctx.stroke();
    // feet
    ctx.fillStyle=dark;ctx.beginPath();ctx.ellipse(s*.05+ls,s*.04,s*.14,s*.07,0,0,6.28);ctx.fill();
    ctx.beginPath();ctx.ellipse(s*.05-ls,s*.04,s*.14,s*.07,0,0,6.28);ctx.fill();
    // spine
    ctx.strokeStyle=bone;ctx.lineWidth=s*.12;
    ctx.beginPath();ctx.moveTo(-s*.05,-s*.75);ctx.lineTo(-s*.05,-s*1.85);ctx.stroke();
    // ribcage
    ctx.strokeStyle=bone;ctx.lineWidth=s*.09;
    for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-s*.28,-s*(1.1+i*.22));ctx.lineTo(s*.2,-s*(1.1+i*.22));ctx.stroke();}
    ctx.beginPath();ctx.ellipse(-s*.04,-s*1.45,s*.32,s*.42,0,0,6.28);ctx.stroke();
    // gun arm
    const recoil=this.fireT>0?-s*.15:0;
    ctx.strokeStyle=bone;ctx.lineWidth=s*.15;
    ctx.beginPath();ctx.moveTo(d*s*.22,-s*1.75);ctx.lineTo(d*s*.52+recoil,-s*1.75);ctx.stroke();
    // gun barrel
    ctx.fillStyle='#475569';
    ctx.fillRect(d*s*.4+recoil,-s*1.82,d*s*.7,s*.14);
    // muzzle flash
    if(this.fireT>.1){ctx.fillStyle='#fef08a';ctx.beginPath();ctx.arc(d*s*1.1+recoil,-s*1.75,s*.18,0,6.28);ctx.fill();}
    // skull
    ctx.fillStyle=bone;ctx.beginPath();ctx.arc(-s*.04,-s*2.2,s*.34,0,6.28);ctx.fill();
    ctx.fillStyle=dark;ctx.beginPath();ctx.arc(-s*.18,-s*2.22,s*.1,0,6.28);ctx.fill();
    ctx.beginPath();ctx.arc(s*.1,-s*2.22,s*.1,0,6.28);ctx.fill();
    // glowing eyes
    ctx.fillStyle='#4ade80';ctx.beginPath();ctx.arc(-s*.18,-s*2.22,s*.055,0,6.28);ctx.fill();
    ctx.beginPath();ctx.arc(s*.1,-s*2.22,s*.055,0,6.28);ctx.fill();
    // jaw
    ctx.strokeStyle=bone;ctx.lineWidth=s*.07;
    ctx.beginPath();ctx.moveTo(-s*.3,-s*2.0);ctx.lineTo(-s*.12,-s*1.88);ctx.lineTo(s*.06,-s*1.88);ctx.lineTo(s*.22,-s*2.0);ctx.stroke();
    // helmet
    ctx.fillStyle='#1e3a8a';ctx.beginPath();ctx.arc(-s*.04,-s*2.2,s*.34,Math.PI*.95,Math.PI*.05,false);ctx.lineTo(-s*.04,-s*2.2);ctx.fill();
  }
  _bomb(ctx,s,W,H){
    const d=this.dir,t=this.animT,c=this.floor.team==='player'?'#3b82f6':'#ef4444',dk=this.floor.team==='player'?'#1e3a8a':'#7f1d1d';
    // legs
    ctx.fillStyle=dk;
    const ls=Math.sin(t*4)*s*.1;
    ctx.fillRect(-s*.3+ls,-s*.9,s*.42,s*.9);
    ctx.fillRect(-s*.3-ls,-s*.9,s*.42,s*.9);
    // body
    ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(-s*.04,-s*1.8,s*.6,s*.85,0,0,6.28);ctx.fill();
    // belly
    ctx.strokeStyle=dk;ctx.lineWidth=s*.06;ctx.beginPath();ctx.arc(-s*.04,-s*1.65,s*.28,.5,Math.PI-.5);ctx.stroke();
    // throwing arm
    const throwT=this.fireT>0?-1.2:Math.sin(t*3)*.25;
    ctx.save();ctx.translate(d*s*.55,-s*2.1);ctx.rotate(throwT);
    ctx.strokeStyle='#94a3b8';ctx.lineWidth=s*.22;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-s*.65);ctx.stroke();
    // bomb in hand
    ctx.fillStyle='#1c1917';ctx.beginPath();ctx.arc(0,-s*.7,s*.2,0,6.28);ctx.fill();
    ctx.strokeStyle='#fbbf24';ctx.lineWidth=s*.06;
    ctx.beginPath();ctx.moveTo(0,-s*.9);ctx.lineTo(s*.06,-s*1.1);ctx.stroke();
    ctx.restore();
    // head (cyclops)
    ctx.fillStyle=c;ctx.beginPath();ctx.arc(-s*.04,-s*2.9,s*.48,0,6.28);ctx.fill();
    // horns
    ctx.fillStyle=dk;
    ctx.beginPath();ctx.moveTo(-s*.28,-s*3.25);ctx.lineTo(-s*.52,-s*3.65);ctx.lineTo(-s*.14,-s*3.25);ctx.fill();
    ctx.beginPath();ctx.moveTo(s*.2,-s*3.25);ctx.lineTo(s*.44,-s*3.65);ctx.lineTo(s*.06,-s*3.25);ctx.fill();
    // THE eye
    ctx.fillStyle='#fef08a';ctx.beginPath();ctx.arc(d*s*.06,-s*2.93,s*.22,0,6.28);ctx.fill();
    ctx.fillStyle='#1c1917';ctx.beginPath();ctx.arc(d*s*.09,-s*2.93,s*.11,0,6.28);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(d*s*.06,-s*2.97,s*.05,0,6.28);ctx.fill();
    // brow
    ctx.strokeStyle=dk;ctx.lineWidth=s*.1;
    ctx.beginPath();ctx.moveTo(-s*.28,-s*3.12);ctx.lineTo(s*.22,-s*3.12);ctx.stroke();
  }
  _arch(ctx,s,W,H){
    const d=this.dir,t=this.animT,c='#16a34a',dk='#14532d',sk='#4ade80';
    const pull=this.fireT>0?Math.abs(Math.sin(t*10)):.15;
    // legs
    const ls=Math.sin(t*6)*s*.2;
    ctx.fillStyle=dk;
    ctx.fillRect(-s*.14+ls,-s*.7,s*.26,s*.7);
    ctx.fillRect(-s*.14-ls,-s*.7,s*.26,s*.7);
    // shoes
    ctx.fillStyle='#292524';
    ctx.beginPath();ctx.ellipse(s*.04+ls,s*.04,s*.17,s*.08,0,0,6.28);ctx.fill();
    ctx.beginPath();ctx.ellipse(s*.04-ls,s*.04,s*.17,s*.08,0,0,6.28);ctx.fill();
    // body
    ctx.fillStyle=c;ctx.fillRect(-s*.28,-s*1.75,s*.56,s*1.05);
    // quiver on back
    ctx.fillStyle=dk;ctx.fillRect(-d*s*.45,-s*1.8,s*.18,s*.55);
    for(let i=0;i<3;i++){ctx.strokeStyle=sk;ctx.lineWidth=s*.06;ctx.beginPath();ctx.moveTo(-d*s*.36,-s*1.8);ctx.lineTo(-d*s*.36,-s*2.1+i*s*.08);ctx.stroke();}
    // bow
    ctx.strokeStyle='#92400e';ctx.lineWidth=s*.1;
    ctx.beginPath();ctx.arc(d*s*.48,-s*1.45,s*.52,-Math.PI*.55,Math.PI*.55,false);ctx.stroke();
    // string
    const sY=-s*1.45,sR=s*.52;
    const sy0=sY-sR*Math.sin(Math.PI*.55),sy1=sY+sR*Math.sin(Math.PI*.55);
    ctx.strokeStyle='#d4d4d4';ctx.lineWidth=s*.04;
    ctx.beginPath();ctx.moveTo(d*s*.48,sy0);ctx.lineTo(d*(s*.48-pull*s*.25),sY);ctx.lineTo(d*s*.48,sy1);ctx.stroke();
    // arrow on string
    if(pull>.12){
      ctx.strokeStyle='#a3a3a3';ctx.lineWidth=s*.06;
      ctx.beginPath();ctx.moveTo(d*(s*.48-pull*s*.25),sY);ctx.lineTo(d*s*.95,sY);ctx.stroke();
      ctx.fillStyle='#facc15';ctx.beginPath();ctx.moveTo(d*s*.95,sY);ctx.lineTo(d*s*.75,sY-s*.1);ctx.lineTo(d*s*.75,sY+s*.1);ctx.fill();
    }
    // arm
    ctx.strokeStyle=sk;ctx.lineWidth=s*.15;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(d*s*.22,-s*1.65);ctx.lineTo(d*(s*.48-pull*s*.12),sY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-d*s*.22,-s*1.65);ctx.lineTo(-d*s*.15,-s*1.3);ctx.stroke();
    // head
    ctx.fillStyle=c;ctx.beginPath();ctx.arc(-s*.04,-s*2.1,s*.3,0,6.28);ctx.fill();
    // ears
    ctx.fillStyle=dk;
    ctx.beginPath();ctx.moveTo(-s*.3,-s*2.1);ctx.lineTo(-s*.48,-s*2.35);ctx.lineTo(-s*.2,-s*2.05);ctx.fill();
    ctx.beginPath();ctx.moveTo(s*.22,-s*2.1);ctx.lineTo(s*.4,-s*2.35);ctx.lineTo(s*.12,-s*2.05);ctx.fill();
    // eyes
    ctx.fillStyle='#fef08a';ctx.beginPath();ctx.arc(-s*.13,-s*2.14,s*.08,0,6.28);ctx.fill();
    ctx.beginPath();ctx.arc(s*.06,-s*2.14,s*.08,0,6.28);ctx.fill();
    // hat
    ctx.fillStyle=dk;ctx.beginPath();ctx.moveTo(-s*.34,-s*2.26);ctx.lineTo(s*.26,-s*2.26);ctx.lineTo(s*.14,-s*2.6);ctx.lineTo(-s*.22,-s*2.6);ctx.fill();
    ctx.fillRect(-s*.38,-s*2.27,s*.76,s*.1);
  }
}

/* ═══════════════════ CASTLE ═══════════════════ */
class Castle{
  constructor(team,W,H){
    this.team=team;
    this.hp=team==='player'?CONFIG.game.playerHP:CONFIG.game.enemyHP;
    this.maxHp=this.hp;
    this.floors=[];
    this.shakeT=0;this.flashT=0;this.pulseR=0;
    this._buildFloors(W,H);
  }
  _buildFloors(W,H){
    this.floors=[];
    const xf=this.team==='player'?CONFIG.game.playerXFrac:CONFIG.game.enemyXFrac;
    const cx=xf*W;
    const gY=H*CONFIG.game.groundFrac;
    const castleH=H*CONFIG.game.castleHFrac;
    const treadH=H*CONFIG.game.treadHFrac;
    const n=CONFIG.game.numFloors;
    const fH=castleH/n;
    for(let i=0;i<n;i++){
      this.floors.push({
        idx:i,team:this.team,
        x:cx,
        y:gY-treadH-fH*i-fH*.32,
        top:gY-treadH-fH*(i+1),
        h:fH,
        cx,gY,treadH,fH,
        unit:null,
      });
    }
  }
  get cx(){return this.floors[0].cx;}
  get gY(){return this.floors[0].gY;}
  onHit(dmg,parts,audio,W,H){
    this.hp=Math.max(0,this.hp-dmg);
    this.shakeT=.3;this.flashT=.16;this.pulseR=1;
    if(this.hp>0)audio.boom();else audio.bigBoom();
    const cx=this.cx,cy=this.gY-H*CONFIG.game.castleHFrac*.5;
    const pCols=this.team==='player'?['#bfdbfe','#93c5fd','#dbeafe']:['#fecaca','#fca5a5','#fee2e2'];
    for(let i=0;i<14;i++){
      const a=Math.random()*6.28,s=90+Math.random()*150;
      parts.push(new Particle(cx,cy,Math.cos(a)*s,Math.sin(a)*s-110,pCols[i%3],5+Math.random()*7,.6+Math.random()*.7));
    }
    // smoke
    for(let i=0;i<4;i++){
      const sx=cx+(Math.random()-.5)*W*.06,sy=cy+Math.random()*H*.04;
      parts.push(new Smoke(sx,sy,(Math.random()-.5)*18,-22-Math.random()*18,'rgba(80,80,80,0.35)',8+Math.random()*6,.8+Math.random()*.5));
    }
    // rubble
    for(let i=0;i<8;i++){
      const a=Math.random()*6.28,s=40+Math.random()*80;
      parts.push(new Particle(cx+(Math.random()-.5)*W*.05,cy+H*.04,Math.cos(a)*s,Math.sin(a)*s-50,'#78716c',3+Math.random()*4,.4+Math.random()*.4));
    }
    if(this.hp<=0){
      for(let i=0;i<50;i++){
        const a=Math.random()*6.28,s=120+Math.random()*230;
        parts.push(new Particle(cx,cy,Math.cos(a)*s,Math.sin(a)*s-180,['#fbbf24','#f59e0b','#ef4444','#f97316','#fef3c7','#78716c'][i%6],8+Math.random()*12,1.1+Math.random()*1.0));
      }
    }
  }
  draw(ctx,W,H,imgBlue,imgRed){
    const shX=this.shakeT>0?(Math.random()-.5)*9:0;
    const shY=this.shakeT>0?(Math.random()-.5)*5:0;
    this.shakeT=Math.max(0,this.shakeT-.016);
    this.flashT=Math.max(0,this.flashT-.016);
    this.pulseR=Math.max(0,this.pulseR-.05);
    const cx=this.cx+shX,gY=this.gY+shY;
    const cW=W*CONFIG.game.castleWFrac;
    const cH=H*CONFIG.game.castleHFrac;
    const tH=H*CONFIG.game.treadHFrac;
    const hpPct=this.hp/this.maxHp;
    ctx.save();
    if(this.flashT>0)ctx.filter='brightness(2.6)';
    // Draw castle image or procedural
    const img=this.team==='player'?imgBlue:imgRed;
    if(img&&img.complete&&img.naturalWidth>0){
      ctx.drawImage(img,cx-cW*.52,gY-cH-tH,cW*1.04,cH+tH);
    }else{
      this._proc(ctx,cx,gY,cW,cH,tH,hpPct,W,H);
    }
    ctx.filter='none';
    // Damage overlay
    if(hpPct<.5){
      const dmgAlpha=(1-hpPct*2)*.55;
      ctx.fillStyle=`rgba(0,0,0,${dmgAlpha})`;
      ctx.fillRect(cx-cW*.52,gY-cH-tH,cW*1.04,cH+tH);
    }
    if(hpPct<.25){
      ctx.fillStyle='rgba(180,0,0,0.12)';
      ctx.fillRect(cx-cW*.52,gY-cH-tH,cW*1.04,cH+tH);
    }
    ctx.restore();
    // Slot indicators (empty floors)
    for(const fl of this.floors){
      if(!fl.unit&&this.team==='player'){
        this._drawSlot(ctx,fl,W,H);
      }
    }
    // Pulse ring
    if(this.pulseR>.05){
      ctx.strokeStyle=`rgba(251,191,36,${this.pulseR*.65})`;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(this.cx,this.gY-cH*.5,cW*.7*(1.4-this.pulseR*.4),0,6.28);ctx.stroke();
    }
    // HP bar
    const bw=cW*.95,bh=Math.max(6,H*.01);
    const bx=this.cx-bw/2,by=this.gY-cH-tH-bh-6;
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=hpPct>.5?'#22c55e':hpPct>.25?'#f59e0b':'#ef4444';
    ctx.fillRect(bx,by,bw*hpPct,bh);
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle='#f1f5f9';ctx.font=`bold ${Math.max(9,bh*.95)}px Arial`;ctx.textAlign='center';
    ctx.fillText(Math.ceil(this.hp),this.cx,by-3);
    // Team label
    ctx.fillStyle=this.team==='player'?'#93c5fd':'#fca5a5';
    ctx.font=`bold ${Math.max(8,H*.012)}px Arial`;ctx.textAlign='center';
    ctx.fillText(this.team==='player'?'YOU':'ENEMY',this.cx,by-H*.02);
  }
  _drawSlot(ctx,fl,W,H){
    const sw=W*CONFIG.game.castleWFrac*.55;
    const sh=fl.h*.58;
    const sx=fl.x-sw/2,sy=fl.y-sh*.7;
    const pulse=.5+.5*Math.sin(Date.now()*.004);
    ctx.save();
    ctx.strokeStyle=`rgba(100,180,255,${.4+pulse*.35})`;
    ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
    ctx.fillStyle=`rgba(60,130,255,${.04+pulse*.06})`;
    ctx.fillRect(sx,sy,sw,sh);ctx.strokeRect(sx,sy,sw,sh);
    ctx.setLineDash([]);
    // + icon
    ctx.strokeStyle=`rgba(147,197,253,${.5+pulse*.4})`;ctx.lineWidth=1.8;
    const mx=fl.x,my=sy+sh*.5,hs=sh*.2;
    ctx.beginPath();ctx.moveTo(mx-hs,my);ctx.lineTo(mx+hs,my);ctx.stroke();
    ctx.beginPath();ctx.moveTo(mx,my-hs);ctx.lineTo(mx,my+hs);ctx.stroke();
    ctx.restore();
  }
  _proc(ctx,cx,gY,cW,cH,tH,hpPct,W,H){
    const isP=this.team==='player';
    const col=isP?CONFIG.colors.playerMain:CONFIG.colors.enemyMain;
    const dk=isP?CONFIG.colors.playerDark:CONFIG.colors.enemyDark;
    const st=isP?CONFIG.colors.playerStone:CONFIG.colors.enemyStone;
    const n=CONFIG.game.numFloors;
    const fH=cH/n;
    // body floors
    for(let i=0;i<n;i++){
      const fy=gY-tH-fH*i;
      ctx.fillStyle=i%2?st:col+'cc';
      ctx.fillRect(cx-cW*.45,fy-fH,cW*.9,fH);
      ctx.strokeStyle=dk;ctx.lineWidth=1;
      ctx.strokeRect(cx-cW*.45,fy-fH,cW*.9,fH);
      // platform ledge
      ctx.fillStyle=dk;ctx.fillRect(cx-cW*.5,fy-2,cW,5);
      // window (not bottom floor)
      if(i>0){
        ctx.fillStyle='#fef08a88';
        ctx.beginPath();ctx.arc(cx,fy-fH*.5,cW*.07,0,6.28);ctx.fill();
        ctx.strokeStyle=dk;ctx.strokeRect(cx-cW*.08,fy-fH*.65,cW*.16,cW*.16);
      }
      // gate (bottom floor)
      if(i===0){
        ctx.fillStyle=dk;ctx.beginPath();
        ctx.moveTo(cx-cW*.2,gY-tH);ctx.lineTo(cx-cW*.2,gY-tH-fH*.7);
        ctx.arc(cx,gY-tH-fH*.7,cW*.2,Math.PI,0);ctx.lineTo(cx+cW*.2,gY-tH);ctx.fill();
      }
    }
    // battlements
    const top=gY-tH-cH;
    const mw=cW*.9/8;
    ctx.fillStyle=st;
    for(let i=0;i<4;i++){ctx.fillRect(cx-cW*.45+i*mw*2,top-fH*.18,mw,fH*.18);}
    // flag
    ctx.strokeStyle=dk;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx,top);ctx.lineTo(cx,top-fH*.55);ctx.stroke();
    ctx.fillStyle=col;ctx.beginPath();
    const fd=isP?1:-1;
    ctx.moveTo(cx,top-fH*.55);ctx.lineTo(cx+fd*cW*.28,top-fH*.42);ctx.lineTo(cx,top-fH*.28);ctx.fill();
    // treads
    ctx.fillStyle='#1c1917';ctx.beginPath();ctx.ellipse(cx,gY+tH*.25,cW*.45,tH*.38,0,0,6.28);ctx.fill();
    ctx.fillStyle='#44403c';
    const nw=6;
    for(let i=0;i<nw;i++){
      const wx=cx-cW*.36+i*(cW*.72/(nw-1));
      ctx.beginPath();ctx.arc(wx,gY+tH*.22,tH*.28,0,6.28);ctx.fill();
    }
    ctx.fillStyle='#292524';ctx.fillRect(cx-cW*.45,gY+tH*.0,cW*.9,tH*.22);
  }
}

/* ═══════════════════ RAIN ═══════════════════ */
class Rain{
  constructor(){this.drops=[];}
  init(W,H){
    this.drops=[];
    for(let i=0;i<90;i++){
      this.drops.push({x:Math.random()*W,y:Math.random()*H,spd:320+Math.random()*160,len:8+Math.random()*14,op:.08+Math.random()*.14});
    }
  }
  update(dt,W,H){
    for(const d of this.drops){
      d.x+=dt*60;d.y+=d.spd*dt;
      if(d.y>H){d.y=-d.len;d.x=Math.random()*W;}
    }
  }
  draw(ctx,W,H){
    ctx.strokeStyle='rgba(170,210,255,0.18)';ctx.lineWidth=.8;
    for(const d of this.drops){
      ctx.globalAlpha=d.op;
      ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+d.len*.18,d.y+d.len);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
}

  _resize(){
    const W=this.cv.width=window.innerWidth;
    const H=this.cv.height=window.innerHeight;
    this.W=W;this.H=H;
    this.rain.init(W,H);
    if(this.state!=='INTRO')this._layoutGame();
  }
  _layoutGame(){
    const W=this.W,H=this.H;
    this.playerCastle._buildFloors(W,H);
    this.enemyCastle._buildFloors(W,H);
    // Re-attach units to rebuilt floors
    for(const fl of [...this.playerCastle.floors,...this.enemyCastle.floors]){
      if(fl.unit)fl.unit.floor=fl;
    }
    this._buildCardLayout();
  }
  _buildCardLayout(){
    const W=this.W,H=this.H;
    const n=CONFIG.units.length;
    const gap=W*.028,cardW=W*.22,cardH=H*.19;
    const totalW=n*cardW+(n-1)*gap;
    const sx=(W-totalW)/2;
    const cy=H*(CONFIG.game.panelFrac+.5*(1-CONFIG.game.panelFrac));
    this.cards=CONFIG.units.map((u,i)=>({
      u,idx:i,
      x:sx+i*(cardW+gap),y:cy-cardH/2,
      w:cardW,h:cardH,
    }));
  }
  _initGame(){
    const W=this.W,H=this.H;
    this.playerCastle=new Castle('player',W,H);
    this.enemyCastle=new Castle('enemy',W,H);
    this.units=[];this.projs=[];this.parts=[];this.floats=[];
    this.drag=null;
    this.enemyTimer=CONFIG.enemy.firstDelay;
    this.shakeX=0;this.shakeY=0;this.shakeAmp=0;
    this.tutT=4.0;
    this._buildCardLayout();
  }
  _bindUI(){
    document.getElementById('btn-play').onclick=()=>this._startGame();
    document.getElementById('btn-play').ontouchstart=e=>{e.preventDefault();this._startGame();};
    document.getElementById('btn-dl').onclick=()=>window.open('https://voodoo.io','_blank');
    document.getElementById('btn-re').onclick=()=>this._restart();
    document.getElementById('btn-re').ontouchstart=e=>{e.preventDefault();this._restart();};
  }
  _startGame(){
    this.audio.init();this.audio.resume();
    document.getElementById('s-intro').classList.add('hidden');
    this.state='PLAYING';
    this._initGame();
  }
  _restart(){
    document.getElementById('s-result').classList.add('hidden');
    this.state='PLAYING';
    this._initGame();
  }
  // ── Input ──
  _bindInput(){
    const cv=this.cv;
    cv.addEventListener('pointerdown',e=>this._onDown(e),{passive:false});
    cv.addEventListener('pointermove',e=>this._onMove(e),{passive:false});
    cv.addEventListener('pointerup',e=>this._onUp(e),{passive:false});
    cv.addEventListener('pointercancel',e=>{this.drag=null;},{passive:false});
  }
  _onDown(e){
    if(this.state!=='PLAYING')return;
    e.preventDefault();
    const px=e.clientX,py=e.clientY;
    for(const card of this.cards){
      if(px>=card.x&&px<=card.x+card.w&&py>=card.y&&py<=card.y+card.h){
        this.cv.setPointerCapture(e.pointerId);
        this.drag={unit:card.u,idx:card.idx,x:px,y:py,ptId:e.pointerId};
        this.audio.resume();
        return;
      }
    }
  }
  _onMove(e){
    if(!this.drag||e.pointerId!==this.drag.ptId)return;
    e.preventDefault();
    this.drag.x=e.clientX;this.drag.y=e.clientY;
  }
  _onUp(e){
    if(!this.drag||e.pointerId!==this.drag.ptId)return;
    e.preventDefault();
    const px=e.clientX,py=e.clientY;
    // Find matching empty floor slot on player castle
    let placed=false;
    for(const fl of this.playerCastle.floors){
      const W=this.W,cW=W*CONFIG.game.castleWFrac;
      const sx=fl.x-cW*.45,sw=cW*.9;
      const sy=fl.top,sh=fl.h;
      if(px>=sx&&px<=sx+sw&&py>=sy&&py<=sy+sh+fl.h*.3){
        if(!fl.unit){
          const dir=1;
          fl.unit=new Unit(fl.u||this.drag.unit,fl,dir);
          fl.unit.floor=fl;
          this.units.push(fl.unit);
          this.audio.place();
          this.tutT=0;
          placed=true;
          // Spawn a poof
          for(let i=0;i<10;i++){
            const a=Math.random()*6.28,s=30+Math.random()*50;
            this.parts.push(new Particle(fl.x,fl.y,Math.cos(a)*s,Math.sin(a)*s-40,'#93c5fd',4+Math.random()*4,.35+Math.random()*.25));
          }
        }else{
          this.audio.noSlot();
        }
        break;
      }
    }
    if(!placed&&py<this.H*CONFIG.game.panelFrac){
      // Dropped on enemy side or midfield — ignore
    }
    this.drag=null;
  }
  // ── Enemy AI ──
  _spawnEnemyUnit(){
    const emptyFloors=this.enemyCastle.floors.filter(f=>!f.unit);
    if(emptyFloors.length===0)return;
    const fl=emptyFloors[Math.floor(Math.random()*emptyFloors.length)];
    const probs=CONFIG.enemy.probs;
    let r=Math.random(),ci=0,cumul=0;
    for(let i=0;i<probs.length;i++){cumul+=probs[i];if(r<=cumul){ci=i;break;}ci=i;}
    fl.unit=new Unit(CONFIG.units[ci],fl,-1);
    fl.unit.floor=fl;
    this.units.push(fl.unit);
    // Poof
    for(let i=0;i<8;i++){
      const a=Math.random()*6.28,s=30+Math.random()*45;
      this.parts.push(new Particle(fl.x,fl.y,Math.cos(a)*s,Math.sin(a)*s-35,'#fca5a5',3+Math.random()*3,.3+Math.random()*.2));
    }
  }
  // ── Update ──
  _update(dt){
    const W=this.W,H=this.H;
    if(this.state!=='PLAYING')return;
    // Rain
    if(CONFIG.game.rainOn)this.rain.update(dt,W,H);
    // Enemy AI
    this.enemyTimer-=dt;
    if(this.enemyTimer<=0){this._spawnEnemyUnit();this.enemyTimer=CONFIG.enemy.spawnInterval;}
    // Units update
    for(const u of this.units){
      const target=u.floor.team==='player'?this.enemyCastle:this.playerCastle;
      u.update(dt,this.projs,target,this.parts,this.audio,W,H);
    }
    // Projectiles
    for(const p of this.projs){
      if(!p.alive)continue;
      p.update(dt);
      if(!p.alive){
        // Hit target castle
        const castle=p.team==='player'?this.enemyCastle:this.playerCastle;
        castle.onHit(p.cfg.dmg,this.parts,this.audio,W,H);
        this.shakeAmp=Math.min(1,this.shakeAmp+.5);
        this.floats.push(new FloatText(p.x1,p.y1-H*.03,`-${p.cfg.dmg}`,p.team==='player'?'#fbbf24':'#f87171',Math.max(11,W*.028)));
      }
    }
    // Particles & floats
    for(const p of this.parts)p.update(dt);
    for(const f of this.floats)f.update(dt);
    this.projs=this.projs.filter(p=>p.alive);
    this.parts=this.parts.filter(p=>p.alive);
    this.floats=this.floats.filter(f=>f.alive);
    // Screen shake decay
    this.shakeAmp=Math.max(0,this.shakeAmp-.7*dt);
    this.shakeX=(Math.random()-.5)*this.shakeAmp*W*.014;
    this.shakeY=(Math.random()-.5)*this.shakeAmp*H*.008;
    // Tutorial hint timer
    if(this.tutT>0)this.tutT-=dt;
    // Win/Lose check
    if(this.enemyCastle.hp<=0&&this.state==='PLAYING'){
      this.state='WIN';this.audio.victory();
      setTimeout(()=>{this._showResult(true);},1300);
    }else if(this.playerCastle.hp<=0&&this.state==='PLAYING'){
      this.state='LOSE';this.audio.defeat();
      setTimeout(()=>{this._showResult(false);},1300);
    }
  }
  _showResult(win){
    document.getElementById('r-title').textContent=win?'VICTORY!':'DEFEAT!';
    document.getElementById('r-title').className='r-title '+(win?'win':'lose');
    document.getElementById('r-sub').textContent=win?'Enemy castle destroyed! Download now!':'Your castle fell... get revenge in the full game!';
    document.getElementById('s-result').classList.remove('hidden');
  }
  // ── Render ──
  _render(){
    const ctx=this.cx2,W=this.W,H=this.H;
    ctx.clearRect(0,0,W,H);
    ctx.save();ctx.translate(this.shakeX||0,this.shakeY||0);
    this._drawBg(ctx,W,H);
    if(CONFIG.game.rainOn)this.rain.draw(ctx,W,H);
    this._drawGround(ctx,W,H);
    // Skip game-element rendering before _initGame ran (intro screen)
    if(!this.playerCastle){ctx.restore();return;}
    // Castles
    this.playerCastle.draw(ctx,W,H,this.imgBlue,this.imgRed);
    this.enemyCastle.draw(ctx,W,H,this.imgBlue,this.imgRed);
    // Units on floors
    for(const fl of [...this.playerCastle.floors,...this.enemyCastle.floors]){
      if(fl.unit)fl.unit.draw(ctx,W,H);
    }
    // Projectiles
    for(const p of this.projs)p.draw(ctx,W);
    // Particles
    for(const p of this.parts)p.draw(ctx);
    // Float texts
    for(const f of this.floats)f.draw(ctx);
    // Card panel
    this._drawPanel(ctx,W,H);
    // Drag ghost
    if(this.drag)this._drawDragGhost(ctx,W,H);
    // Tutorial overlay
    if(this.tutT>0&&this.state==='PLAYING')this._drawTutorial(ctx,W,H);
    ctx.restore();
  }
  _drawBg(ctx,W,H){
    const gY=H*CONFIG.game.groundFrac;
    // Sky
    const sky=ctx.createLinearGradient(0,0,0,gY);
    sky.addColorStop(0,CONFIG.colors.sky0);sky.addColorStop(.3,CONFIG.colors.sky1);
    sky.addColorStop(.65,CONFIG.colors.sky2);sky.addColorStop(1,CONFIG.colors.sky3);
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,gY);
    // Moon glow
    const mg=ctx.createRadialGradient(W*.8,H*.08,0,W*.8,H*.08,W*.14);
    mg.addColorStop(0,'rgba(230,240,255,.9)');mg.addColorStop(.3,'rgba(180,210,255,.2)');mg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=mg;ctx.fillRect(0,0,W,gY);
    ctx.fillStyle='rgba(230,240,255,.88)';ctx.beginPath();ctx.arc(W*.8,H*.085,W*.044,0,6.28);ctx.fill();
    // Stars
    ctx.fillStyle='rgba(255,255,255,.75)';
    const ss=[[.07,.04],[.19,.07],[.33,.03],[.44,.1],[.52,.05],[.61,.14],[.67,.07],[.71,.02],[.84,.09],[.91,.05],[.12,.15],[.28,.18],[.75,.19]];
    for(const[fx,fy]of ss){ctx.beginPath();ctx.arc(fx*W,fy*gY,W*.0028,0,6.28);ctx.fill();}
    // Mountain layers
    ctx.fillStyle='#0a1c2e';
    ctx.beginPath();ctx.moveTo(0,gY);
    [[0,.65],[.07,.42],[.14,.58],[.22,.36],[.3,.54],[.4,.3],[.5,.48],[.6,.28],[.7,.46],[.8,.26],[.92,.42],[1,.32],[1,1]].forEach(([fx,fy])=>ctx.lineTo(fx*W,fy*gY));
    ctx.fill();
    ctx.fillStyle='#0f2438';
    ctx.beginPath();ctx.moveTo(0,gY);
    [[0,.75],[.06,.6],[.16,.7],[.26,.55],[.37,.68],[.47,.52],[.57,.66],[.67,.5],[.78,.62],[.88,.48],[.96,.6],[1,.55],[1,1]].forEach(([fx,fy])=>ctx.lineTo(fx*W,fy*gY));
    ctx.fill();
    // Trees
    ctx.fillStyle='#0d2010';
    for(let x=W*.05;x<W;x+=W*.075){
      const tx=x+(Math.sin(x*.02)-.5)*W*.03,th=H*(0.035+Math.abs(Math.sin(x*.04))*.025);
      ctx.beginPath();ctx.moveTo(tx-W*.018,gY);ctx.lineTo(tx,gY-th*2.2);ctx.lineTo(tx+W*.018,gY);ctx.fill();
    }
  }
  _drawGround(ctx,W,H){
    const gY=H*CONFIG.game.groundFrac;
    const grd=ctx.createLinearGradient(0,gY,0,H);
    grd.addColorStop(0,CONFIG.colors.ground);grd.addColorStop(.15,'#1e3e14');grd.addColorStop(1,'#0d1e08');
    ctx.fillStyle=grd;ctx.fillRect(0,gY,W,H-gY);
    ctx.fillStyle=CONFIG.colors.groundLine;ctx.fillRect(0,gY,W,Math.max(3,H*.004));
    // grass
    ctx.strokeStyle='#1a3610';ctx.lineWidth=Math.max(1.5,W*.003);ctx.lineCap='round';
    for(let x=W*.08;x<W*.92;x+=W*.06){
      const gx=x+Math.sin(x*.05)*W*.02;
      ctx.beginPath();ctx.moveTo(gx-W*.006,gY+2);ctx.lineTo(gx,gY-H*.01);ctx.lineTo(gx+W*.006,gY+2);ctx.stroke();
    }
    // dirt path
    ctx.fillStyle='#6b5234';
    ctx.beginPath();ctx.moveTo(W*.12,gY+4);
    ctx.bezierCurveTo(W*.35,gY+H*.035,W*.65,gY+H*.035,W*.88,gY+4);
    ctx.bezierCurveTo(W*.65,gY+H*.065,W*.35,gY+H*.065,W*.12,gY+4);ctx.fill();
  }
  _drawPanel(ctx,W,H){
    const py=H*CONFIG.game.panelFrac;
    // Panel bg
    ctx.fillStyle=CONFIG.colors.panelBg;
    ctx.fillRect(0,py,W,H-py);
    ctx.strokeStyle=CONFIG.colors.panelBorder;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(W,py);ctx.stroke();
    // Label
    ctx.fillStyle='rgba(147,197,253,0.45)';ctx.font=`${Math.max(9,H*.012)}px Arial`;ctx.textAlign='center';
    ctx.fillText('DRAG UNITS ONTO YOUR CASTLE',W*.5,py+H*.022);
    // Cards
    if(!this.cards)return;
    for(const card of this.cards){
      this._drawCard(ctx,card,W,H);
    }
  }
  _drawCard(ctx,card,W,H){
    const{x,y,w,h,u}=card;
    const r=Math.max(6,w*.08);
    const canAfford=true;
    // bg
    ctx.fillStyle='rgba(15,28,52,0.92)';
    this._rrect(ctx,x,y,w,h,r);ctx.fill();
    ctx.strokeStyle='rgba(59,130,246,0.55)';ctx.lineWidth=1.5;
    this._rrect(ctx,x,y,w,h,r);ctx.stroke();
    // unit preview (mini)
    const previewH=h*.52;
    ctx.save();ctx.rect(x+2,y+2,w-4,h-4);ctx.clip();
    const dummy=new Unit(u,{x:x+w*.5,y:y+previewH,team:'player',h:previewH},-1);
    dummy.animT=1.2;dummy.fireT=0;
    dummy.floor={x:x+w*.5,y:y+previewH,team:'player'};
    dummy.dir=1;
    dummy.draw(ctx,W,H);
    ctx.restore();
    // name
    ctx.fillStyle='#e2e8f0';ctx.font=`bold ${Math.max(9,h*.11)}px Arial`;ctx.textAlign='center';
    ctx.fillText(u.name,x+w*.5,y+h*.88);
    // drag hint icon (first card if tutorial)
    if(this.tutT>0&&card.idx===0){
      const a=.4+.6*Math.abs(Math.sin(Date.now()*.003));
      ctx.strokeStyle=`rgba(251,191,36,${a})`;ctx.lineWidth=2;
      this._rrect(ctx,x-1,y-1,w+2,h+2,r+1);ctx.stroke();
    }
  }
  _rrect(ctx,x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
    ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
  }
  _drawDragGhost(ctx,W,H){
    const{unit:u,x,y}=this.drag;
    const s=H*.052;
    ctx.save();ctx.globalAlpha=.8;ctx.translate(x,y);
    // shadow
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,s*.2,s*.5,s*.12,0,0,6.28);ctx.fill();
    const dummy=new Unit(u,{x:0,y:0,team:'player'},1);
    dummy.animT=Date.now()*.001;dummy.fireT=0;
    dummy.floor={x:0,y:0,team:'player'};dummy.dir=1;
    // Draw at origin
    ctx.translate(0,0);
    if(u.id==='gunner')dummy._gun(ctx,s,W,H);
    else if(u.id==='bomber')dummy._bomb(ctx,s,W,H);
    else dummy._arch(ctx,s,W,H);
    ctx.restore();
    // Name label
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.beginPath();ctx.roundRect(x-28,y-s*3.6,56,18,8);ctx.fill();
    ctx.fillStyle='#fbbf24';ctx.font=`bold ${Math.max(10,W*.025)}px Arial`;ctx.textAlign='center';
    ctx.fillText(u.name,x,y-s*3.0);
  }
  _drawTutorial(ctx,W,H){
    if(!this.cards||this.cards.length===0)return;
    const a=.5+.5*Math.abs(Math.sin(Date.now()*.0025));
    const card=this.cards[0];
    const cx=card.x+card.w*.5;
    const cy=card.y;
    // find first empty floor
    const fl=this.playerCastle.floors.find(f=>!f.unit);
    if(!fl)return;
    // dotted arrow from card to floor
    ctx.save();ctx.strokeStyle=`rgba(251,191,36,${a*.7})`;ctx.lineWidth=2;ctx.setLineDash([6,5]);
    ctx.beginPath();ctx.moveTo(cx,cy-10);ctx.lineTo(fl.x,fl.y-H*.06);ctx.stroke();
    ctx.setLineDash([]);
    // arrowhead
    ctx.fillStyle=`rgba(251,191,36,${a})`;
    ctx.beginPath();ctx.moveTo(fl.x,fl.y-H*.04);ctx.lineTo(fl.x-8,fl.y-H*.08);ctx.lineTo(fl.x+8,fl.y-H*.08);ctx.fill();
    // label
    const ly=H*(CONFIG.game.panelFrac)-.025*H;
    ctx.fillStyle=`rgba(0,0,0,${a*.7})`;ctx.beginPath();ctx.roundRect(W*.5-70,ly-16,140,24,8);ctx.fill();
    ctx.fillStyle=`rgba(251,191,36,${a})`;ctx.font=`bold ${Math.max(11,W*.028)}px Arial`;ctx.textAlign='center';
    ctx.fillText('👆 DRAG UNITS HERE!',W*.5,ly);
    ctx.restore();
  }
  // ── Loop ──
  _loop(t){
    const dt=Math.min((t-this.lastT)/1000,.05);this.lastT=t;
    if(this.state==='PLAYING')this._update(dt);
    this._render();
    requestAnimationFrame(t=>this._loop(t));
  }
}

window.addEventListener('DOMContentLoaded',()=>new Engine());
</script>

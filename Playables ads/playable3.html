// ─── CONFIG ──────────────────────────────────────────────────────────────────
const CONFIG = {
  castleHp: 100,
  castleMoveSpeed: 18,       // px/s vers le centre
  enemyFireRate: 3200,       // ms
  enemyDamage: 9,
  unitDamage: { cyclops:30, skeleton:18, orc:45 },
  unitCooldown: { cyclops:1400, skeleton:900, orc:1800 },
  projectileSpeed: 520,      // px/s
  ctaDelay: 18000,
  ctaText: "Play Now!",
};

// ─── CANVAS ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W, H;

function resize() {
  const aspect = 9/16;
  let w = window.innerWidth, h = window.innerHeight;
  if (w/h > aspect) w = h*aspect; else h = w/aspect;
  canvas.width  = Math.round(w);
  canvas.height = Math.round(h);
  W = canvas.width; H = canvas.height;
}
resize();
window.addEventListener("resize", () => { resize(); W=canvas.width; H=canvas.height; });

// ─── ASSET LOADER ────────────────────────────────────────────────────────────
const IMG = {}, AUD = {};
const IMG_KEYS   = ["BG","BLUE_CASTLE","RED_CASTLE","PROJ1","PROJ2","WEAPON1","WEAPON2"];
const AUDIO_KEYS = ["MUSIC","SFX"];

function loadAssets(cb) {
  let n = IMG_KEYS.length + AUDIO_KEYS.length, done = 0;
  const tick = () => { if (++done >= n) cb(); };
  IMG_KEYS.forEach(k => {
    const i = new Image(); i.onload=tick; i.onerror=tick; i.src=ASSETS_B64[k]; IMG[k]=i;
  });
  AUDIO_KEYS.forEach(k => {
    const a = new Audio(); a.oncanplaythrough=tick; a.onerror=tick; a.src=ASSETS_B64[k];
    if(k==="MUSIC"){a.loop=true;a.volume=0.35;} else {a.volume=0.6;}
    AUD[k]=a;
  });
  setTimeout(cb, 4000); // fallback
}

// ─── GAME STATE ──────────────────────────────────────────────────────────────
const S = {LOADING:0,TITLE:1,PLAYING:2,WIN:3,LOSE:4};
let state = S.LOADING;
let elapsed = 0;
let shakeAmt = 0;
let flashAlpha = 0, flashColor = "255,80,0";

// Châteaux — se déplacent l'un vers l'autre
let blue, red;
let projectiles = [];   // {x,y,vx,vy,owner,dmg,img,trail:[]}
let particles  = [];   // {x,y,vx,vy,r,color,life,maxLife}
let dmgNumbers = [];   // {x,y,val,color,life}
let lastEnemyFire = 0;
let lastFired = {};     // unit.id → timestamp
let selectedUnit = 0;
let tutHand = true;     // affiche main tutorial
let collapseT = -1;     // timer collapse château vaincu (0→1)
let winner = null;      // "blue"|"red"

function initGame() {
  const cw = W * 0.28; // Largeur originale
  let ch = H * 0.48;
  // Utiliser le ratio naturel de l'asset pour éviter toute distorsion (comme demandé)
  if (IMG.BLUE_CASTLE && IMG.BLUE_CASTLE.complete && IMG.BLUE_CASTLE.naturalWidth) {
    ch = cw * (IMG.BLUE_CASTLE.naturalHeight / IMG.BLUE_CASTLE.naturalWidth);
  }
  const groundY = H * 0.73;
  blue = {
    x: W * 0.04, y: groundY - ch,
    w: cw, h: ch,
    hp: 100, maxHp: 100,
    angle: 0,           // inclinaison progressive
    img: "BLUE_CASTLE",
    dir: 1,             // avance vers la droite
  };
  red = {
    x: W - W*0.04 - cw, y: groundY - ch,
    w: cw, h: ch,
    hp: 100, maxHp: 100,
    angle: 0,
    img: "RED_CASTLE",
    dir: -1,            // avance vers la gauche
  };
  projectiles = []; particles = []; dmgNumbers = [];
  lastEnemyFire = Date.now(); lastFired = {};
  selectedUnit = 0; tutHand = true;
  collapseT = -1; winner = null;
  elapsed = 0;
}

// ─── UNITÉS DOCK ─────────────────────────────────────────────────────────────
const UNITS = [
  { id:"cyclops",  label:"Cyclops",  color:"#e74c3c", dmg:CONFIG.unitDamage.cyclops,
    cd:CONFIG.unitCooldown.cyclops,  projImg:"PROJ2" },
  { id:"skeleton", label:"Skeleton", color:"#bdc3c7", dmg:CONFIG.unitDamage.skeleton,
    cd:CONFIG.unitCooldown.skeleton, projImg:"PROJ1" },
  { id:"orc",      label:"Orc",      color:"#2ecc71", dmg:CONFIG.unitDamage.orc,
    cd:CONFIG.unitCooldown.orc,      projImg:"PROJ2" },
];

function dockRect(i) {
  const s = W * 0.26, pad = W * 0.03;
  return { x: pad + i*(s+pad/2), y: H*0.91, w:s, h:H*0.085 };
}

// ─── PHYSIQUE PROJECTILE ─────────────────────────────────────────────────────
function spawnProjectile(fromBlue) {
  const u   = UNITS[selectedUnit];
  const src = fromBlue ? blue : red;
  const tgt = fromBlue ? red  : blue;
  const sx = fromBlue ? src.x + src.w       : src.x;
  const sy = src.y + src.h * 0.22;
  const tx = fromBlue ? tgt.x + tgt.w*0.2  : tgt.x + tgt.w*0.8;
  const ty = tgt.y + tgt.h * 0.3;

  const dx = tx - sx, dy = ty - sy;
  const dist = Math.sqrt(dx*dx+dy*dy);
  const spd  = CONFIG.projectileSpeed;
  // Arc parabolique : on ajoute une composante verticale vers le haut
  const arcLift = dist * 0.45;
  const t = dist / spd;
  const vx = dx / t;
  const vy = (dy - arcLift) / t;  // vy inclut la gravité apparente

  projectiles.push({
    x:sx, y:sy, vx, vy,
    grav: (2 * arcLift) / (t * t),
    owner: fromBlue ? "blue" : "red",
    dmg: fromBlue ? u.dmg : CONFIG.enemyDamage,
    img: fromBlue ? u.projImg : "PROJ1",
    trail: [],
    life: 1,
  });
  try { const s=AUD.SFX.cloneNode(); s.volume=0.45; s.play(); } catch(e){}
}

// ─── PARTICLES ───────────────────────────────────────────────────────────────
function burst(x, y, color, n) {
  for (let i=0;i<n;i++) {
    const a=Math.random()*Math.PI*2, spd=60+Math.random()*160;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-60,
      r:3+Math.random()*6,color,life:1,maxLife:1});
  }
}

// ─── UPDATE ──────────────────────────────────────────────────────────────────
let lastTs = 0;
function update(ts) {
  requestAnimationFrame(update);
  const dt = Math.min((ts-lastTs)/1000, 0.05);
  lastTs = ts;
  if (state !== S.PLAYING) { render(); return; }

  elapsed += dt;
  shakeAmt  = Math.max(0, shakeAmt - dt*4);
  flashAlpha = Math.max(0, flashAlpha - dt*3);

  // --- Châteaux avancent l'un vers l'autre ---
  const minDist = W * 0.06;
  const distBetween = red.x - (blue.x + blue.w);
  if (distBetween > minDist) {
    blue.x += CONFIG.castleMoveSpeed * dt;
    red.x  -= CONFIG.castleMoveSpeed * dt;
  }

  // --- Inclinaison progressive selon dégâts ---
  const blueRatio = 1 - blue.hp/blue.maxHp;
  const redRatio  = 1 - red.hp/red.maxHp;
  blue.angle = -blueRatio * 0.38;   // incline vers la gauche
  red.angle  =  redRatio  * 0.38;   // incline vers la droite

  // --- Tir ennemi automatique ---
  if (Date.now() - lastEnemyFire > CONFIG.enemyFireRate && red.hp > 0) {
    lastEnemyFire = Date.now();
    spawnProjectile(false);
  }

  // --- Projectiles ---
  projectiles = projectiles.filter(p => {
    p.trail.push({x:p.x,y:p.y});
    if (p.trail.length > 10) p.trail.shift();

    p.vy += p.grav * dt;
    p.x  += p.vx  * dt;
    p.y  += p.vy  * dt;

    // Collision avec la cible
    const tgt = p.owner==="blue" ? red : blue;
    if (p.x > tgt.x && p.x < tgt.x+tgt.w && p.y > tgt.y && p.y < tgt.y+tgt.h) {
      tgt.hp = Math.max(0, tgt.hp - p.dmg);
      shakeAmt = 0.28; flashAlpha = 0.35;
      flashColor = p.owner==="blue" ? "255,100,0" : "0,100,255";
      burst(p.x, p.y, p.owner==="blue"?"#f39c12":"#3498db", 18);
      dmgNumbers.push({x:p.x,y:p.y,val:`-${p.dmg}`,
        color:p.owner==="blue"?"#f1c40f":"#e74c3c",life:1});

      if (tgt.hp <= 0 && collapseT < 0) {
        collapseT = 0;
        winner = p.owner==="blue" ? "blue" : "red";
      }
      return false;
    }
    // Hors écran
    return p.x > -60 && p.x < W+60 && p.y < H+60;
  });

  // --- Collapse animation ---
  if (collapseT >= 0) {
    collapseT += dt * 1.2;
    if (collapseT > 1) {
      state = winner==="blue" ? S.WIN : S.LOSE;
    }
  }

  // --- Particles ---
  particles = particles.filter(p => {
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt;
    p.life-=dt*1.4; return p.life>0;
  });

  // --- DmgNumbers ---
  dmgNumbers = dmgNumbers.filter(d => {
    d.y-=60*dt; d.life-=dt*1.6; return d.life>0;
  });

  // Tutorial hand disparaît après 4s
  if (elapsed > 4) tutHand = false;

  // CTA timeout
  if (elapsed*1000 > CONFIG.ctaDelay) state = S.WIN;

  render();
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  ctx.save();
  if (shakeAmt > 0) {
    const m = shakeAmt*9;
    ctx.translate((Math.random()-.5)*m, (Math.random()-.5)*m);
  }

  drawBG();

  if (state === S.PLAYING || state === S.WIN || state === S.LOSE) {
    drawCastle(blue, false);
    drawCastle(red,  true);
    drawProjectiles();
    drawParticles();
    drawDmgNumbers();
    drawHUD();
    drawDock();
    if (tutHand && state===S.PLAYING) drawTutHand();
  }

  if (flashAlpha > 0) {
    ctx.fillStyle=`rgba(${flashColor},${flashAlpha.toFixed(2)})`;
    ctx.fillRect(0,0,W,H);
  }

  if (state===S.TITLE)   drawTitle();
  if (state===S.WIN)     drawEndScreen(true);
  if (state===S.LOSE)    drawEndScreen(false);
  if (state===S.LOADING) drawLoading();

  ctx.restore();
}

// ─── BACKGROUND ──────────────────────────────────────────────────────────────
function drawBG() {
  // Fond principal
  if (IMG.BG.complete && IMG.BG.naturalWidth) {
    const r = IMG.BG.naturalWidth/IMG.BG.naturalHeight;
    const bh=H*0.80, bw=bh*r;
    ctx.drawImage(IMG.BG, (W-bw)/2, 0, bw, bh);
  } else {
    const g=ctx.createLinearGradient(0,0,0,H*0.72);
    g.addColorStop(0,"#78c8a0"); g.addColorStop(1,"#3a8a5a");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.72);
  }
  // Sol
  ctx.fillStyle="#2d4a2d"; ctx.fillRect(0,H*0.73,W,H*0.27);
  // Ligne de sol (herbe)
  ctx.fillStyle="#4caf50";
  ctx.fillRect(0,H*0.73,W,H*0.02);
  // Chenilles gauche (char d'assaut fonctionnelles)
  drawTracks(blue.x, H*0.73, blue.w, 1.0, elapsed * CONFIG.castleMoveSpeed);
  // Chenilles droite
  drawTracks(red.x, H*0.73, red.w, 1.0, -elapsed * CONFIG.castleMoveSpeed);
}

function drawTracks(cx, gy, cw, alpha, offset = 0) {
  ctx.save();
  ctx.globalAlpha = alpha;
  const th = H * 0.045, tw = cw * 1.2; // Chenilles plus larges que le château
  const tx = cx + (cw - tw) / 2;
  
  // Courroie de la chenille
  ctx.fillStyle = "#222";
  ctx.beginPath();
  ctx.roundRect(tx, gy - th*0.2, tw, th, th/2);
  ctx.fill();
  
  // Détails de la chenille (lignes qui bougent)
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for(let i=0; i<tw; i+=8) {
     let x = tx + ((i + offset*1.5) % tw);
     if(x < tx) x += tw;
     ctx.moveTo(x, gy - th*0.2);
     ctx.lineTo(x, gy - th*0.2 + th);
  }
  ctx.stroke();

  // Roues
  const numWheels = 4;
  const spacing = tw / numWheels;
  for(let i=0; i<numWheels; i++) {
    const wx = tx + spacing/2 + i*spacing;
    const wy = gy - th*0.2 + th/2;
    const wr = th*0.35;
    
    ctx.save();
    ctx.translate(wx, wy);
    ctx.rotate(offset * 0.05);
    
    ctx.beginPath();
    ctx.arc(0, 0, wr, 0, Math.PI*2);
    ctx.fillStyle = "#444";
    ctx.fill();
    ctx.stroke();
    
    ctx.beginPath();
    ctx.arc(0, 0, wr*0.4, 0, Math.PI*2);
    ctx.fillStyle = "#666";
    ctx.fill();
    
    ctx.beginPath();
    ctx.moveTo(-wr, 0); ctx.lineTo(wr, 0);
    ctx.moveTo(0, -wr); ctx.lineTo(0, wr);
    ctx.stroke();
    
    ctx.restore();
  }
  ctx.restore();
}

// ─── CHÂTEAU ─────────────────────────────────────────────────────────────────
function drawCastle(c, isRed) {
  ctx.save();
  // Pivot en bas centre du château
  const px = c.x + c.w/2, py = c.y + c.h;
  ctx.translate(px, py);
  ctx.rotate(c.angle);
  ctx.translate(-px, -py);

  // Collapse : rétrécit vers le bas
  if (collapseT >= 0 && winner !== (isRed?"red":"blue")) {
    const scale = Math.max(0, 1 - collapseT*0.9);
    ctx.translate(c.x+c.w/2, c.y+c.h);
    ctx.scale(1, scale);
    ctx.translate(-(c.x+c.w/2), -(c.y+c.h));
    // Particules de débris
    if (Math.random()<0.4) burst(c.x+Math.random()*c.w, c.y+Math.random()*c.h, "#888", 3);
  }

  // Opacité selon HP (assombrit progressivement)
  const hpRatio = c.hp/c.maxHp;
  ctx.globalAlpha = 0.35 + hpRatio*0.65;

  const img = IMG[c.img];
  if (img && img.complete && img.naturalWidth) {
    ctx.drawImage(img, c.x, c.y, c.w, c.h);
  } else {
    ctx.fillStyle = isRed?"#c0392b":"#2980b9";
    ctx.fillRect(c.x, c.y, c.w, c.h);
  }
  ctx.globalAlpha=1;

  // Cracks procéduraux selon dégâts
  const dmgRatio = 1 - hpRatio;
  if (dmgRatio > 0.25) drawCracks(c, dmgRatio);

  // Personnage dans le créneau
  drawCharacterInCastle(c, isRed);

  ctx.restore();

  // % HP sous le château (hors rotation)
  ctx.fillStyle="#fff";
  ctx.font=`bold ${Math.round(14*W/375)}px Arial`;
  ctx.textAlign="center";
  ctx.strokeStyle="#000"; ctx.lineWidth=3;
  ctx.strokeText(`${Math.round(c.hp)}%`, c.x+c.w/2, c.y+c.h+H*0.035);
  ctx.fillText(`${Math.round(c.hp)}%`, c.x+c.w/2, c.y+c.h+H*0.035);
}

function drawCracks(c, ratio) {
  ctx.save();
  ctx.strokeStyle=`rgba(20,20,20,${ratio})`;
  ctx.lineWidth=3;
  ctx.lineJoin = "round";
  const cx=c.x, cy=c.y, cw=c.w, ch=c.h;
  const n=Math.floor(ratio*8)+2;
  
  // Fissures brisées et polygonales
  for(let i=0;i<n;i++) {
    const sx=cx+cw*(0.1+ (i*0.37)%0.8), sy=cy+ch*(0.1+ (i*0.29)%0.8);
    ctx.beginPath(); 
    ctx.moveTo(sx,sy);
    let currX = sx, currY = sy;
    for(let j=0;j<5;j++) {
      currX += (i%2===0?1:-1) * (10 + Math.random()*15);
      currY += 15 + Math.random()*20;
      ctx.lineTo(currX, currY);
    }
    ctx.stroke();
  }
  
  // Trous sombres
  ctx.fillStyle = `rgba(0,0,0,${ratio*0.8})`;
  for(let i=0;i<Math.floor(ratio*4);i++) {
    const sx=cx+cw*(0.2+ (i*0.41)%0.6), sy=cy+ch*(0.2+ (i*0.31)%0.6);
    ctx.beginPath();
    ctx.arc(sx, sy, cw*0.08, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawCharacterInCastle(c, isRed) {
  // Placeholders supprimés selon les instructions (en attente des sprites réels via CDN/base64/Scenario)
}

// ─── PROJECTILES ─────────────────────────────────────────────────────────────
function drawProjectiles() {
  projectiles.forEach(p => {
    // Traînée de fumée
    p.trail.forEach((pt,i) => {
      ctx.globalAlpha=(i/p.trail.length)*0.35;
      ctx.fillStyle="#aaa";
      const r=3*(i/p.trail.length);
      ctx.beginPath(); ctx.arc(pt.x,pt.y,r,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;

    // Image du projectile
    const img=IMG[p.img];
    const size=W*0.09;
    const angle=Math.atan2(p.vy,p.vx);
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(angle);
    if(img&&img.complete&&img.naturalWidth){
      ctx.drawImage(img,-size/2,-size/2,size,size);
    } else {
      ctx.fillStyle="#f39c12";
      ctx.beginPath(); ctx.arc(0,0,size/2,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
}

// ─── PARTICLES & DMG ─────────────────────────────────────────────────────────
function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawDmgNumbers() {
  dmgNumbers.forEach(d => {
    ctx.globalAlpha=d.life;
    ctx.font=`bold ${Math.round(16*W/375)}px Arial`;
    ctx.textAlign="center";
    ctx.strokeStyle="#000"; ctx.lineWidth=3;
    ctx.strokeText(d.val,d.x,d.y);
    ctx.fillStyle=d.color; ctx.fillText(d.val,d.x,d.y);
  });
  ctx.globalAlpha=1;
}

// ─── HUD ─────────────────────────────────────────────────────────────────────
function drawHUD() {
  const bw=W*0.38, bh=H*0.028, y=H*0.012;
  // Barre bleue (gauche)
  ctx.fillStyle="rgba(0,0,0,0.5)";
  ctx.beginPath(); ctx.roundRect(W*0.03,y,bw,bh,bh/2); ctx.fill();
  ctx.fillStyle="#3498db";
  ctx.beginPath(); ctx.roundRect(W*0.03,y,bw*(blue.hp/100),bh,bh/2); ctx.fill();
  // Barre rouge (droite)
  ctx.fillStyle="rgba(0,0,0,0.5)";
  ctx.beginPath(); ctx.roundRect(W-W*0.03-bw,y,bw,bh,bh/2); ctx.fill();
  ctx.fillStyle="#e74c3c";
  ctx.beginPath(); ctx.roundRect(W-W*0.03-bw,y,bw*(red.hp/100),bh,bh/2); ctx.fill();
  // VS
  ctx.fillStyle="#fff";
  ctx.font=`bold ${Math.round(18*W/375)}px Arial`;
  ctx.textAlign="center";
  ctx.strokeStyle="#000"; ctx.lineWidth=3;
  ctx.strokeText("Vs",W/2,y+bh*0.85); ctx.fillText("Vs",W/2,y+bh*0.85);
  // Icônes mini-châteaux HUD
  const iconS=H*0.065;
  if(IMG.BLUE_CASTLE.complete) ctx.drawImage(IMG.BLUE_CASTLE,W*0.03,y+bh+H*0.004,iconS*0.6,iconS);
  if(IMG.RED_CASTLE.complete)  ctx.drawImage(IMG.RED_CASTLE, W-W*0.03-iconS*0.6,y+bh+H*0.004,iconS*0.6,iconS);
}

// ─── DOCK ────────────────────────────────────────────────────────────────────
function drawDock() {
  const now=Date.now();
  UNITS.forEach((u,i) => {
    const d=dockRect(i);
    const sel=selectedUnit===i;
    const cdRatio=Math.min(1,Math.max(0,(now-(lastFired[u.id]||0))/u.cd));
    const ready=cdRatio>=1;

    // Fond
    ctx.fillStyle=sel?"rgba(241,196,15,0.92)":"rgba(0,0,0,0.65)";
    ctx.beginPath(); ctx.roundRect(d.x,d.y,d.w,d.h,8); ctx.fill();
    ctx.strokeStyle=sel?"#f1c40f":ready?"#ffffff55":"#ffffff22";
    ctx.lineWidth=sel?3:1.5; ctx.stroke();

    // Placeholders supprimés selon les instructions (en attente des sprites réels)
    const cx2=d.x+d.w*0.35, cy2=d.y+d.h*0.38;
    const r=d.h*0.22;
    // Arme
    const wi=IMG[u.projImg];
    if(wi&&wi.complete){
      ctx.drawImage(wi,cx2+r*0.2,cy2+r*0.3,d.h*0.25,d.h*0.18);
    }

    // Label + dmg
    ctx.fillStyle="#fff";
    ctx.font=`bold ${Math.round(10*W/375)}px Arial`;
    ctx.textAlign="left";
    ctx.fillText(u.label, d.x+d.w*0.62, d.y+d.h*0.42);
    ctx.font=`${Math.round(9*W/375)}px Arial`;
    ctx.fillStyle="#f1c40f";
    ctx.fillText(`-${u.dmg} HP`, d.x+d.w*0.62, d.y+d.h*0.65);

    // Cooldown overlay arc
    if(!ready) {
      ctx.fillStyle="rgba(0,0,0,0.55)";
      ctx.beginPath(); ctx.roundRect(d.x,d.y,d.w,d.h,8); ctx.fill();
      ctx.strokeStyle="#f1c40f"; ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(d.x+d.w/2,d.y+d.h/2,d.h*0.35,-Math.PI/2,-Math.PI/2+Math.PI*2*cdRatio);
      ctx.stroke();
    }
  });
}

// ─── TUTORIAL HAND ───────────────────────────────────────────────────────────
function drawTutHand() {
  const t2=elapsed%1.2/1.2;
  const d=dockRect(0);
  const tx=red.x+red.w*0.3, ty=red.y+red.h*0.4;
  const hx=d.x+d.w/2+(tx-d.x-d.w/2)*t2;
  const hy=d.y+d.h/2+(ty-d.y-d.h/2)*t2;
  ctx.font=`${Math.round(32*W/375)}px Arial`;
  ctx.textAlign="center";
  ctx.globalAlpha=0.7+0.3*Math.sin(elapsed*4);
  ctx.fillText("👆",hx,hy);
  ctx.globalAlpha=1;
}

// ─── TITLE ───────────────────────────────────────────────────────────────────
function drawTitle() {
  ctx.fillStyle="rgba(0,0,0,0.75)";
  ctx.fillRect(0,0,W,H);
  
  const titleY = H * 0.36;
  ctx.font=`bold ${Math.round(42*W/375)}px 'Impact', 'Arial Black', sans-serif`;
  ctx.textAlign="center";
  
  ctx.fillStyle = "#000";
  ctx.fillText("CASTLE CLASHER", W/2 + 4, titleY + 4);
  
  const g = ctx.createLinearGradient(0, titleY - 40, 0, titleY);
  g.addColorStop(0, "#f1c40f");
  g.addColorStop(1, "#e67e22");
  
  ctx.strokeStyle="#000"; ctx.lineWidth=6;
  ctx.strokeText("CASTLE CLASHER",W/2,titleY);
  ctx.fillStyle = g;
  ctx.fillText("CASTLE CLASHER",W/2,titleY);

  ctx.fillStyle="#fff";
  ctx.font=`${Math.round(16*W/375)}px Arial`;
  if(Math.floor(Date.now()/500)%2===0) ctx.fillText("TAP TO PLAY",W/2,H*0.48);
  ctx.font=`${Math.round(11*W/375)}px Arial`;
  ctx.fillStyle="#ccc";
  ctx.fillText("Select a unit · tap the enemy castle to fire",W/2,H*0.56);
}

// ─── END SCREEN ──────────────────────────────────────────────────────────────
function drawEndScreen(win) {
  ctx.fillStyle=win?"rgba(0,60,0,0.82)":"rgba(80,0,0,0.82)";
  ctx.fillRect(0,0,W,H);
  
  const titleY = H*0.4;
  ctx.font=`bold ${Math.round(44*W/375)}px 'Impact', 'Arial Black', sans-serif`;
  ctx.textAlign="center";
  const txt=win?"VICTORY! 🏆":"DEFEAT 💀";
  
  ctx.fillStyle = "#000";
  ctx.fillText(txt, W/2 + 4, titleY + 4);
  
  const g = ctx.createLinearGradient(0, titleY - 40, 0, titleY);
  g.addColorStop(0, win ? "#2ecc71" : "#e74c3c");
  g.addColorStop(1, win ? "#27ae60" : "#c0392b");
  
  ctx.strokeStyle="#000"; ctx.lineWidth=6;
  ctx.strokeText(txt,W/2,titleY); 
  ctx.fillStyle = g;
  ctx.fillText(txt,W/2,titleY);
  drawCTABtn();
}

function drawCTABtn() {
  const pulse=1+0.05*Math.sin(Date.now()/180);
  const bw=W*0.62,bh=H*0.082,bx=W/2-bw/2,by=H*0.54;
  ctx.save();
  ctx.translate(W/2,by+bh/2); ctx.scale(pulse,pulse); ctx.translate(-W/2,-(by+bh/2));
  const g=ctx.createLinearGradient(bx,by,bx,by+bh);
  g.addColorStop(0,"#f39c12"); g.addColorStop(1,"#e67e22");
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,bh/2); ctx.fill();
  ctx.fillStyle="#fff";
  ctx.font=`bold ${Math.round(20*W/375)}px Arial`;
  ctx.textAlign="center";
  ctx.fillText(CONFIG.ctaText,W/2,by+bh*0.65);
  ctx.restore();
}

function drawLoading() {
  ctx.fillStyle="#111"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#fff";
  ctx.font=`${Math.round(18*W/375)}px Arial`;
  ctx.textAlign="center";
  const dots=".".repeat(Math.floor(Date.now()/400)%4);
  ctx.fillText("Loading"+dots,W/2,H/2);
}

// ─── INPUT ───────────────────────────────────────────────────────────────────
function getPos(e) {
  const r=canvas.getBoundingClientRect();
  const sx=canvas.width/r.width, sy=canvas.height/r.height;
  const s=e.touches?e.touches[0]:e;
  return {x:(s.clientX-r.left)*sx, y:(s.clientY-r.top)*sy};
}

function onDown(e) {
  e.preventDefault();
  const p=getPos(e);

  if(state===S.LOADING) return;

  if(state===S.TITLE) {
    initGame(); state=S.PLAYING; lastTs=performance.now();
    try{AUD.MUSIC.play();}catch(err){}
    return;
  }

  if(state===S.WIN||state===S.LOSE) { alert("🎮 "+CONFIG.ctaText); return; }

  if(state!==S.PLAYING) return;

  // Dock
  for(let i=0;i<UNITS.length;i++) {
    const d=dockRect(i);
    if(p.x>=d.x&&p.x<=d.x+d.w&&p.y>=d.y&&p.y<=d.y+d.h) {
      selectedUnit=i; return;
    }
  }

  // Tir : tap n'importe où sur la moitié droite
  if(p.x > W*0.45) {
    const u=UNITS[selectedUnit];
    const now=Date.now();
    if((lastFired[u.id]||0)+u.cd <= now) {
      lastFired[u.id]=now;
      spawnProjectile(true);
    }
  }
}

canvas.addEventListener("mousedown",  onDown, {passive:false});
canvas.addEventListener("touchstart", onDown, {passive:false});

// ─── BOOT ────────────────────────────────────────────────────────────────────
requestAnimationFrame(update);
loadAssets(() => { state=S.TITLE; });

</script>

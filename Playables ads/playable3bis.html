    // ─── CONFIG ──────────────────────────────────────────────────────────────────
    const CONFIG = {
      castleHp: 100,
      enemyFireRate: 4000,
      enemyDamage: 8,
      unitDamage: { cyclops: 34, skeleton: 20, orc: 50 },
      unitCooldown: { cyclops: 1200, skeleton: 800, orc: 2000 },
      projectileSpeed: 5,
      ctaDelay: 18000,
      ctaText: "Play Now!",
      tutorialDuration: 3000,
      blackThreshold: 30,
    };

    // ─── SETUP ───────────────────────────────────────────────────────────────────
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    function resize() {
      const aspect = 16 / 9;
      let w = window.innerWidth, h = window.innerHeight;
      if (w / h > aspect) { w = h * aspect; } else { h = w / aspect; }
      canvas.width = Math.floor(w);
      canvas.height = Math.floor(h);
    }
    resize();
    window.addEventListener("resize", () => { resize(); });

    // ─── REMOVE BLACK BACKGROUND ────────────────────────────────────────────────
    function removeBlackBackground(srcImg) {
      const offC = document.createElement("canvas");
      offC.width = srcImg.naturalWidth;
      offC.height = srcImg.naturalHeight;
      const offCtx = offC.getContext("2d");
      offCtx.drawImage(srcImg, 0, 0);
      const imageData = offCtx.getImageData(0, 0, offC.width, offC.height);
      const d = imageData.data;
      const thr = CONFIG.blackThreshold;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i] < thr && d[i + 1] < thr && d[i + 2] < thr) {
          d[i + 3] = 0;
        }
      }
      offCtx.putImageData(imageData, 0, 0);
      const cleaned = new Image();
      cleaned.src = offC.toDataURL("image/png");
      return cleaned;
    }

    // ─── ASSETS LOADER ───────────────────────────────────────────────────────────
    const IMG = {};
    const AUD = {};
    let assetsLoaded = 0;
    const assetKeys = ["BG", "BLUE_CASTLE", "RED_CASTLE", "PROJ1", "PROJ2", "WEAPON1", "WEAPON2"];
    const castleKeys = ["BLUE_CASTLE", "RED_CASTLE"];
    const audioKeys = ["MUSIC", "SFX"];

    function loadAssets(cb) {
      let total = assetKeys.length + audioKeys.length;
      function done() { if (++assetsLoaded >= total) postProcess(cb); }
      function postProcess(callback) {
        castleKeys.forEach(k => {
          if (IMG[k] && IMG[k].complete && IMG[k].naturalWidth > 0) {
            IMG[k] = removeBlackBackground(IMG[k]);
          }
        });
        callback();
      }

      assetKeys.forEach(k => {
        const img = new Image();
        img.onload = done;
        img.onerror = done;
        img.src = ASSETS_B64[k];
        IMG[k] = img;
      });

      audioKeys.forEach(k => {
        const audio = new Audio();
        audio.oncanplaythrough = done;
        audio.onerror = done;
        audio.src = ASSETS_B64[k];
        if (k === "MUSIC") { audio.loop = true; audio.volume = 0.4; }
        else { audio.volume = 0.7; }
        AUD[k] = audio;
      });
    }

    // ─── STATE ───────────────────────────────────────────────────────────────────
    const STATE = { LOADING: 0, TITLE: 1, PLAYING: 2, WIN: 3, LOSE: 4, CTA: 5 };
    let state = STATE.LOADING;
    let t = 0; // ms depuis start playing
    let playerHp = 100;
    let enemyHp = 100;
    let particles = [];
    let projectiles = [];
    let enemyProjectiles = [];
    let floatingDmg = [];
    let debris = [];
    let lastEnemyFire = 0;
    let ctaShown = false;
    let shakeT = 0;
    let flashT = 0;
    let flashColor = "rgba(255,0,0,0.0)";
    let playStartTime = 0;

    function spawnFloatingDmg(x, y, dmg, color) {
      floatingDmg.push({ x, y, dmg, color, life: 1.0, vy: -2 * sc() });
    }


    // Unités disponibles dans le dock
    const UNITS = [
      { id: "cyclops", label: "Cyclops", dmg: CONFIG.unitDamage.cyclops, proj: "PROJ2", weapon: "WEAPON2", color: "#e74c3c", cd: 0 },
      { id: "skeleton", label: "Skeleton", dmg: CONFIG.unitDamage.skeleton, proj: "PROJ1", weapon: "WEAPON1", color: "#95a5a6", cd: 0 },
      { id: "orc", label: "Orc", dmg: CONFIG.unitDamage.orc, proj: "PROJ2", weapon: "WEAPON2", color: "#27ae60", cd: 0 },
    ];
    let selectedUnit = null;
    let dragPos = null;
    let lastFired = {}; // cooldown par unité

    // ─── LAYOUT helpers ──────────────────────────────────────────────────────────
    function W() { return canvas.width; }
    function H() { return canvas.height; }
    function sc() { return W() / 800; } // scale factor

    // Positions clés
    function bluePos() { return { x: W() * 0.13, y: H() * 0.30, w: W() * 0.18, h: H() * 0.55 }; }
    function redPos() { return { x: W() * 0.72, y: H() * 0.30, w: W() * 0.18, h: H() * 0.55 }; }
    function groundY() { return H() * 0.85; }

    // Dock positions (3 unités en bas gauche)
    function dockPos(i) {
      const size = W() * 0.10;
      const pad = W() * 0.02;
      return { x: pad + i * (size + pad), y: H() - size - pad, w: size, h: size };
    }

    // ─── PARTICLES ───────────────────────────────────────────────────────────────
    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (2 + Math.random() * 4) * sc();
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2 * sc(),
          life: 1.0, color,
          size: (4 + Math.random() * 8) * sc()
        });
      }
    }

    // ─── FIRE ────────────────────────────────────────────────────────────────────
    function fireUnit(unit) {
      const now = Date.now();
      const cd = CONFIG.unitCooldown[unit.id] || 800;
      if ((lastFired[unit.id] || 0) + cd > now) return;
      lastFired[unit.id] = now;

      const bp = bluePos();
      const rp = redPos();
      const startX = bp.x + bp.w;
      const startY = bp.y + bp.h * 0.3;
      const endX = rp.x;
      const endY = rp.y + rp.h * 0.3;

      projectiles.push({
        x: startX, y: startY,
        tx: endX, ty: endY,
        sx: startX, sy: startY,
        progress: 0,
        speed: CONFIG.projectileSpeed,
        dmg: unit.dmg,
        img: unit.proj,
        arc: H() * 0.28,
      });

      // SFX
      try { const s = AUD.SFX.cloneNode(); s.volume = 0.5; s.play(); } catch (e) { }
    }

    function fireEnemy() {
      const rp = redPos();
      const bp = bluePos();
      enemyProjectiles.push({
        x: rp.x, y: rp.y + rp.h * 0.3,
        tx: bp.x + bp.w, ty: bp.y + bp.h * 0.3,
        sx: rp.x, sy: rp.y + rp.h * 0.3,
        progress: 0, speed: 3, dmg: CONFIG.enemyDamage,
        img: "PROJ1", arc: H() * 0.15,
      });
    }

    // ─── UPDATE ──────────────────────────────────────────────────────────────────
    let lastTime = 0;
    function update(ts) {
      const dt = Math.min((ts - lastTime) / 1000, 0.05);
      lastTime = ts;

      if (state !== STATE.PLAYING) { requestAnimationFrame(update); render(); return; }

      t += dt * 1000;
      shakeT = Math.max(0, shakeT - dt);
      flashT = Math.max(0, flashT - dt);

      // Ennemi tire
      if (Date.now() - lastEnemyFire > CONFIG.enemyFireRate && enemyHp > 0) {
        lastEnemyFire = Date.now();
        fireEnemy();
      }

      // Update projectiles joueur
      projectiles = projectiles.filter(p => {
        const dx = p.tx - p.sx, dy = p.ty - p.sy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        p.progress += (p.speed * 60 * dt) / dist;
        const t2 = p.progress;
        p.x = p.sx + dx * t2;
        p.y = p.sy + dy * t2 - p.arc * 4 * t2 * (1 - t2);
        if (p.progress >= 1) {
          enemyHp = Math.max(0, enemyHp - p.dmg);
          shakeT = 0.3;
          flashColor = "rgba(255,100,0,0.35)";
          flashT = 0.25;
          spawnParticles(p.tx, p.ty, "#f39c12", 16);
          spawnFloatingDmg(p.tx, p.ty - 20 * sc(), p.dmg, "#f1c40f");
          // Spawn debris
          for (let i = 0; i < 6; i++) {
            debris.push({
              x: p.tx + (Math.random() - 0.5) * 40 * sc(),
              y: p.ty + (Math.random() - 0.5) * 40 * sc(),
              vx: (Math.random() - 0.5) * 8 * sc(),
              vy: -Math.random() * 6 * sc(),
              va: (Math.random() - 0.5) * 0.5,
              size: (10 + Math.random() * 15) * sc(),
              life: 1,
              angle: 0,
              color: Math.random() > 0.5 ? "#7f8c8d" : "#bdc3c7"
            });
          }
          if (enemyHp <= 0) { spawnParticles(p.tx, p.ty, "#e74c3c", 40); setTimeout(() => { state = STATE.WIN; }, 600); }
          return false;
        }
        return true;
      });

      // Update projectiles ennemis
      enemyProjectiles = enemyProjectiles.filter(p => {
        const dx = p.tx - p.sx, dy = p.ty - p.sy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        p.progress += (p.speed * 60 * dt) / dist;
        const t2 = p.progress;
        p.x = p.sx + dx * t2;
        p.y = p.sy + dy * t2 - p.arc * 4 * t2 * (1 - t2);
        if (p.progress >= 1) {
          playerHp = Math.max(0, playerHp - p.dmg);
          shakeT = 0.15;
          flashColor = "rgba(255,0,0,0.3)";
          flashT = 0.2;
          spawnParticles(p.tx, p.ty, "#3498db", 10);
          spawnFloatingDmg(p.tx, p.ty - 20 * sc(), p.dmg, "#e74c3c");
          // Spawn debris
          for (let i = 0; i < 6; i++) {
            debris.push({
              x: p.tx + (Math.random() - 0.5) * 40 * sc(),
              y: p.ty + (Math.random() - 0.5) * 40 * sc(),
              vx: (Math.random() - 0.5) * 8 * sc(),
              vy: -Math.random() * 6 * sc(),
              va: (Math.random() - 0.5) * 0.5,
              size: (10 + Math.random() * 15) * sc(),
              life: 1,
              angle: 0,
              color: Math.random() > 0.5 ? "#7f8c8d" : "#95a5a6"
            });
          }
          if (playerHp <= 0) { state = STATE.LOSE; }
          return false;
        }
        return true;
      });

      // Floating damage numbers
      floatingDmg = floatingDmg.filter(f => {
        f.y += f.vy;
        f.life -= dt * 1.5;
        return f.life > 0;
      });

      // Particles
      particles = particles.filter(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.15 * sc();
        p.life -= dt * 1.8;
        return p.life > 0;
      });

      // Debris
      debris = debris.filter(d => {
        d.x += d.vx; d.y += d.vy; d.vy += 0.3 * sc();
        d.life -= dt * 0.5;
        d.angle += d.va;
        return d.life > 0;
      });

      // CTA après délai
      if (t >= CONFIG.ctaDelay && !ctaShown) { ctaShown = true; state = STATE.CTA; }

      requestAnimationFrame(update);
      render();
    }

    // ─── RENDER ──────────────────────────────────────────────────────────────────
    function render() {
      ctx.save();

      // Screen shake
      if (shakeT > 0) {
        const mag = shakeT * 8 * sc();
        ctx.translate(Math.random() * mag - mag / 2, Math.random() * mag - mag / 2);
      }

      // Background
      if (IMG.BG.complete) {
        const bgRatio = IMG.BG.naturalWidth / IMG.BG.naturalHeight;
        const bh = H() * 0.85;
        const bw = bh * bgRatio;
        const bx = (W() - bw) / 2;
        ctx.drawImage(IMG.BG, bx, 0, bw, bh);
      } else {
        ctx.fillStyle = "#87ceeb";
        ctx.fillRect(0, 0, W(), H());
      }

      // Sol
      ctx.fillStyle = "#2c3e50";
      ctx.fillRect(0, H() * 0.85, W(), H() * 0.15);

      // Châteaux
      drawCastle("BLUE_CASTLE", bluePos(), playerHp);
      drawCastle("RED_CASTLE", redPos(), enemyHp);

      // Minimalist HP bars with Castle Icons
      drawMinimalHpBar(W() * 0.05, H() * 0.04, W() * 0.35, H() * 0.035, playerHp / 100, "#3498db", "BLUE_CASTLE");
      drawMinimalHpBar(W() * 0.60, H() * 0.04, W() * 0.35, H() * 0.035, enemyHp / 100, "#e74c3c", "RED_CASTLE");

      // VS
      ctx.fillStyle = "#fff";
      ctx.font = `bold ${24 * sc()}px Arial`;
      ctx.textAlign = "center";
      ctx.fillText("VS", W() * 0.5, H() * 0.065);

      // Projectiles
      [...projectiles, ...enemyProjectiles].forEach(p => {
        const img = IMG[p.img];
        const size = 40 * sc();
        const angle = Math.atan2(p.ty - p.sy, p.tx - p.sx) - (p === projectiles[0] ? 0 : Math.PI);
        ctx.save();
        ctx.translate(p.x, p.y);
        const vx = p.tx - p.sx, vy = p.ty - p.sy - p.arc * 4 * (2 * p.progress - 1) * (2 * p.progress - 1);
        ctx.rotate(Math.atan2(vy, vx));
        if (img && img.complete) ctx.drawImage(img, -size / 2, -size / 2, size, size);
        else { ctx.fillStyle = "#f1c40f"; ctx.fillRect(-size / 2, -size / 2, size, size); }
        ctx.restore();
      });

      // Particles
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      });
      ctx.globalAlpha = 1;

      // Debris
      debris.forEach(d => {
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.angle);
        ctx.globalAlpha = d.life;
        ctx.fillStyle = d.color;
        ctx.fillRect(-d.size/2, -d.size/2, d.size, d.size);
        ctx.strokeStyle = "#2c3e50";
        ctx.lineWidth = 1 * sc();
        ctx.strokeRect(-d.size/2, -d.size/2, d.size, d.size);
        ctx.restore();
      });

      // Floating damage numbers
      floatingDmg.forEach(f => {
        ctx.globalAlpha = f.life;
        ctx.fillStyle = f.color;
        ctx.font = `bold ${(18 + 8 * (1 - f.life)) * sc()}px Arial`;
        ctx.textAlign = 'center';
        ctx.strokeStyle = 'rgba(0,0,0,0.7)';
        ctx.lineWidth = 3 * sc();
        ctx.strokeText(`-${f.dmg}`, f.x, f.y);
        ctx.fillText(`-${f.dmg}`, f.x, f.y);
      });
      ctx.globalAlpha = 1;

      // Flash écran
      if (flashT > 0) {
        ctx.fillStyle = flashColor;
        ctx.fillRect(0, 0, W(), H());
      }

      // Dock
      drawDock();

      // Tutorial hand animation
      if (state === STATE.PLAYING && playStartTime > 0) {
        const elapsed = Date.now() - playStartTime;
        if (elapsed < CONFIG.tutorialDuration) {
          drawTutorialHand(elapsed);
        }
      }

      // Overlay selon state
      if (state === STATE.TITLE) drawTitle();
      else if (state === STATE.WIN) drawEndScreen(true);
      else if (state === STATE.LOSE) drawEndScreen(false);
      else if (state === STATE.CTA) drawCTA();
      else if (state === STATE.LOADING) drawLoading();

      ctx.restore();
    }

    function drawTutorialHand(elapsed) {
      const rp = redPos();
      const handX = rp.x + rp.w/2 + Math.sin(elapsed/200) * 20 * sc();
      const handY = rp.y + rp.h/2 + Math.cos(elapsed/200) * 20 * sc();
      
      ctx.save();
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(handX, handY, 15*sc(), 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = 4*sc();
      ctx.beginPath();
      ctx.arc(handX, handY, 25*sc() + (elapsed%500)/20, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    function drawCastle(key, pos, hp) {
      const img = IMG[key];
      ctx.save();
      const hpPct = hp / CONFIG.castleHp;

      let dh = pos.h;
      let dw = pos.w;
      if (img && img.complete && img.naturalHeight > 0) {
        const imgAspect = img.naturalWidth / img.naturalHeight;
        dw = dh * imgAspect;
      } else {
        // Massive vertical structures
        dw = dh * 0.4;
      }
      let dx = pos.x + (pos.w - dw) / 2;
      let dy = pos.y;

      // Draw Treads (chenilles)
      ctx.fillStyle = "#222";
      ctx.beginPath();
      ctx.roundRect(dx - 10*sc(), dy + dh - 10*sc(), dw + 20*sc(), 24*sc(), 12*sc());
      ctx.fill();
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 2*sc();
      ctx.stroke();
      // Wheels inside tread
      ctx.fillStyle = "#111";
      for(let i=0; i<4; i++) {
        ctx.beginPath();
        ctx.arc(dx + 5*sc() + i * (dw/3), dy + dh + 2*sc(), 8*sc(), 0, Math.PI*2);
        ctx.fill();
      }

      if (hpPct < 0.30) {
        const mag = (0.30 - hpPct) * 12 * sc();
        ctx.translate(Math.random() * mag - mag / 2, Math.random() * mag - mag / 2);
      }

      if (hpPct < 0.50) {
        const tiltAngle = (0.50 - hpPct) * 0.08;
        const cx = dx + dw / 2;
        const cy = dy + dh;
        ctx.translate(cx, cy);
        ctx.rotate(key === 'RED_CASTLE' ? tiltAngle : -tiltAngle);
        ctx.translate(-cx, -cy);
      }

      if (hpPct < 0.25) {
        const clipH = dh * (0.5 + hpPct * 2);
        ctx.beginPath();
        ctx.rect(dx - 20*sc(), dy + dh - clipH, dw + 40*sc(), clipH + 20*sc());
        ctx.clip();
      }

      ctx.globalAlpha = 0.4 + hpPct * 0.6;

      if (img && img.complete) {
        ctx.drawImage(img, dx, dy, dw, dh);
      } else {
        ctx.fillStyle = key === "BLUE_CASTLE" ? "#2980b9" : "#c0392b";
        ctx.fillRect(dx, dy, dw, dh);
      }

      if (hpPct < 0.75) {
        ctx.globalAlpha = (0.75 - hpPct) * 1.5;
        ctx.fillStyle = '#111';
        const cx = dx + dw * 0.5;
        const cy = dy + dh * 0.4;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx - dw*0.1, cy + dh*0.1);
        ctx.lineTo(cx - dw*0.05, cy + dh*0.2);
        ctx.lineTo(cx - dw*0.15, cy + dh*0.3);
        ctx.lineTo(cx - dw*0.1, cy + dh*0.35);
        ctx.lineTo(cx, cy + dh*0.25);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(cx + dw*0.1, cy + dh*0.15);
        ctx.lineTo(cx + dw*0.2, cy + dh*0.1);
        ctx.lineTo(cx + dw*0.25, cy + dh*0.25);
        ctx.lineTo(cx + dw*0.15, cy + dh*0.2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function drawMinimalHpBar(x, y, w, h, pct, color, iconKey) {
      // Icon
      const is = h * 1.5;
      const img = IMG[iconKey];
      if (img && img.complete) {
        ctx.drawImage(img, x, y - (is-h)/2, is, is);
      } else {
        ctx.fillStyle = color;
        ctx.fillRect(x, y - (is-h)/2, is, is);
      }
      const bx = x + is + 10*sc();
      const bw = w - is - 10*sc();
      
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.beginPath(); ctx.roundRect(bx, y, bw, h, h / 2); ctx.fill();

      ctx.fillStyle = color;
      const fbw = Math.max(0, bw * pct);
      ctx.save();
      ctx.beginPath(); ctx.roundRect(bx, y, fbw, h, h / 2); ctx.fill();
      ctx.restore();

      ctx.fillStyle = "#fff";
      ctx.font = `bold ${12 * sc()}px Arial`;
      ctx.textAlign = "left";
      ctx.fillText(`${Math.round(pct * 100)}%`, bx + 10*sc(), y + h * 0.75);
    }

    function drawDock() {
      UNITS.forEach((u, i) => {
        const d = dockPos(i);
        const isSelected = selectedUnit === i;

        // Fond
        ctx.fillStyle = isSelected ? "rgba(241,196,15,0.9)" : "rgba(0,0,0,0.65)";
        ctx.beginPath(); ctx.roundRect(d.x, d.y, d.w, d.h, 8 * sc()); ctx.fill();
        ctx.strokeStyle = isSelected ? "#f1c40f" : "#ffffff44";
        ctx.lineWidth = 2 * sc(); ctx.stroke();

        // Placeholder pour l'asset (voir doc Scenario.com)
        ctx.fillStyle = "rgba(255,255,255,0.1)";
        ctx.beginPath(); ctx.arc(d.x + d.w/2, d.y + d.h*0.4, d.w*0.25, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = `bold ${14 * sc()}px Arial`;
        ctx.textAlign = "center";
        ctx.fillText("?", d.x + d.w/2, d.y + d.h*0.45);

        // Label
        ctx.fillStyle = "#fff";
        ctx.font = `bold ${10 * sc()}px Arial`;
        ctx.textAlign = "center";
        ctx.fillText(u.label, d.x + d.w / 2, d.y + d.h * 0.82);
        ctx.fillText(`-${u.dmg}HP`, d.x + d.w / 2, d.y + d.h * 0.94);
      });
    }

    function drawTitle() {
      ctx.fillStyle = "rgba(0,0,0,0.72)";
      ctx.fillRect(0, 0, W(), H());

      // Logo-style text
      const titleY = H() * 0.38;
      ctx.font = `900 ${60 * sc()}px "Arial Black", Impact, sans-serif`;
      ctx.textAlign = "center";
      
      ctx.lineWidth = 8 * sc();
      ctx.strokeStyle = "#000";
      ctx.strokeText("CASTLE CLASHER", W() / 2, titleY);
      
      const grad = ctx.createLinearGradient(0, titleY - 60*sc(), 0, titleY);
      grad.addColorStop(0, "#f39c12");
      grad.addColorStop(1, "#e74c3c");
      ctx.fillStyle = grad;
      ctx.fillText("CASTLE CLASHER", W() / 2, titleY);

      ctx.fillStyle = "#fff";
      ctx.font = `bold ${24 * sc()}px Arial`;
      const blink = Math.floor(Date.now() / 500) % 2 === 0;
      if (blink) ctx.fillText("TAP TO PLAY", W() / 2, H() * 0.54);
      
      ctx.font = `${16 * sc()}px Arial`;
      ctx.fillStyle = "#ccc";
      ctx.fillText("Select a unit from the dock, then tap the enemy castle!", W() / 2, H() * 0.65);
    }

    function drawEndScreen(win) {
      ctx.fillStyle = "rgba(0,0,0,0.85)";
      ctx.fillRect(0, 0, W(), H());
      
      // Top Logo
      const titleY = H() * 0.2;
      ctx.font = `900 ${50 * sc()}px "Arial Black", Impact, sans-serif`;
      ctx.textAlign = "center";
      ctx.lineWidth = 6 * sc();
      ctx.strokeStyle = "#000";
      ctx.strokeText("CASTLE CLASHERS", W() / 2, titleY);
      const grad = ctx.createLinearGradient(0, titleY - 50*sc(), 0, titleY);
      grad.addColorStop(0, "#f39c12");
      grad.addColorStop(1, "#e74c3c");
      ctx.fillStyle = grad;
      ctx.fillText("CASTLE CLASHERS", W() / 2, titleY);

      // Characters aligned in center (Placeholders for Scenario sprites)
      const cx = W() / 2;
      const cy = H() * 0.5;
      const spacing = W() * 0.25;
      const size = W() * 0.15;
      
      for(let i=-1; i<=1; i++) {
        ctx.fillStyle = "rgba(255,255,255,0.1)";
        ctx.beginPath();
        ctx.arc(cx + i*spacing, cy, size, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = `bold ${14 * sc()}px Arial`;
        ctx.fillText("Sprite", cx + i*spacing, cy);
      }
      
      ctx.fillStyle = win ? "#2ecc71" : "#e74c3c";
      ctx.font = `900 ${46 * sc()}px "Arial Black", Impact, sans-serif`;
      ctx.fillText(win ? "VICTORY!" : "DEFEAT", W() / 2, H() * 0.35);

      drawShinyPlayButton();
    }

    function drawCTA() {
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, W(), H());
      ctx.fillStyle = "#f1c40f";
      ctx.font = `bold ${36 * sc()}px Arial`;
      ctx.textAlign = "center";
      ctx.fillText("Ready for the real battle?", W() / 2, H() * 0.38);
      drawShinyPlayButton();
    }

    function drawShinyPlayButton() {
      const bw = W() * 0.6;
      const bh = H() * 0.1;
      const bx = (W() - bw) / 2;
      const by = H() * 0.75;
      
      const pulse = 1 + Math.sin(Date.now() / 150) * 0.05;
      ctx.save();
      ctx.translate(W()/2, by + bh/2);
      ctx.scale(pulse, pulse);
      ctx.translate(-W()/2, -(by + bh/2));

      // Button background
      ctx.fillStyle = "#27ae60";
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh/2); ctx.fill();
      ctx.lineWidth = 4*sc(); ctx.strokeStyle = "#2ecc71"; ctx.stroke();
      
      // Shiny effect
      const grad = ctx.createLinearGradient(bx, by, bx, by + bh/2);
      grad.addColorStop(0, "rgba(255,255,255,0.4)");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh/2, bh/2); ctx.fill();

      // Text
      ctx.fillStyle = "#fff";
      ctx.font = `bold ${32 * sc()}px Arial`;
      ctx.textAlign = "center";
      ctx.fillText("PLAY NOW", W() / 2, by + bh * 0.65);
      ctx.restore();
    }

    function drawLoading() {
      ctx.fillStyle = "rgba(0,0,0,0.9)";
      ctx.fillRect(0, 0, W(), H());
      ctx.fillStyle = "#fff";
      ctx.font = `${20 * sc()}px Arial`;
      ctx.textAlign = "center";
      ctx.fillText("Loading...", W() / 2, H() / 2);
    }

    function drawCTAButton() {
      const pulse = 1 + 0.04 * Math.sin(Date.now() / 200);
      const bw = W() * 0.38, bh = H() * 0.10;
      const bx = W() / 2 - bw / 2, by = H() * 0.56;
      ctx.save();
      ctx.translate(W() / 2, by + bh / 2);
      ctx.scale(pulse, pulse);
      ctx.translate(-W() / 2, -(by + bh / 2));
      const grad = ctx.createLinearGradient(bx, by, bx, by + bh);
      grad.addColorStop(0, "#f39c12"); grad.addColorStop(1, "#e67e22");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh / 2); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = `bold ${22 * sc()}px Arial`;
      ctx.textAlign = "center";
      ctx.fillText(CONFIG.ctaText, W() / 2, by + bh * 0.65);
      ctx.restore();
    }

    // ─── INPUT ───────────────────────────────────────────────────────────────────
    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const src = e.touches ? e.touches[0] : e;
      return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };
    }

    function onTapDown(e) {
      e.preventDefault();
      const pos = getCanvasPos(e);

      if (state === STATE.TITLE) {
        state = STATE.PLAYING;
        lastEnemyFire = Date.now();
        try { AUD.MUSIC.play(); } catch (err) { }
        return;
      }

      if (state === STATE.WIN || state === STATE.LOSE || state === STATE.CTA) {
        // CTA click
        alert("🎮 " + CONFIG.ctaText);
        return;
      }

      if (state !== STATE.PLAYING) return;

      // Sélection dock
      for (let i = 0; i < UNITS.length; i++) {
        const d = dockPos(i);
        if (pos.x >= d.x && pos.x <= d.x + d.w && pos.y >= d.y && pos.y <= d.y + d.h) {
          selectedUnit = i;
          return;
        }
      }

      // Tir si unité sélectionnée et tap sur château ennemi
      if (selectedUnit !== null) {
        const rp = redPos();
        const hitZone = { x: rp.x - W() * 0.05, y: 0, w: rp.w + W() * 0.1, h: H() };
        if (pos.x >= hitZone.x && pos.x <= hitZone.x + hitZone.w) {
          fireUnit(UNITS[selectedUnit]);
        }
      }
    }

    canvas.addEventListener("mousedown", onTapDown, { passive: false });
    canvas.addEventListener("touchstart", onTapDown, { passive: false });

    // ─── BOOT ────────────────────────────────────────────────────────────────────
    loadAssets(() => {
      state = STATE.TITLE;
      requestAnimationFrame(update);
    });
    // Fallback si assets trop lents
    setTimeout(() => {
      if (state === STATE.LOADING) { state = STATE.TITLE; requestAnimationFrame(update); }
    }, 3000);

  </script>

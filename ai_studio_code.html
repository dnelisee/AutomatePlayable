<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Castle Clasher - Playable Ad</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #87CEEB; /* Ciel de fond fallback */
            font-family: 'Impact', 'Arial Black', sans-serif;
            touch-action: none;
            user-select: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end;
        }
        
        /* Personnages Joueur (Elf, Knight, Mage) */
        #character-selection {
            display: none; justify-content: center; gap: 20px; padding-bottom: 40px;
            pointer-events: auto;
        }
        .char-btn {
            width: 70px; height: 70px; border-radius: 15px; border: 4px solid #fff;
            background-color: rgba(0,0,0,0.6); background-size: cover; background-position: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5); transition: transform 0.1s;
        }
        .char-btn.selected {
            border-color: #FFD700; transform: scale(1.15); box-shadow: 0 0 20px #FFD700;
        }

        #damage-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            background: linear-gradient(to top, rgba(255,0,0,0.7), transparent);
            opacity: 0; transition: opacity 0.2s; pointer-events: none;
        }

        #finger-cursor {
            position: absolute; width: 60px; height: 60px; display: none;
            background-size: contain; background-repeat: no-repeat;
            pointer-events: none; z-index: 100;
            transform: translate(-20%, -20%); /* Ajuste le point de clic visuel */
        }

        #end-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto;
        }
        h1 { color: white; font-size: 60px; margin-bottom: 30px; text-transform: uppercase; text-shadow: 4px 4px 0 #000; letter-spacing: 2px; }
        .cta-btn {
            background: linear-gradient(to bottom, #FFD700, #FF8C00); color: #000;
            padding: 20px 50px; font-size: 30px; font-weight: bold; font-family: 'Impact', sans-serif;
            border: 4px solid #fff; border-radius: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6); cursor: pointer; animation: pulse 0.8s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div id="damage-overlay"></div>
    <div id="finger-cursor"></div>
    <div id="character-selection">
        <div class="char-btn selected" id="char-0"></div>
        <div class="char-btn" id="char-1"></div>
        <div class="char-btn" id="char-2"></div>
    </div>
</div>

<div id="end-screen">
    <h1 id="end-title">VICTOIRE !</h1>
    <button class="cta-btn" onclick="openStore()">JOUER MAINTENANT</button>
</div>

<script>
/**
 * --- DICTIONNAIRE DES ASSETS (Base64) ---
 * Remplacez ces chaînes par les Base64 de vos propres images.
 */
const ASSETS = {
    // Curseur / UI
    finger: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M40 20 C40 5, 60 5, 60 20 L60 50 C70 45, 90 55, 80 80 L70 95 L30 95 L20 60 L40 50 Z' fill='%23FFD700' stroke='%23000' stroke-width='3'/></svg>",

    ground_pattern: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='20' fill='%235b8c36'/><rect y='20' width='100' height='80' fill='%235e4324'/></svg>",

    shelf_cracked: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 20'><rect width='100' height='20' fill='%23A0522D' stroke='%23000' stroke-width='2'/><path d='M20 0 L30 10 L25 20 M70 0 L60 15 L75 20' stroke='%23000' stroke-width='2' fill='none'/></svg>",

    // Personnages Joueur
    char_elf: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 100'><circle cx='40' cy='30' r='20' fill='%23FFE0BD'/><rect x='25' y='50' width='30' height='40' fill='%234CAF50'/><path d='M10 20 L20 30 M70 20 L60 30' stroke='%23FFE0BD' stroke-width='5'/></svg>",
    char_knight: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 100'><rect x='20' y='10' width='40' height='40' rx='10' fill='%23B0BEC5'/><rect x='15' y='50' width='50' height='40' fill='%2378909C'/><rect x='30' y='20' width='20' height='10' fill='%23212121'/></svg>",
    char_mage: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 100'><path d='M20 50 L40 10 L60 50 Z' fill='%239C27B0'/><rect x='25' y='50' width='30' height='50' fill='%238E24AA'/></svg>",

    // Personnage Ennemi (Cyclope)
    char_cyclops: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 100'><circle cx='40' cy='35' r='25' fill='%23E53935'/><circle cx='40' cy='30' r='10' fill='%23FFF'/><circle cx='40' cy='30' r='4' fill='%23000'/><rect x='20' y='60' width='40' height='40' fill='%238B0000'/></svg>",

    // Châteaux (Joueur = Bleu, Ennemi = Noir)
    castle_blue_0: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 350'><rect x='0' y='50' width='300' height='300' fill='%2378909C' stroke='%23000' stroke-width='4'/><polygon points='0,50 150,0 300,50' fill='%231E88E5' stroke='%23000' stroke-width='4'/></svg>",
    castle_blue_1: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 350'><rect x='0' y='50' width='300' height='300' fill='%2378909C' stroke='%23000' stroke-width='4'/><polygon points='0,50 150,0 300,50' fill='%231E88E5' stroke='%23000' stroke-width='4'/><path d='M50 50 L80 150 L60 200 M200 50 L180 120 L220 180' stroke='%23000' stroke-width='5' fill='none'/></svg>",
    castle_blue_2: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 350'><rect x='0' y='50' width='300' height='300' fill='%2378909C' stroke='%23000' stroke-width='4'/><polygon points='0,50 150,0 300,50' fill='%231E88E5' stroke='%23000' stroke-width='4'/><path d='M50 50 L80 150 L60 200 M200 50 L180 120 L220 180 M100 100 L150 250 M250 100 L280 200' stroke='%23000' stroke-width='8' fill='none'/></svg>",
    
    castle_dark_0: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 350'><rect x='0' y='50' width='300' height='300' fill='%23424242' stroke='%23000' stroke-width='4'/><polygon points='0,50 150,0 300,50' fill='%23B71C1C' stroke='%23000' stroke-width='4'/></svg>",
    castle_dark_1: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 350'><rect x='0' y='50' width='300' height='300' fill='%23424242' stroke='%23000' stroke-width='4'/><polygon points='0,50 150,0 300,50' fill='%23B71C1C' stroke='%23000' stroke-width='4'/><path d='M80 50 L60 120 L90 200 M250 50 L220 150 L240 250' stroke='%23000' stroke-width='5' fill='none'/></svg>",
    castle_dark_2: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 350'><rect x='0' y='50' width='300' height='300' fill='%23424242' stroke='%23000' stroke-width='4'/><polygon points='0,50 150,0 300,50' fill='%23B71C1C' stroke='%23000' stroke-width='4'/><path d='M80 50 L60 120 L90 200 M250 50 L220 150 L240 250 M120 80 L150 200 L130 280' stroke='%23000' stroke-width='8' fill='none'/></svg>",

    // Projectiles
    missile: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 20'><path d='M0 5 L40 5 L60 10 L40 15 L0 15 Z' fill='%23D84315' stroke='%23000' stroke-width='2'/><rect x='0' y='0' width='10' height='20' fill='%23757575'/></svg>",
    bird: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='15' fill='%23212121'/><path d='M30 15 L40 20 L30 25 Z' fill='%23FFEB3B'/><circle cx='25' cy='15' r='3' fill='%23F44336'/><path d='M5 20 L-10 10 L0 20 L-10 30 Z' fill='%23212121'/></svg>",
    
    // VFX
    particle_smoke: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><circle cx='10' cy='10' r='10' fill='rgba(150,150,150,0.8)'/></svg>",
    particle_debris: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><rect width='20' height='20' fill='%23555'/></svg>"
};

// Application des icônes UI
document.getElementById('char-0').style.backgroundImage = `url("${ASSETS.char_elf}")`;
document.getElementById('char-1').style.backgroundImage = `url("${ASSETS.char_knight}")`;
document.getElementById('char-2').style.backgroundImage = `url("${ASSETS.char_mage}")`;
const fingerCursor = document.getElementById('finger-cursor');
fingerCursor.style.backgroundImage = `url("${ASSETS.finger}")`;

// Préchargement
const IMAGES = {};
let imagesLoaded = 0;
const totalImages = Object.keys(ASSETS).length;

for (let key in ASSETS) {
    IMAGES[key] = new Image();
    IMAGES[key].onload = () => {
        imagesLoaded++;
        if (imagesLoaded === totalImages) startGame();
    };
    IMAGES[key].src = ASSETS[key];
}

// --- MOTEUR DE JEU ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiSelection = document.getElementById('character-selection');

const GAME = {
    state: 'LOADING',
    width: 2500,
    height: 1200,
    gravity: 0.4
};

let camera = { x: 2000, y: 600, zoom: 1, targetX: 2000, targetY: 600, targetZoom: 1, shake: 0 };
let projectiles = [];
let particles =[];
let input = { active: false, startX: 0, startY: 0, currX: 0, currY: 0, clientX: 0, clientY: 0 };
let activeCharIndex = 0;
let time = 0;

// Topologie du terrain (Collines continues)
function getGroundY(x) {
    return GAME.height - 200 - Math.sin(x / 400) * 80 - Math.sin(x / 800) * 120;
}
function getGroundAngle(x) {
    return Math.atan2(getGroundY(x + 5) - getGroundY(x - 5), 10);
}

// --- CLASSES ---
class VehicleCastle {
    constructor(x, isPlayer) {
        this.baseX = x;
        this.isPlayer = isPlayer;
        this.treadDist = 180; // Ecartement des chenilles
        this.hp = 100;
        this.exteriorAlpha = 1; // Gestion du FadeOut
        this.width = 300;
        this.height = 350;
        
        // Configuration personnages (Étagères 3x1)
        this.characters = isPlayer 
            ?[{ id: 0, type: 'char_elf', offsetX: -80, offsetY: -100, isDead: false },
               { id: 1, type: 'char_knight', offsetX: 0, offsetY: -200, isDead: false },
               { id: 2, type: 'char_mage', offsetX: 80, offsetY: -100, isDead: false }]
            :[{ id: 0, type: 'char_cyclops', offsetX: -80, offsetY: -100, isDead: false },
               { id: 1, type: 'char_cyclops', offsetX: 0, offsetY: -200, isDead: false },
               { id: 2, type: 'char_cyclops', offsetX: 80, offsetY: -100, isDead: false }];
               
        this.updatePhysics();
    }

    updatePhysics() {
        // Position locale des 2 chenilles
        this.leftTread = { x: this.baseX - this.treadDist/2 };
        this.leftTread.y = getGroundY(this.leftTread.x) - 30; // 30 = rayon de la chenille
        this.leftTread.angle = getGroundAngle(this.leftTread.x);

        this.rightTread = { x: this.baseX + this.treadDist/2 };
        this.rightTread.y = getGroundY(this.rightTread.x) - 30;
        this.rightTread.angle = getGroundAngle(this.rightTread.x);

        // Support en bois positionné sur les 2 chenilles
        this.supportX = (this.leftTread.x + this.rightTread.x) / 2;
        this.supportY = (this.leftTread.y + this.rightTread.y) / 2 - 20; // posé dessus
        this.supportAngle = Math.atan2(this.rightTread.y - this.leftTread.y, this.treadDist);
    }

    getDamageState() {
        if (this.hp > 70) return 0;
        if (this.hp > 30) return 1;
        return 2;
    }

    // Récupère la position absolue d'un personnage pour le point de tir
    getCharWorldPos(charIndex) {
        let char = this.characters[charIndex];
        // Transformation locale -> monde
        let wx = this.supportX + char.offsetX * Math.cos(this.supportAngle) - char.offsetY * Math.sin(this.supportAngle);
        let wy = this.supportY + char.offsetX * Math.sin(this.supportAngle) + char.offsetY * Math.cos(this.supportAngle);
        return { x: wx, y: wy - 100 }; // Ajusté pour le haut du château
    }

    takeDamage(amount) {
        this.hp = Math.max(0, this.hp - amount);
        camera.shake = 20;
        document.getElementById('damage-overlay').style.opacity = '1';
        setTimeout(() => { document.getElementById('damage-overlay').style.opacity = '0'; }, 200);
        
        for(let i=0; i<20; i++) particles.push(new Particle(this.supportX + (Math.random()-0.5)*200, this.supportY - 150 + (Math.random()-0.5)*150, 'particle_debris'));
    }

    draw(ctx) {
        // Animation du FadeOut si c'est le tour d'un château
        let targetAlpha = (GAME.state === (this.isPlayer ? 'PLAYER_TURN' : 'ENEMY_TURN') || GAME.state === (this.isPlayer ? 'PLAYER_SHOOT' : 'ENEMY_SHOOT')) ? 0 : 1;
        this.exteriorAlpha += (targetAlpha - this.exteriorAlpha) * 0.1;

        // 1. CHENILLES
        ctx.save(); ctx.translate(this.leftTread.x, this.leftTread.y); ctx.rotate(this.leftTread.angle);
        ctx.drawImage(IMAGES.tread, -70, -30, 140, 60); ctx.restore();
        
        ctx.save(); ctx.translate(this.rightTread.x, this.rightTread.y); ctx.rotate(this.rightTread.angle);
        ctx.drawImage(IMAGES.tread, -70, -30, 140, 60); ctx.restore();

        // 2. SYSTÈME SUPÉRIEUR (Support + Château)
        ctx.save();
        ctx.translate(this.supportX, this.supportY);
        ctx.rotate(this.supportAngle);

        // Support en bois
        ctx.drawImage(IMAGES.support, -150, -20, 300, 60);

        // Décalage pour le château (posé sur le support)
        ctx.translate(0, -this.height + 20);

        // INTÉRIEUR (Toujours dessiné, mais masqué par l'extérieur si alpha = 1)
        ctx.drawImage(IMAGES.interior, -this.width/2, 0, this.width, this.height);
        
        // Étagères et Personnages
        let crackLevel = this.getDamageState();
        this.characters.forEach((char, idx) => {
            // Dessin Étagère
            let shelfImg = crackLevel > 0 ? IMAGES.shelf_cracked : IMAGES.shelf_intact;
            ctx.drawImage(shelfImg, char.offsetX - 50, char.offsetY + 80, 100, 20);
            
            // Dessin Personnage
            if (char.isDead) {
                ctx.drawImage(IMAGES.rip, char.offsetX - 30, char.offsetY, 60, 80);
            } else {
                ctx.drawImage(IMAGES[char.type], char.offsetX - 40, char.offsetY - 20, 80, 100);
                // Highlight si joueur actif
                if (this.isPlayer && idx === activeCharIndex && GAME.state === 'PLAYER_TURN') {
                    ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.arc(char.offsetX, char.offsetY + 30, 50 + Math.sin(time*10)*5, 0, Math.PI*2); ctx.stroke();
                }
            }
        });

        // EXTÉRIEUR (Fading out)
        if (this.exteriorAlpha > 0.01) {
            ctx.globalAlpha = this.exteriorAlpha;
            let castleImgKey = (this.isPlayer ? 'castle_blue_' : 'castle_dark_') + crackLevel;
            ctx.drawImage(IMAGES[castleImgKey], -this.width/2, 0, this.width, this.height);
        }

        ctx.restore();
    }
}

class Projectile {
    constructor(x, y, vx, vy, type, target) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.type = type; // 'missile' ou 'bird'
        this.target = target;
        this.active = true;
        
        if(type === 'bird') {
            this.baseY = y;
            this.phase = Math.random() * Math.PI * 2;
            this.startX = x;
            this.distTotal = Math.abs(target.supportX - x);
        }
    }

    update() {
        if (!this.active) return;

        if (this.type === 'missile') {
            this.vy += GAME.gravity;
            this.x += this.vx; this.y += this.vy;
            if(time % 0.1 < 0.02) particles.push(new Particle(this.x, this.y, 'particle_smoke'));
        } else {
            let dir = Math.sign(this.target.supportX - this.x);
            this.x += dir * 18;
            let progress = Math.abs(this.x - this.startX) / this.distTotal;
            this.baseY += (this.target.supportY - 150 - this.baseY) * 0.05;
            this.y = this.baseY + Math.sin(time * 15 + this.phase) * 100 * (1 - progress); // Sinusoïde
            if(time % 0.1 < 0.03) particles.push(new Particle(this.x, this.y, 'particle_smoke'));
        }

        // Hit Detection (Sur la hitbox du château)
        let tx = this.target.supportX; let ty = this.target.supportY;
        if (this.x > tx - 150 && this.x < tx + 150 && this.y > ty - 350 && this.y < ty) {
            this.active = false;
            this.target.takeDamage(15);
            // Tue un perso
            let aliveChars = this.target.characters.filter(c => !c.isDead);
            if(aliveChars.length > 0) aliveChars[Math.floor(Math.random() * aliveChars.length)].isDead = true;
            return;
        }
        
        // Miss (Sol ou Hors-cadre)
        if (this.y > getGroundY(this.x) || this.x < -500 || this.x > GAME.width + 500) {
            this.active = false;
            if (this.y > getGroundY(this.x)) {
                camera.shake = 5;
                for(let i=0; i<5; i++) particles.push(new Particle(this.x, this.y, 'particle_debris'));
            }
        }
    }

    draw(ctx) {
        if (!this.active) return;
        ctx.save(); ctx.translate(this.x, this.y);
        if (this.type === 'missile') {
            ctx.rotate(Math.atan2(this.vy, this.vx));
            ctx.drawImage(IMAGES.missile, -30, -10, 60, 20);
        } else {
            let dir = Math.sign(this.target.supportX - this.x);
            if(dir < 0) ctx.scale(-1, 1);
            ctx.drawImage(IMAGES.bird, -20, -20, 40, 40);
        }
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, imgKey) {
        this.x = x; this.y = y; this.imgKey = imgKey;
        this.vx = (Math.random() - 0.5) * 15;
        this.vy = (Math.random() - 0.5) * 15 - 5;
        this.life = 1.0;
        this.size = Math.random() * 20 + 10;
    }
    update() {
        if (this.imgKey === 'particle_debris') this.vy += GAME.gravity;
        this.x += this.vx; this.y += this.vy;
        this.life -= 0.03;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.drawImage(IMAGES[this.imgKey], this.x - this.size/2, this.y - this.size/2, this.size, this.size);
        ctx.globalAlpha = 1;
    }
}

let player, enemy;

function startGame() {
    player = new VehicleCastle(400, true);
    enemy = new VehicleCastle(2100, false);
    changeState('ENEMY_TURN'); // L'ennemi commence toujours !
    requestAnimationFrame(loop);
}

// --- GESTION INPUTS (SUIT LA SOURIS) ---
window.addEventListener('pointermove', e => {
    input.clientX = e.clientX; input.clientY = e.clientY;
    
    // Le curseur suit la souris en mode Visée
    if (GAME.state === 'PLAYER_TURN' && !input.active) {
        fingerCursor.style.left = e.clientX + 'px';
        fingerCursor.style.top = e.clientY + 'px';
        fingerCursor.style.display = 'block';
    } else {
        fingerCursor.style.display = 'none';
    }

    if (!input.active) return;
    input.currX = e.clientX; input.currY = e.clientY;
});

window.addEventListener('pointerdown', e => {
    if (e.target.classList.contains('char-btn')) return; // Évite conflit UI
    if (GAME.state !== 'PLAYER_TURN') return;
    input.active = true;
    input.startX = e.clientX; input.startY = e.clientY;
    input.currX = e.clientX; input.currY = e.clientY;
});

window.addEventListener('pointerup', e => {
    if (!input.active || GAME.state !== 'PLAYER_TURN') return;
    input.active = false;
    
    let dx = input.startX - input.currX;
    let dy = input.startY - input.currY;
    
    if (Math.hypot(dx, dy) > 20) {
        let origin = player.getCharWorldPos(activeCharIndex);
        
        // Faisceau de missiles
        for(let i=-1; i<=1; i++) {
            let vx = (dx * 0.12) + i*0.5;
            let vy = (dy * 0.12) + i*0.5;
            projectiles.push(new Projectile(origin.x, origin.y, vx, vy, 'missile', enemy));
        }
        changeState('PROJECTILE_FLIGHT');
    }
});

document.querySelectorAll('.char-btn').forEach((btn, index) => {
    btn.addEventListener('pointerdown', () => {
        document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        activeCharIndex = index;
    });
});

// --- MACHINE À ÉTATS ---
function changeState(newState) {
    GAME.state = newState;
    
    switch(newState) {
        case 'ENEMY_TURN':
            uiSelection.style.display = 'none';
            camera.targetX = enemy.supportX; camera.targetZoom = 1.52; // Zoom ajusté (-5%)
            setTimeout(() => {
                let originY = enemy.supportY - 200;
                let type = Math.random() > 0.5 ? 'missile' : 'bird';
                
                if(type === 'missile') {
                    for(let i=0; i<3; i++) projectiles.push(new Projectile(enemy.supportX - 50, originY, -15 - Math.random()*5, -15 - Math.random()*5, 'missile', player));
                } else {
                    let b1 = new Projectile(enemy.supportX - 50, originY, 0, 0, 'bird', player);
                    let b2 = new Projectile(enemy.supportX - 50, originY, 0, 0, 'bird', player);
                    b2.phase += Math.PI; // Opposition de phase
                    projectiles.push(b1, b2);
                }
                changeState('PROJECTILE_FLIGHT');
            }, 1500);
            break;
            
        case 'PLAYER_TURN':
            camera.targetX = player.supportX; camera.targetZoom = 1.52;
            uiSelection.style.display = 'flex';
            break;
            
        case 'PROJECTILE_FLIGHT':
            uiSelection.style.display = 'none';
            camera.targetZoom = 1.2;
            break;
            
        case 'DAMAGE_SETTLE':
            camera.targetZoom = 1.0;
            camera.targetX = GAME.width / 2;
            
            if(player.hp <= 0 || enemy.hp <= 0) {
                setTimeout(() => changeState('GAME_OVER'), 1500);
            } else {
                // Tour par tour
                setTimeout(() => changeState(player.exteriorAlpha < 0.5 ? 'ENEMY_TURN' : 'PLAYER_TURN'), 1500);
            }
            break;
            
        case 'GAME_OVER':
            document.getElementById('end-screen').style.display = 'flex';
            document.getElementById('end-title').innerText = player.hp > 0 ? "VICTOIRE !" : "DÉFAITE...";
            break;
    }
}

// --- BOUCLE PRINCIPALE ---
function update() {
    time += 0.016;
    
    // Lerp Caméra
    camera.x += (camera.targetX - camera.x) * 0.08;
    camera.y += (camera.targetY - camera.y) * 0.08;
    camera.zoom += (camera.targetZoom - camera.zoom) * 0.08;
    camera.shake *= 0.9;

    projectiles.forEach(p => p.update());
    particles.forEach(p => p.update());
    
    projectiles = projectiles.filter(p => p.active);
    particles = particles.filter(p => p.life > 0);

    // Suivi Caméra
    if (GAME.state === 'PROJECTILE_FLIGHT') {
        if (projectiles.length > 0) {
            let avgX = projectiles.reduce((s, p) => s + p.x, 0) / projectiles.length;
            camera.targetX = avgX;
        } else {
            changeState('DAMAGE_SETTLE');
        }
    }
}

function drawTrajectory(ctx, sx, sy, dx, dy) {
    let x = sx; let y = sy;
    let vx = dx * 0.12; let vy = dy * 0.12;
    let radius = 15;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    for(let i=0; i<30; i++) {
        vy += GAME.gravity; x += vx; y += vy;
        if(i%2 === 0) { // Un point sur deux
            ctx.beginPath(); ctx.arc(x, y, Math.max(2, radius), 0, Math.PI*2); ctx.fill();
            radius *= 0.85;
        }
    }
}

function draw() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    // Background 
    ctx.drawImage(IMAGES.bg_landscape, 0, 0, canvas.width, canvas.height);

    ctx.save();
    // Transformations monde
    ctx.translate(canvas.width/2, canvas.height/2 + 100); // Decalage vertical
    ctx.scale(camera.zoom, camera.zoom);
    ctx.translate(-camera.x + (Math.random()-0.5)*camera.shake, -camera.y + (Math.random()-0.5)*camera.shake);

    // Dessin Sol continu (rempli jusqu'en bas)
    let pattern = ctx.createPattern(IMAGES.ground_pattern, 'repeat');
    ctx.fillStyle = pattern;
    ctx.beginPath();
    ctx.moveTo(-1000, GAME.height + 1000);
    ctx.lineTo(-1000, getGroundY(-1000));
    for(let x=-1000; x<=GAME.width+1000; x+=50) {
        ctx.lineTo(x, getGroundY(x));
    }
    ctx.lineTo(GAME.width+1000, GAME.height + 1000);
    ctx.fill();
    // Ligne de bordure herbe
    ctx.strokeStyle = '#2E7D32'; ctx.lineWidth = 15; ctx.stroke();

    player.draw(ctx);
    enemy.draw(ctx);

    projectiles.forEach(p => p.draw(ctx));
    particles.forEach(p => p.draw(ctx));

    // Trajectoire Visée
    if (GAME.state === 'PLAYER_TURN' && input.active) {
        let origin = player.getCharWorldPos(activeCharIndex);
        drawTrajectory(ctx, origin.x, origin.y, input.startX - input.currX, input.startY - input.currY);
    }

    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

function openStore() {
    if (typeof mraid !== 'undefined') mraid.open("https://apps.apple.com/");
    else window.open("https://apps.apple.com/", "_blank");
}
</script>
